primitives:
  physics:
    defines: The science concerned with describing the interactions of energy, matter,
      space, and time, especially the fundamental mechanisms underlying every phenomenon.
    tier: 0
    source_domain: college_physics_ch01
  observation:
    defines: The act of noticing and recording phenomena in the natural world, treated
      as the foundational empirical act of science.
    tier: 0
    source_domain: college_physics_ch01
  measurement:
    defines: The quantitative determination of a physical property, either by direct
      procedure or by calculation from other measurements.
    tier: 0
    source_domain: college_physics_ch01
  reference_frame:
    defines: A coordinate backdrop relative to which the position of an object is
      described, often taken as the Earth or a moving vehicle.
    tier: 0
    source_domain: college_physics_ch02
    also_in:
    - college_physics_ch03
  position:
    defines: The location of an object at a particular time, specified relative to
      a chosen reference frame.
    tier: 0
    source_domain: college_physics_ch02
  time:
    defines: The interval over which change occurs, measured in seconds (SI) and calibrated
      against a standard.
    tier: 0
    source_domain: college_physics_ch02
  vector:
    defines: A quantity that has both magnitude and direction, represented graphically
      by an arrow whose length is proportional to magnitude.
    tier: 0
    source_domain: college_physics_ch02
    also_in:
    - college_physics_ch03
  scalar:
    defines: A quantity that has magnitude only, with no associated direction.
    tier: 0
    source_domain: college_physics_ch02
    also_in:
    - college_physics_ch03
  velocity:
    defines: Speed in a given direction; a vector quantity with both magnitude and
      direction.
    tier: 0
    source_domain: college_physics_ch03
    also_in:
    - college_physics_ch04
    - college_physics_ch07
    - college_physics_ch08
    - college_physics_ch12
    - college_physics_ch16
    - college_physics_ch22
  acceleration:
    defines: The rate of change of velocity; a vector quantity assumed known from
      prior one-dimensional study.
    tier: 0
    source_domain: college_physics_ch03
    also_in:
    - college_physics_ch04
    - college_physics_ch06
    - college_physics_ch16
  pythagorean_theorem:
    defines: The mathematical relationship c² = a² + b² relating the two legs and
      hypotenuse of a right triangle, used without derivation to find vector magnitudes.
    tier: 0
    source_domain: college_physics_ch03
  trigonometric_functions:
    defines: The sine, cosine, and tangent ratios that relate angles to side lengths
      in a right triangle, assumed known and applied to vectors.
    tier: 0
    source_domain: college_physics_ch03
  one_dimensional_kinematics:
    defines: Equations of motion for constant acceleration along a single axis, reviewed
      as prior knowledge and extended to each axis independently in 2D.
    tier: 0
    source_domain: college_physics_ch03
  force:
    defines: A push or pull on an object that has both magnitude and direction, making
      it a vector quantity.
    tier: 0
    source_domain: college_physics_ch04
    also_in:
    - college_physics_ch07
    - college_physics_ch09
    - college_physics_ch10
    - college_physics_ch11
    - college_physics_ch12
    - college_physics_ch16
  mass:
    defines: The quantity of matter in an object, measured in kilograms, which does
      not vary with location.
    tier: 0
    source_domain: college_physics_ch04
    also_in:
    - college_physics_ch06
    - college_physics_ch07
    - college_physics_ch08
    - college_physics_ch09
    - college_physics_ch10
    - college_physics_ch11
    - college_physics_ch13
    - college_physics_ch16
  gravitational_acceleration:
    defines: The constant acceleration g (≈9.8 m/s²) experienced by all objects in
      free fall near Earth's surface, independent of mass.
    tier: 0
    source_domain: college_physics_ch04
    also_in:
    - college_physics_ch07
    - college_physics_ch11
  dynamics:
    defines: The branch of physics that studies how forces cause objects and systems
      to move.
    tier: 0
    source_domain: college_physics_ch04
  coefficient_of_static_friction:
    defines: A dimensionless material-pair constant μ_s that sets the upper limit
      of static friction relative to the normal force; determined empirically and
      listed in reference tables.
    tier: 0
    source_domain: college_physics_ch05
  coefficient_of_kinetic_friction:
    defines: A dimensionless material-pair constant μ_k, always less than μ_s, that
      gives the ratio of kinetic friction force to normal force; determined empirically.
    tier: 0
    source_domain: college_physics_ch05
  drag_coefficient:
    defines: A dimensionless empirical constant C that characterizes how much drag
      a particular object shape and size produces in a fluid, typically measured in
      a wind tunnel.
    tier: 0
    source_domain: college_physics_ch05
  fluid_density:
    defines: Mass per unit volume of the fluid through which an object moves, a given
      material property that enters the quadratic drag force formula.
    tier: 0
    source_domain: college_physics_ch05
    also_in:
    - college_physics_ch12
  fluid_viscosity:
    defines: A property of a fluid (symbol η) that measures its resistance to flow,
      appearing as a given constant in Stokes' law for drag on small slow objects.
    tier: 0
    source_domain: college_physics_ch05
  youngs_modulus:
    defines: A material-specific constant Y (units N/m²) that relates tensile or compressive
      stress to strain; listed in reference tables and treated as a given property
      of the substance.
    tier: 0
    source_domain: college_physics_ch05
  shear_modulus:
    defines: A material-specific constant S (units N/m²) that characterizes a material's
      resistance to shear deformation, given in reference tables.
    tier: 0
    source_domain: college_physics_ch05
  bulk_modulus:
    defines: A material-specific constant B (units N/m²) that characterizes resistance
      to uniform volumetric compression, given in reference tables.
    tier: 0
    source_domain: college_physics_ch05
  linear_displacement:
    defines: The straight-line distance an object travels, used as the translational
      analogue to rotation angle.
    tier: 0
    source_domain: college_physics_ch06
  linear_velocity:
    defines: The rate of change of position along a path; in circular motion, this
      is the tangential speed at a point on the rotating object.
    tier: 0
    source_domain: college_physics_ch06
    also_in:
    - college_physics_ch10
  friction_force:
    defines: A contact force that opposes relative motion between surfaces, providing
      the centripetal force in unbanked curves.
    tier: 0
    source_domain: college_physics_ch06
  spring_constant:
    defines: The proportionality constant k in Hooke's law (F = kx) characterizing
      a spring's stiffness, introduced by reference to a prior chapter without re-derivation
      here.
    tier: 0
    source_domain: college_physics_ch07
  translational_kinetic_energy:
    defines: The kinetic energy of an object moving in a straight line, (1/2)mv²,
      assumed known from prior chapters.
    tier: 0
    source_domain: college_physics_ch10
  volume:
    defines: The amount of three-dimensional space occupied by a substance or object.
    tier: 0
    source_domain: college_physics_ch11
    also_in:
    - college_physics_ch13
    - college_physics_ch15
  area:
    defines: The extent of a two-dimensional surface, measured in square meters.
    tier: 0
    source_domain: college_physics_ch11
  cross_sectional_area:
    defines: The area of a surface perpendicular to the direction of fluid flow through
      a conduit.
    tier: 0
    source_domain: college_physics_ch12
  energy:
    defines: The capacity to do work, existing in kinetic, potential, and other forms.
    tier: 0
    source_domain: college_physics_ch16
    also_in:
    - college_physics_ch29
  electric_charge:
    defines: A physical property of matter that causes it to experience a force near
      other charged matter, existing in two types (positive and negative) with a fundamental
      unit of 1.60 × 10⁻¹⁹ C.
    tier: 0
    source_domain: college_physics_ch18
    also_in:
    - college_physics_ch19
    - college_physics_ch20
    - college_physics_ch21
    - college_physics_ch22
    - college_physics_ch24
    - college_physics_ch30
  proton:
    defines: The subatomic particle in the atomic nucleus that carries the fundamental
      unit of positive charge, equal in magnitude to the electron's charge.
    tier: 0
    source_domain: college_physics_ch18
    also_in:
    - college_physics_ch31
  coulomb_force:
    defines: The conservative electrostatic force between charged objects proportional
      to the product of charges and inversely proportional to the square of the distance.
    tier: 0
    source_domain: college_physics_ch19
    also_in:
    - college_physics_ch20
    - college_physics_ch30
  free_charges:
    defines: Electrons in a metallic conductor that are not bound to individual atoms
      and can move freely through the lattice in response to an electric field.
    tier: 0
    source_domain: college_physics_ch20
  voltage:
    defines: The electrical potential energy per unit charge between two points in
      a circuit, measured in volts.
    tier: 0
    source_domain: college_physics_ch21
  permittivity_of_free_space:
    defines: The fundamental constant ε₀ relating electric field strength to the force
      between charges in a vacuum.
    tier: 0
    source_domain: college_physics_ch24
  gauss_law_electricity:
    defines: Electric field lines originate on positive charges and terminate on negative
      charges, quantified by the permittivity of free space.
    tier: 0
    source_domain: college_physics_ch24
  gauss_law_magnetism:
    defines: Magnetic field lines are continuous with no beginning or end, reflecting
      the absence of magnetic monopoles.
    tier: 0
    source_domain: college_physics_ch24
  wave_frequency_wavelength:
    defines: Frequency is the number of complete cycles per second (Hz) and wavelength
      is the distance between successive peaks; they are inversely related at a fixed
      propagation speed.
    tier: 0
    source_domain: college_physics_ch24
  light_ray:
    defines: Light is modeled as traveling in straight lines called rays that may
      change direction only when encountering matter or boundaries between media.
    tier: 0
    source_domain: college_physics_ch25
  speed_of_light_vacuum:
    defines: The fundamental constant c ≈ 3.00×10⁸ m/s representing the maximum speed
      at which light travels, occurring only in a vacuum.
    tier: 0
    source_domain: college_physics_ch25
  refractive_index:
    defines: A dimensionless number describing how much a medium bends light relative
      to vacuum, determining the speed of light in that medium.
    tier: 0
    source_domain: college_physics_ch26
  thin_lens_equation:
    defines: The relationship 1/do + 1/di = 1/f connecting object distance, image
      distance, and focal length for a thin lens.
    tier: 0
    source_domain: college_physics_ch26
  convex_lens:
    defines: A lens that is thicker in the center than at the edges, causing parallel
      light rays to converge to a focal point.
    tier: 0
    source_domain: college_physics_ch26
  concave_lens:
    defines: A lens that is thinner in the center than at the edges, causing light
      rays to diverge.
    tier: 0
    source_domain: college_physics_ch26
  wavefront:
    defines: A surface connecting all points of a wave that are in the same phase,
      such as a crest or trough.
    tier: 0
    source_domain: college_physics_ch27
  inertial_reference_frame:
    defines: A reference frame in which a body at rest remains at rest and a body
      in motion moves at constant speed in a straight line unless acted on by an outside
      force.
    tier: 0
    source_domain: college_physics_ch28
  rest_mass:
    defines: The mass of an object as measured by an observer at rest relative to
      the object.
    tier: 0
    source_domain: college_physics_ch28
  classical_velocity_addition:
    defines: The method of adding velocities as simple vectors, where u = v + u’,
      valid only at speeds much less than c.
    tier: 0
    source_domain: college_physics_ch28
  classical_momentum:
    defines: The product of mass and velocity, p = mv, valid as an approximation at
      low speeds.
    tier: 0
    source_domain: college_physics_ch28
  classical_kinetic_energy:
    defines: The energy of motion given by KE = ½mv², valid as an approximation at
      speeds much less than c.
    tier: 0
    source_domain: college_physics_ch28
  electromagnetic_radiation:
    defines: Waves of oscillating electric and magnetic fields that propagate at the
      speed of light and are characterized by frequency and wavelength.
    tier: 0
    source_domain: college_physics_ch29
    also_in:
    - college_physics_ch30
  momentum:
    defines: A conserved quantity equal to mass times velocity for massive objects,
      representing the quantity of motion.
    tier: 0
    source_domain: college_physics_ch29
  atom:
    defines: The basic unit of elements, consisting of a central positively charged
      nucleus surrounded by negatively charged electrons.
    tier: 0
    source_domain: college_physics_ch30
  classical_angular_momentum:
    defines: The rotational analog of linear momentum for a body in orbit, equal to
      mvr.
    tier: 0
    source_domain: college_physics_ch30
  nucleus:
    defines: A dense central region of an atom consisting of protons and neutrons.
    tier: 0
    source_domain: college_physics_ch31
  neutron:
    defines: An electrically neutral nucleon found in the nucleus with mass approximately
      1.008665 u.
    tier: 0
    source_domain: college_physics_ch31
  electromagnetic_force:
    defines: The long-range force between charged particles, including the repulsive
      Coulomb force between protons.
    tier: 0
    source_domain: college_physics_ch31
    also_in:
    - college_physics_ch33
  wave_function:
    defines: A quantum mechanical function whose square gives the probability of finding
      a particle at a given location.
    tier: 0
    source_domain: college_physics_ch31
  ionization:
    defines: The process of removing electrons from atoms or molecules, requiring
      only a few eV of energy per event.
    tier: 0
    source_domain: college_physics_ch31
  radioactive_decay:
    defines: The spontaneous transformation of an unstable nucleus, emitting alpha,
      beta, or gamma radiation.
    tier: 0
    source_domain: college_physics_ch32
  coulomb_repulsion:
    defines: The electrostatic repulsive force between like-charged particles such
      as protons in nuclei.
    tier: 0
    source_domain: college_physics_ch32
  nuclear_force:
    defines: The short-range attractive force between nucleons that binds nuclei together.
    tier: 0
    source_domain: college_physics_ch32
  conservation_of_mass_energy:
    defines: The principle that total mass-energy is conserved in all processes, with
      E = mc² relating mass and energy.
    tier: 0
    source_domain: college_physics_ch33
  galaxy:
    defines: A gravitationally bound system of billions of stars, gas, dust, and dark
      matter.
    tier: 0
    source_domain: college_physics_ch34
  escape_velocity:
    defines: The minimum speed an object must have to escape the gravitational pull
      of a massive body without further propulsion.
    tier: 0
    source_domain: college_physics_ch34
  special_relativity:
    defines: Einstein's theory where the speed of light is constant for all observers
      in uniform relative motion.
    tier: 0
    source_domain: college_physics_ch34
  quantum_mechanics:
    defines: The branch of physics describing matter and energy at atomic and subatomic
      scales using probabilistic wave functions.
    tier: 0
    source_domain: college_physics_ch34
concepts:
  scientific_method:
    defines: A structured process of inquiry beginning with observation and question,
      proceeding through hypothesis formation and experimental testing, and concluding
      with analysis and conclusion.
    composed_of:
    - observation
    tier: 1
    source_domain: college_physics_ch01
  scientific_model:
    defines: A representation of something too difficult or impossible to display
      directly, justified by experimental evidence but accurate only under limited
      conditions.
    composed_of:
    - observation
    tier: 1
    source_domain: college_physics_ch01
  scientific_law:
    defines: A concise description, often expressed as a mathematical equation, of
      a generalized pattern in nature supported by repeated experiments and observations.
    composed_of:
    - observation
    - measurement
    tier: 1
    source_domain: college_physics_ch01
  classical_physics:
    defines: Physics developed from the Renaissance through the 19th century, providing
      accurate descriptions of macroscopic systems moving well below the speed of
      light in weak gravitational fields.
    composed_of:
    - physics
    tier: 1
    source_domain: college_physics_ch01
  physical_quantity:
    defines: A characteristic or property of an object that can be measured directly
      or calculated from other measurements.
    composed_of:
    - measurement
    tier: 1
    source_domain: college_physics_ch01
  accuracy:
    defines: The degree to which a measured value agrees with the accepted correct
      value for that measurement.
    composed_of:
    - measurement
    tier: 1
    source_domain: college_physics_ch01
  precision:
    defines: The degree to which repeated measurements made under the same conditions
      agree with one another.
    composed_of:
    - measurement
    tier: 1
    source_domain: college_physics_ch01
  order_of_magnitude:
    defines: The scale of a value expressed as the nearest power of 10, used to compare
      quantities that differ by large factors.
    composed_of:
    - measurement
    tier: 1
    source_domain: college_physics_ch01
  scientific_theory:
    defines: A testable, broadly applicable explanation for patterns in nature that
      is supported by scientific evidence and verified multiple times by various groups
      of researchers.
    composed_of:
    - scientific_method
    - scientific_model
    tier: 2
    source_domain: college_physics_ch01
  modern_physics:
    defines: The branch of physics encompassing relativity and quantum mechanics,
      which describe objects moving near the speed of light or phenomena at microscopic
      scales.
    composed_of:
    - classical_physics
    tier: 2
    source_domain: college_physics_ch01
  units:
    defines: Standardized values used to express and compare measurements of physical
      quantities.
    composed_of:
    - physical_quantity
    tier: 2
    source_domain: college_physics_ch01
  uncertainty:
    defines: A quantitative estimate, expressed as ±δA, of how much a measured value
      may deviate from the true or expected value.
    composed_of:
    - accuracy
    - precision
    tier: 2
    source_domain: college_physics_ch01
  significant_figures:
    defines: The digits in a measured value that convey its precision, with defined
      rules for counting them and for limiting precision in calculated results.
    composed_of:
    - precision
    tier: 2
    source_domain: college_physics_ch01
  fundamental_units:
    defines: 'Units defined solely by the procedure used to measure them; this text
      uses four: meter (length), kilogram (mass), second (time), and ampere (electric
      current).'
    composed_of:
    - units
    tier: 3
    source_domain: college_physics_ch01
  unit_conversion:
    defines: The process of expressing a measured value in a different unit by multiplying
      by a conversion factor chosen so the original unit cancels and the desired unit
      remains.
    composed_of:
    - units
    tier: 3
    source_domain: college_physics_ch01
  percent_uncertainty:
    defines: The ratio of the uncertainty of a measurement to the measured value multiplied
      by 100%, giving a relative measure of measurement reliability.
    composed_of:
    - uncertainty
    tier: 3
    source_domain: college_physics_ch01
  derived_units:
    defines: Units formed by algebraic combinations of fundamental units, such as
      speed expressed as meters per second.
    composed_of:
    - fundamental_units
    tier: 4
    source_domain: college_physics_ch01
  si_units:
    defines: The internationally agreed-upon metric system of units, built on fundamental
      units and organized by powers of 10, used as the standard in science.
    composed_of:
    - fundamental_units
    tier: 4
    source_domain: college_physics_ch01
  metric_prefixes:
    defines: Standard symbols (such as kilo-, milli-, nano-) that denote specific
      powers of 10 relative to a base SI unit, enabling the same unit to span vast
      ranges of magnitude.
    composed_of:
    - si_units
    tier: 5
    source_domain: college_physics_ch01
  coordinate_system:
    defines: A one-dimensional number line embedded in a reference frame that assigns
      positive and negative signs to the two possible directions of motion.
    composed_of:
    - reference_frame
    - vector
    tier: 1
    source_domain: college_physics_ch02
  displacement:
    defines: The change in position of an object, Δx = x_f − x_i, which is a vector
      quantity carrying both magnitude and direction.
    composed_of:
    - position
    - vector
    tier: 1
    source_domain: college_physics_ch02
    also_in:
    - college_physics_ch03
    - college_physics_ch07
    - college_physics_ch16
  elapsed_time:
    defines: The difference between the ending and beginning times of a motion, Δt
      = t_f − t_0, measured in seconds.
    composed_of:
    - time
    tier: 1
    source_domain: college_physics_ch02
  distance:
    defines: The magnitude of the displacement between two positions; a scalar with
      no directional sign.
    composed_of:
    - displacement
    - scalar
    tier: 2
    source_domain: college_physics_ch02
  distance_traveled:
    defines: The total length of the path taken between two positions, which can exceed
      the magnitude of displacement when the path is not straight.
    composed_of:
    - displacement
    - scalar
    tier: 2
    source_domain: college_physics_ch02
  average_velocity:
    defines: Displacement divided by elapsed time, v̄ = Δx/Δt; a vector quantity whose
      SI unit is m/s.
    composed_of:
    - displacement
    - elapsed_time
    tier: 2
    source_domain: college_physics_ch02
  instantaneous_velocity:
    defines: The velocity of an object at a specific instant in time, obtained as
      the limiting value of average velocity over an infinitesimally small time interval.
    composed_of:
    - average_velocity
    tier: 3
    source_domain: college_physics_ch02
  average_speed:
    defines: The total distance traveled divided by elapsed time; a scalar that can
      exceed the magnitude of average velocity for non-straight paths.
    composed_of:
    - distance_traveled
    - elapsed_time
    tier: 3
    source_domain: college_physics_ch02
  average_acceleration:
    defines: The rate of change of velocity, ā = Δv/Δt; a vector whose SI unit is
      m/s².
    composed_of:
    - average_velocity
    - elapsed_time
    tier: 3
    source_domain: college_physics_ch02
  instantaneous_speed:
    defines: The magnitude of the instantaneous velocity at a given moment; a scalar
      quantity with no direction.
    composed_of:
    - instantaneous_velocity
    - scalar
    tier: 4
    source_domain: college_physics_ch02
  instantaneous_acceleration:
    defines: The acceleration of an object at a specific instant in time, obtained
      as the limiting value of average acceleration over an infinitesimally small
      interval.
    composed_of:
    - average_acceleration
    tier: 4
    source_domain: college_physics_ch02
  deceleration:
    defines: Acceleration whose direction is opposite to the direction of velocity,
      always resulting in a decrease in speed.
    composed_of:
    - average_acceleration
    - average_velocity
    tier: 4
    source_domain: college_physics_ch02
  kinematic_equations_constant_acceleration:
    defines: The four algebraic equations (v = v₀ + at; x = x₀ + v̄t; x = x₀ + v₀t
      + ½at²; v² = v₀² + 2aΔx) that relate displacement, velocity, acceleration, and
      time under the assumption that acceleration is constant.
    composed_of:
    - displacement
    - elapsed_time
    - average_velocity
    - average_acceleration
    tier: 4
    source_domain: college_physics_ch02
  acceleration_due_to_gravity:
    defines: The constant downward acceleration experienced by freely falling objects
      near Earth's surface, g ≈ 9.80 m/s², independent of the object's mass when air
      resistance is negligible.
    composed_of:
    - average_acceleration
    tier: 4
    source_domain: college_physics_ch02
    also_in:
    - college_physics_ch03
    - college_physics_ch06
  free_fall:
    defines: The idealized state of motion in which an object accelerates solely under
      gravity with no air resistance or friction, allowing kinematic equations to
      be applied with a = −g.
    composed_of:
    - kinematic_equations_constant_acceleration
    - acceleration_due_to_gravity
    tier: 5
    source_domain: college_physics_ch02
    also_in:
    - college_physics_ch04
  two_dimensional_kinematics:
    defines: The study of motion in a plane by describing it with horizontal and vertical
      vector components that together give the straight-line path.
    composed_of:
    - vector
    - displacement
    tier: 1
    source_domain: college_physics_ch03
  vector_components:
    defines: The perpendicular (x and y) parts into which a two-dimensional vector
      is decomposed, each acting independently along its own axis.
    composed_of:
    - vector
    tier: 1
    source_domain: college_physics_ch03
  resultant_vector:
    defines: The single vector that is the sum of two or more vectors, representing
      the net effect of all combined vectors.
    composed_of:
    - vector
    tier: 1
    source_domain: college_physics_ch03
  scalar_multiplication_of_vectors:
    defines: Multiplying a vector by a scalar changes its magnitude by that factor;
      a negative scalar also reverses the vector's direction.
    composed_of:
    - vector
    - scalar
    tier: 1
    source_domain: college_physics_ch03
  independence_of_perpendicular_motions:
    defines: The principle that horizontal and vertical components of two-dimensional
      motion do not affect each other; motion along one axis has no influence on motion
      along the perpendicular axis.
    composed_of:
    - two_dimensional_kinematics
    - vector_components
    tier: 2
    source_domain: college_physics_ch03
  graphical_vector_addition:
    defines: The head-to-tail method of adding vectors by drawing each to scale and
      direction, with the resultant drawn from the tail of the first to the head of
      the last.
    composed_of:
    - vector
    - resultant_vector
    tier: 2
    source_domain: college_physics_ch03
  vector_subtraction:
    defines: The operation of subtracting a vector by adding its negative—a vector
      of equal magnitude pointing in the opposite direction.
    composed_of:
    - vector
    - scalar_multiplication_of_vectors
    tier: 2
    source_domain: college_physics_ch03
  resolving_vectors_into_components:
    defines: Decomposing a vector of known magnitude and direction into its perpendicular
      x- and y-components using Ax = A cosθ and Ay = A sinθ.
    composed_of:
    - vector_components
    - trigonometric_functions
    tier: 2
    source_domain: college_physics_ch03
  relative_velocity:
    defines: The velocity of an object as observed from a particular reference frame,
      obtained by vector addition of the object's velocity relative to a medium and
      the medium's velocity relative to the observer.
    composed_of:
    - velocity
    - reference_frame
    - resultant_vector
    tier: 2
    source_domain: college_physics_ch03
  analytical_vector_addition:
    defines: Adding vectors by summing their corresponding perpendicular components,
      then using the Pythagorean theorem and inverse tangent to find the resultant's
      magnitude and direction.
    composed_of:
    - resolving_vectors_into_components
    - resultant_vector
    tier: 3
    source_domain: college_physics_ch03
  classical_relativity:
    defines: The study of how different observers in relative motion measure the same
      phenomenon, valid for speeds much less than the speed of light (below ~3000
      km/s).
    composed_of:
    - relative_velocity
    - reference_frame
    tier: 3
    source_domain: college_physics_ch03
  projectile_motion:
    defines: Two-dimensional motion of an object subject only to gravitational acceleration,
      analyzed as independent constant-velocity horizontal motion and free-fall vertical
      motion.
    composed_of:
    - independence_of_perpendicular_motions
    - one_dimensional_kinematics
    - acceleration_due_to_gravity
    - vector_components
    tier: 3
    source_domain: college_physics_ch03
  velocity_addition:
    defines: The process of combining velocities from different reference frames using
      vector addition of components to find the resultant velocity relative to a chosen
      observer.
    composed_of:
    - relative_velocity
    - analytical_vector_addition
    tier: 4
    source_domain: college_physics_ch03
  trajectory:
    defines: The parabolic path a projectile follows through the air, formed by combining
      constant horizontal velocity with uniformly accelerated vertical motion.
    composed_of:
    - projectile_motion
    tier: 4
    source_domain: college_physics_ch03
  projectile_range:
    defines: The horizontal distance traveled by a projectile on level ground, given
      by R = v₀² sin(2θ₀) / g, maximized at a launch angle of 45°.
    composed_of:
    - projectile_motion
    - trigonometric_functions
    tier: 4
    source_domain: college_physics_ch03
  projectile_maximum_height:
    defines: The peak altitude reached by a projectile, determined solely by its initial
      vertical velocity component via H = v₀y² / (2g).
    composed_of:
    - projectile_motion
    tier: 4
    source_domain: college_physics_ch03
  free_body_diagram:
    defines: A sketch showing all external forces acting on a body, with the body
      represented as a single point and forces as vectors.
    composed_of:
    - force
    - dynamics
    tier: 1
    source_domain: college_physics_ch04
  inertia:
    defines: The tendency of an object to remain at rest or to remain in motion at
      constant velocity, measured by its mass.
    composed_of:
    - mass
    - velocity
    tier: 1
    source_domain: college_physics_ch04
  newtons_first_law:
    defines: A body at rest remains at rest, or if in motion remains in motion at
      constant velocity, unless acted on by a net external force.
    composed_of:
    - inertia
    - force
    tier: 2
    source_domain: college_physics_ch04
    also_in:
    - college_physics_ch06
  system_of_interest:
    defines: The defined boundary around an object or collection of objects under
      analysis, used to distinguish external from internal forces.
    composed_of:
    - force
    - dynamics
    tier: 1
    source_domain: college_physics_ch04
  net_external_force:
    defines: The vector sum of all forces acting on a system from outside its defined
      boundary, which is the only force that causes acceleration.
    composed_of:
    - force
    - system_of_interest
    tier: 2
    source_domain: college_physics_ch04
    also_in:
    - college_physics_ch08
    - college_physics_ch09
  newtons_second_law:
    defines: The acceleration of a system is directly proportional to and in the same
      direction as the net external force, and inversely proportional to its mass
      (F = ma).
    composed_of:
    - net_external_force
    - mass
    - acceleration
    tier: 3
    source_domain: college_physics_ch04
    also_in:
    - college_physics_ch06
  weight:
    defines: The gravitational force on an object of mass m, given by W = mg, which
      varies with location depending on the local gravitational acceleration.
    composed_of:
    - mass
    - gravitational_acceleration
    tier: 1
    source_domain: college_physics_ch04
    also_in:
    - college_physics_ch09
  newtons_third_law:
    defines: Whenever one body exerts a force on a second body, the first body experiences
      a force equal in magnitude and opposite in direction.
    composed_of:
    - force
    tier: 1
    source_domain: college_physics_ch04
    also_in:
    - college_physics_ch08
  friction:
    defines: A force that opposes relative motion between surfaces that are in contact,
      always acting parallel to and against the direction of motion.
    composed_of:
    - force
    tier: 1
    source_domain: college_physics_ch04
    also_in:
    - college_physics_ch05
  normal_force:
    defines: The contact force a surface exerts on an object perpendicular to the
      surface, supporting the object against forces pressing into the surface.
    composed_of:
    - force
    tier: 1
    source_domain: college_physics_ch04
    also_in:
    - college_physics_ch05
    - college_physics_ch06
    - college_physics_ch09
  tension:
    defines: The pulling force transmitted along the length of a flexible connector
      such as a rope or cable, always directed parallel to the connector.
    composed_of:
    - force
    tier: 1
    source_domain: college_physics_ch04
  thrust:
    defines: A reaction force that propels a body forward in response to expelling
      mass backward, as in rockets or jet propulsion.
    composed_of:
    - newtons_third_law
    tier: 2
    source_domain: college_physics_ch04
  inertial_frame_of_reference:
    defines: A non-accelerating coordinate system in which all forces are real and
      Newton's laws hold in their standard form.
    composed_of:
    - newtons_first_law
    - acceleration
    tier: 3
    source_domain: college_physics_ch04
    also_in:
    - college_physics_ch06
  weight_components_on_incline:
    defines: The resolution of gravitational force into a component parallel to an
      inclined surface (mg sin θ) and one perpendicular to it (mg cos θ).
    composed_of:
    - weight
    - normal_force
    tier: 2
    source_domain: college_physics_ch04
  drag_force:
    defines: A resistive force exerted by a fluid on a moving object that opposes
      the motion; for large fast objects it is proportional to the square of speed,
      F_D = ½CρAv².
    composed_of:
    - drag_coefficient
    - fluid_density
    tier: 1
    source_domain: college_physics_ch05
  deformation:
    defines: A change in an object's shape or size produced by an applied force; for
      small deformations the object returns to its original shape when the force is
      removed (elastic deformation).
    composed_of: []
    tier: 1
    source_domain: college_physics_ch05
  static_friction:
    defines: The friction force between two surfaces that are not moving relative
      to each other, which responds to applied force up to a maximum of f_s ≤ μ_s
      N.
    composed_of:
    - friction
    - coefficient_of_static_friction
    tier: 2
    source_domain: college_physics_ch05
  kinetic_friction:
    defines: The friction force between two surfaces in relative motion, given by
      f_k = μ_k N, which is constant and less than the maximum static friction.
    composed_of:
    - friction
    - coefficient_of_kinetic_friction
    tier: 2
    source_domain: college_physics_ch05
  stokes_law:
    defines: The drag force formula for small objects moving slowly in a dense fluid,
      F_s = 6πrηv, where drag is proportional to the object's radius, fluid viscosity,
      and speed.
    composed_of:
    - drag_force
    - fluid_viscosity
    tier: 2
    source_domain: college_physics_ch05
  terminal_velocity:
    defines: The constant maximum velocity reached by a falling object when the drag
      force exactly balances the gravitational force, producing zero net force and
      zero acceleration.
    composed_of:
    - drag_force
    tier: 2
    source_domain: college_physics_ch05
  hookes_law:
    defines: The proportional relationship between applied force F and the resulting
      deformation ΔL for small deformations, expressed as F = kΔL where k depends
      on material and geometry.
    composed_of:
    - deformation
    tier: 2
    source_domain: college_physics_ch05
    also_in:
    - college_physics_ch16
  stress:
    defines: The ratio of applied force to cross-sectional area (F/A), measured in
      N/m², that quantifies the internal force intensity within a deformed material.
    composed_of:
    - deformation
    tier: 2
    source_domain: college_physics_ch05
  strain:
    defines: The dimensionless ratio of the change in length to the original length
      (ΔL/L₀) that quantifies the fractional deformation of a material.
    composed_of:
    - deformation
    tier: 2
    source_domain: college_physics_ch05
  tension_compression_deformation:
    defines: Change in length of a rod or wire under a force applied parallel to its
      length, given by ΔL = (1/Y)(F/A)L₀, where Y is Young's modulus.
    composed_of:
    - stress
    - strain
    - youngs_modulus
    tier: 3
    source_domain: college_physics_ch05
  shear_deformation:
    defines: Deformation perpendicular to the original length produced by a force
      applied parallel to the cross-sectional area, given by Δx = (1/S)(F/A)L₀.
    composed_of:
    - stress
    - shear_modulus
    tier: 3
    source_domain: college_physics_ch05
  bulk_compression:
    defines: Uniform reduction in volume when inward forces are applied evenly on
      all surfaces of an object, given by ΔV/V₀ = −F/(B·A).
    composed_of:
    - stress
    - bulk_modulus
    tier: 3
    source_domain: college_physics_ch05
  tensile_strength:
    defines: The maximum stress a material can withstand before it permanently deforms
      or fractures.
    composed_of:
    - stress
    tier: 3
    source_domain: college_physics_ch05
  radian:
    defines: The dimensionless unit of angle measurement defined so that one full
      revolution equals 2π radians.
    tier: 1
    source_domain: college_physics_ch06
  uniform_circular_motion:
    defines: Motion along a circular path at constant speed, in which the direction
      of velocity continuously changes.
    composed_of:
    - linear_velocity
    tier: 1
    source_domain: college_physics_ch06
  gravitational_constant:
    defines: The universal proportionality constant G ≈ 6.674×10⁻¹¹ N·m²/kg² appearing
      in Newton's law of gravitation, determined experimentally by the Cavendish experiment.
    composed_of:
    - mass
    tier: 1
    source_domain: college_physics_ch06
  center_of_mass:
    defines: The point at which the entire mass of an object or system can be considered
      concentrated for the purpose of calculating gravitational and inertial effects.
    composed_of:
    - mass
    tier: 1
    source_domain: college_physics_ch06
  rotation_angle:
    defines: The ratio of arc length to radius of curvature (Δθ = Δs/r), measured
      in radians, representing the amount of rotation.
    composed_of:
    - radian
    tier: 2
    source_domain: college_physics_ch06
    also_in:
    - college_physics_ch10
  non_inertial_frame_of_reference:
    defines: An accelerating or rotating frame of reference in which fictitious forces
      must be introduced to explain observed motion.
    composed_of:
    - inertial_frame_of_reference
    - acceleration
    tier: 2
    source_domain: college_physics_ch06
  newtons_law_of_gravitation:
    defines: Every particle attracts every other particle with a force proportional
      to the product of their masses and inversely proportional to the square of the
      distance between them (F = Gm₁m₂/r²).
    composed_of:
    - gravitational_constant
    - mass
    tier: 2
    source_domain: college_physics_ch06
  arc_length:
    defines: The distance Δs traveled along a circular path, equal to the product
      of the radius and the rotation angle (Δs = rΔθ).
    composed_of:
    - rotation_angle
    tier: 3
    source_domain: college_physics_ch06
  angular_velocity:
    defines: The rate of change of rotation angle with time (ω = Δθ/Δt), measured
      in radians per second.
    composed_of:
    - rotation_angle
    tier: 3
    source_domain: college_physics_ch06
    also_in:
    - college_physics_ch09
    - college_physics_ch10
    - college_physics_ch23
  fictitious_force:
    defines: An apparent force with no physical origin that arises when analyzing
      motion from a non-inertial (accelerating or rotating) frame of reference.
    composed_of:
    - non_inertial_frame_of_reference
    tier: 3
    source_domain: college_physics_ch06
  keplers_first_law:
    defines: The orbit of each planet (or satellite) about the Sun (or parent body)
      is an ellipse with the parent body at one focus.
    composed_of:
    - newtons_law_of_gravitation
    tier: 3
    source_domain: college_physics_ch06
  keplers_second_law:
    defines: A line from the parent body to the orbiting object sweeps out equal areas
      in equal times, implying the object moves faster when closer to the parent.
    composed_of:
    - newtons_law_of_gravitation
    tier: 3
    source_domain: college_physics_ch06
  tangential_speed:
    defines: The linear speed of a point on a rotating object, related to angular
      velocity by v = rω, and directed tangent to the circular path.
    composed_of:
    - angular_velocity
    tier: 4
    source_domain: college_physics_ch06
  coriolis_force:
    defines: A fictitious force in a rotating frame that deflects moving objects perpendicular
      to their motion, to the right in the northern hemisphere and to the left in
      the southern hemisphere.
    composed_of:
    - fictitious_force
    - angular_velocity
    tier: 4
    source_domain: college_physics_ch06
  weightlessness:
    defines: The condition experienced by an object in free fall or orbit where the
      apparent net gravitational acceleration is negligible compared to that at Earth's
      surface.
    composed_of:
    - acceleration_due_to_gravity
    - newtons_first_law
    tier: 4
    source_domain: college_physics_ch06
  centripetal_acceleration:
    defines: The acceleration directed toward the center of a circular path experienced
      during uniform circular motion, with magnitude ac = v²/r = rω².
    composed_of:
    - uniform_circular_motion
    - tangential_speed
    - acceleration
    tier: 5
    source_domain: college_physics_ch06
    also_in:
    - college_physics_ch10
  centripetal_force:
    defines: Any net force directed toward the center of curvature that causes uniform
      circular motion, with magnitude Fc = mv²/r = mrω².
    composed_of:
    - centripetal_acceleration
    - mass
    - newtons_second_law
    tier: 6
    source_domain: college_physics_ch06
    also_in:
    - college_physics_ch22
  centrifugal_force:
    defines: A fictitious outward force perceived in a rotating non-inertial frame,
      which in an inertial frame is explained by inertia carrying objects in a straight
      line.
    composed_of:
    - fictitious_force
    - centripetal_force
    tier: 7
    source_domain: college_physics_ch06
  keplers_third_law:
    defines: The square of the orbital period of a satellite is proportional to the
      cube of its average orbital radius (T² ∝ r³), derivable from Newton's law of
      gravitation.
    composed_of:
    - newtons_law_of_gravitation
    - centripetal_force
    tier: 7
    source_domain: college_physics_ch06
  work:
    defines: The transfer of energy by a force acting on an object through a displacement,
      equal to the product of force magnitude, displacement magnitude, and the cosine
      of the angle between them (W = Fd cos θ).
    composed_of:
    - force
    - displacement
    tier: 1
    source_domain: college_physics_ch07
    also_in:
    - college_physics_ch14
    - college_physics_ch19
  kinetic_energy:
    defines: The energy an object possesses by virtue of its translational motion,
      equal to one-half the product of its mass and the square of its speed (KE =
      ½mv²).
    composed_of:
    - mass
    - velocity
    tier: 1
    source_domain: college_physics_ch07
    also_in:
    - college_physics_ch08
    - college_physics_ch12
    - college_physics_ch13
    - college_physics_ch14
    - college_physics_ch15
    - college_physics_ch19
    - college_physics_ch31
  joule:
    defines: The SI unit of work and energy, defined as one newton-meter (1 J = 1
      N·m), used for all forms of mechanical energy in this chapter.
    composed_of:
    - work
    tier: 2
    source_domain: college_physics_ch07
  net_work:
    defines: The total work done on a system by the vector sum (net force) of all
      forces acting on it, equal to the sum of work contributions from each individual
      force.
    composed_of:
    - work
    tier: 2
    source_domain: college_physics_ch07
  gravitational_potential_energy:
    defines: The stored energy of an object-Earth system due to the object's vertical
      position, equal to the product of mass, gravitational acceleration, and height
      above a chosen reference (PE_grav = mgh).
    composed_of:
    - work
    - mass
    - gravitational_acceleration
    tier: 2
    source_domain: college_physics_ch07
    also_in:
    - college_physics_ch10
    - college_physics_ch12
  conservative_force:
    defines: A force for which the work done between any two points depends only on
      those endpoints and not on the path taken, allowing the definition of a corresponding
      potential energy.
    composed_of:
    - work
    tier: 2
    source_domain: college_physics_ch07
    also_in:
    - college_physics_ch19
  power:
    defines: The rate at which work is done or energy is transferred, equal to work
      divided by the time interval (P = W/t), measured in watts (1 W = 1 J/s).
    composed_of:
    - work
    tier: 2
    source_domain: college_physics_ch07
    also_in:
    - college_physics_ch17
  work_energy_theorem:
    defines: The principle that the net work done on a system equals the change in
      its kinetic energy (W_net = ΔKE), derived from Newton's second law and kinematics.
    composed_of:
    - net_work
    - kinetic_energy
    tier: 3
    source_domain: college_physics_ch07
  potential_energy:
    defines: Energy stored in a system due to its position, shape, or configuration
      that is fully recoverable as work; defined for any conservative force as the
      work done against that force to reach a given configuration.
    composed_of:
    - conservative_force
    - work
    tier: 3
    source_domain: college_physics_ch07
    also_in:
    - college_physics_ch15
    - college_physics_ch19
  spring_potential_energy:
    defines: The potential energy stored in a compressed or stretched spring obeying
      Hooke's law, equal to one-half the spring constant times the square of the deformation
      (PE_spring = ½kx²).
    composed_of:
    - potential_energy
    - spring_constant
    tier: 4
    source_domain: college_physics_ch07
  mechanical_energy:
    defines: The sum of an object's or system's kinetic energy and all of its potential
      energies (ME = KE + PE), which remains constant when only conservative forces
      act.
    composed_of:
    - kinetic_energy
    - potential_energy
    tier: 4
    source_domain: college_physics_ch07
  conservation_of_mechanical_energy:
    defines: The principle that the total mechanical energy of a system is constant
      whenever only conservative forces act, so that any decrease in potential energy
      equals the increase in kinetic energy and vice versa.
    composed_of:
    - mechanical_energy
    - conservative_force
    tier: 5
    source_domain: college_physics_ch07
  nonconservative_force:
    defines: A force for which the work done between two points depends on the path
      taken, so that no potential energy can be defined for it and it changes the
      total mechanical energy of a system.
    composed_of:
    - conservative_force
    - mechanical_energy
    tier: 5
    source_domain: college_physics_ch07
  thermal_energy:
    defines: The internal energy of an object associated with the random microscopic
      motions of its atoms and molecules, produced when nonconservative forces such
      as friction dissipate mechanical energy.
    composed_of:
    - nonconservative_force
    tier: 6
    source_domain: college_physics_ch07
    also_in:
    - college_physics_ch13
  law_of_conservation_of_energy:
    defines: The universal law stating that the total energy of an isolated system
      is constant in any process; energy may change form or be transferred between
      systems, but the total amount never changes.
    composed_of:
    - mechanical_energy
    - thermal_energy
    tier: 7
    source_domain: college_physics_ch07
  efficiency:
    defines: The ratio of useful work output to total energy input for a device or
      process, always less than one because some energy is inevitably converted to
      less useful forms such as thermal energy.
    composed_of:
    - work
    - thermal_energy
    tier: 7
    source_domain: college_physics_ch07
  linear_momentum:
    defines: The product of a system's mass and its velocity, a vector quantity in
      the same direction as velocity with SI unit kg·m/s.
    composed_of:
    - mass
    - velocity
    tier: 1
    source_domain: college_physics_ch08
    also_in:
    - college_physics_ch10
  isolated_system:
    defines: A system for which the net external force is zero, so no external agent
      can change its total momentum.
    composed_of:
    - net_external_force
    tier: 1
    source_domain: college_physics_ch08
  internal_kinetic_energy:
    defines: The sum of the kinetic energies of all objects within a system, used
      to classify collision types.
    composed_of:
    - kinetic_energy
    tier: 1
    source_domain: college_physics_ch08
  point_mass:
    defines: An idealized structureless particle that has mass but no rotational degrees
      of freedom, used to simplify two-dimensional collision analysis.
    composed_of:
    - mass
    tier: 1
    source_domain: college_physics_ch08
  rocket_thrust:
    defines: The reaction force on a rocket produced by the expulsion of exhaust gases,
      equal to the exhaust velocity multiplied by the mass ejection rate.
    composed_of:
    - newtons_third_law
    tier: 1
    source_domain: college_physics_ch08
  newtons_second_law_momentum:
    defines: The net external force on a system equals the rate of change of its momentum,
      expressed as F_net = Δp/Δt.
    composed_of:
    - net_external_force
    - linear_momentum
    tier: 2
    source_domain: college_physics_ch08
  impulse:
    defines: The product of the average net external force and the time interval over
      which it acts, equal to the change in momentum of the system.
    composed_of:
    - net_external_force
    - linear_momentum
    tier: 2
    source_domain: college_physics_ch08
  conservation_of_momentum:
    defines: The total momentum of an isolated system remains constant; the initial
      total momentum equals the final total momentum.
    composed_of:
    - linear_momentum
    - isolated_system
    tier: 2
    source_domain: college_physics_ch08
    also_in:
    - college_physics_ch31
    - college_physics_ch33
  rocket_acceleration:
    defines: The net acceleration of a rocket, given by the exhaust velocity times
      the mass ejection rate divided by the remaining rocket mass, minus gravitational
      acceleration.
    composed_of:
    - rocket_thrust
    - mass
    tier: 2
    source_domain: college_physics_ch08
  elastic_collision:
    defines: A collision in which both total momentum and total internal kinetic energy
      of the system are conserved.
    composed_of:
    - conservation_of_momentum
    - internal_kinetic_energy
    tier: 3
    source_domain: college_physics_ch08
  inelastic_collision:
    defines: A collision in which total momentum is conserved but internal kinetic
      energy is not, with some energy converted to heat, sound, or deformation.
    composed_of:
    - conservation_of_momentum
    - internal_kinetic_energy
    tier: 3
    source_domain: college_physics_ch08
  two_dimensional_collision:
    defines: A collision analyzed by resolving momentum conservation independently
      along two perpendicular axes, yielding one conservation equation per axis.
    composed_of:
    - conservation_of_momentum
    - point_mass
    tier: 3
    source_domain: college_physics_ch08
  perfectly_inelastic_collision:
    defines: A special case of inelastic collision in which the colliding objects
      stick together, maximally reducing internal kinetic energy while still conserving
      momentum.
    composed_of:
    - inelastic_collision
    tier: 4
    source_domain: college_physics_ch08
  pivot_point:
    defines: The chosen reference point about which torques are calculated; any point
      may be selected, but the choice affects computed torque values.
    composed_of:
    - force
    tier: 1
    source_domain: college_physics_ch09
  center_of_gravity:
    defines: The single point where the total weight of a body is assumed to be concentrated
      for the purpose of calculating torques.
    composed_of:
    - weight
    - mass
    tier: 1
    source_domain: college_physics_ch09
  mechanical_advantage:
    defines: The ratio of the output force to the input force for a simple machine,
      indicating how much the machine multiplies the applied force.
    composed_of:
    - force
    tier: 1
    source_domain: college_physics_ch09
  perpendicular_lever_arm:
    defines: The shortest distance from the pivot point to the line along which the
      force acts, used to simplify torque calculations.
    composed_of:
    - pivot_point
    - force
    tier: 2
    source_domain: college_physics_ch09
  fulcrum:
    defines: The fixed pivot point of a lever about which the bar rotates.
    composed_of:
    - pivot_point
    tier: 2
    source_domain: college_physics_ch09
  simple_machine:
    defines: A device that multiplies or redirects an applied force, often trading
      force magnitude for distance, with mechanical advantage determined by lever-arm
      ratios.
    composed_of:
    - force
    - mechanical_advantage
    tier: 2
    source_domain: college_physics_ch09
  torque:
    defines: The rotational effectiveness of a force, defined as the product of the
      force magnitude, the distance from the pivot point, and the sine of the angle
      between the force and the lever arm vector.
    composed_of:
    - force
    - perpendicular_lever_arm
    tier: 3
    source_domain: college_physics_ch09
    also_in:
    - college_physics_ch10
  lever:
    defines: A rigid bar that rotates about a fixed fulcrum and transmits force, with
      mechanical advantage equal to the ratio of input to output lever arms.
    composed_of:
    - simple_machine
    - fulcrum
    - perpendicular_lever_arm
    tier: 3
    source_domain: college_physics_ch09
  pulley:
    defines: A simple machine consisting of a wheel and rope that changes the direction
      of a force and, in compound arrangements, multiplies it.
    composed_of:
    - simple_machine
    tier: 3
    source_domain: college_physics_ch09
  inclined_plane:
    defines: A flat surface set at an angle to the horizontal that reduces the input
      force needed to raise a load by increasing the distance over which the force
      is applied.
    composed_of:
    - simple_machine
    tier: 3
    source_domain: college_physics_ch09
  equilibrium:
    defines: A state of a system in which there is no linear or rotational acceleration,
      requiring both net external force and net external torque to be zero.
    composed_of:
    - net_external_force
    - torque
    tier: 4
    source_domain: college_physics_ch09
    also_in:
    - college_physics_ch16
  static_equilibrium:
    defines: A state of equilibrium in which the system is motionless and both the
      net external force and net external torque are zero.
    composed_of:
    - equilibrium
    tier: 5
    source_domain: college_physics_ch09
  dynamic_equilibrium:
    defines: A state of equilibrium in which the system moves at constant velocity
      while the net external force and net external torque remain zero.
    composed_of:
    - equilibrium
    tier: 5
    source_domain: college_physics_ch09
  first_condition_equilibrium:
    defines: The requirement that the net external force on a system must be zero
      in every direction for equilibrium to be achieved.
    composed_of:
    - net_external_force
    - equilibrium
    tier: 5
    source_domain: college_physics_ch09
  second_condition_equilibrium:
    defines: The requirement that the net external torque on a system about any pivot
      point must be zero for equilibrium to be achieved.
    composed_of:
    - torque
    - equilibrium
    - pivot_point
    tier: 5
    source_domain: college_physics_ch09
  stable_equilibrium:
    defines: An equilibrium state in which a displaced system experiences a restoring
      net force or torque directed opposite to the displacement.
    composed_of:
    - equilibrium
    - center_of_gravity
    tier: 5
    source_domain: college_physics_ch09
  unstable_equilibrium:
    defines: An equilibrium state in which a displaced system experiences a net force
      or torque in the same direction as the displacement, causing it to accelerate
      away.
    composed_of:
    - equilibrium
    - center_of_gravity
    tier: 5
    source_domain: college_physics_ch09
  neutral_equilibrium:
    defines: An equilibrium state in which the system remains in equilibrium regardless
      of small displacements from its original position.
    composed_of:
    - equilibrium
    tier: 5
    source_domain: college_physics_ch09
  base_of_support:
    defines: The area beneath a body bounded by its contact points with the ground,
      which must contain the vertical projection of the center of gravity for stable
      equilibrium.
    composed_of:
    - center_of_gravity
    - stable_equilibrium
    tier: 6
    source_domain: college_physics_ch09
  angular_acceleration:
    defines: The rate of change of angular velocity with time (α = Δω/Δt), expressed
      in rad/s²; positive when ω increases, negative when ω decreases.
    composed_of:
    - angular_velocity
    tier: 1
    source_domain: college_physics_ch10
  moment_of_inertia:
    defines: The rotational analog of mass, defined as the sum of mr² for all point
      masses composing an object (I = Σmr²); depends on both the total mass and how
      that mass is distributed relative to the rotation axis.
    composed_of:
    - mass
    tier: 1
    source_domain: college_physics_ch10
  tangential_acceleration:
    defines: The component of linear acceleration tangent to the circular path that
      changes the speed (not direction) of a rotating object, related to angular acceleration
      by a_t = rα.
    composed_of:
    - angular_acceleration
    tier: 2
    source_domain: college_physics_ch10
  rotational_kinematics:
    defines: The set of four equations relating rotation angle, angular velocity,
      angular acceleration, and time for constant angular acceleration, exactly analogous
      to the translational kinematic equations.
    composed_of:
    - rotation_angle
    - angular_velocity
    - angular_acceleration
    tier: 2
    source_domain: college_physics_ch10
  newtons_second_law_rotation:
    defines: The rotational analog of F = ma, stating that net torque equals moment
      of inertia times angular acceleration (τ_net = Iα).
    composed_of:
    - torque
    - moment_of_inertia
    - angular_acceleration
    tier: 2
    source_domain: college_physics_ch10
  rotational_work:
    defines: Work done by a torque acting through an angle of rotation, given by W
      = τθ; the rotational analog of translational work W = Fd.
    composed_of:
    - torque
    - rotation_angle
    tier: 2
    source_domain: college_physics_ch10
  rotational_kinetic_energy:
    defines: The kinetic energy of a rotating object due to its spin, given by KE_rot
      = (1/2)Iω²; exactly analogous to translational kinetic energy with I replacing
      m and ω replacing v.
    composed_of:
    - moment_of_inertia
    - angular_velocity
    tier: 2
    source_domain: college_physics_ch10
  angular_momentum:
    defines: The rotational analog of linear momentum, defined as the product of moment
      of inertia and angular velocity (L = Iω), with units of kg·m²/s.
    composed_of:
    - moment_of_inertia
    - angular_velocity
    tier: 2
    source_domain: college_physics_ch10
  work_energy_theorem_rotation:
    defines: The principle that net rotational work done on a rigid object equals
      the change in its rotational kinetic energy (W_net = ΔKE_rot).
    composed_of:
    - rotational_work
    - rotational_kinetic_energy
    tier: 3
    source_domain: college_physics_ch10
  torque_angular_momentum_relation:
    defines: The principle that net torque equals the rate of change of angular momentum
      (τ_net = ΔL/Δt), the rotational form of Newton's second law in terms of momentum.
    composed_of:
    - torque
    - angular_momentum
    tier: 3
    source_domain: college_physics_ch10
  right_hand_rule:
    defines: 'The convention for determining the direction of angular velocity, angular
      momentum, and torque vectors: the right-hand thumb points along the rotation
      axis in the direction of the vector when fingers curl in the direction of rotation.'
    composed_of:
    - angular_velocity
    - torque
    - angular_momentum
    tier: 3
    source_domain: college_physics_ch10
  conservation_of_angular_momentum:
    defines: The law stating that the total angular momentum of a system remains constant
      when the net external torque is zero (L_initial = L_final), leading to the result
      that reducing moment of inertia increases angular velocity.
    composed_of:
    - torque_angular_momentum_relation
    tier: 4
    source_domain: college_physics_ch10
  fluid:
    defines: A state of matter (liquid, gas, or plasma) that yields to shearing forces
      and flows.
    composed_of:
    - force
    tier: 1
    source_domain: college_physics_ch11
  density:
    defines: The mass per unit volume of a substance, defined as ρ = m/V.
    composed_of:
    - mass
    - volume
    tier: 1
    source_domain: college_physics_ch11
    also_in:
    - college_physics_ch13
    - college_physics_ch17
  pressure:
    defines: The force per unit area perpendicular to the surface over which the force
      is applied, defined as P = F/A.
    composed_of:
    - force
    - area
    tier: 1
    source_domain: college_physics_ch11
    also_in:
    - college_physics_ch12
    - college_physics_ch13
    - college_physics_ch15
    - college_physics_ch17
  cohesive_forces:
    defines: Attractive forces between molecules of the same type.
    composed_of:
    - force
    tier: 1
    source_domain: college_physics_ch11
  adhesive_forces:
    defines: Attractive forces between molecules of different types.
    composed_of:
    - force
    tier: 1
    source_domain: college_physics_ch11
  pressure_depth_relation:
    defines: The pressure due to the weight of a fluid at depth h is given by P =
      ρgh, increasing linearly with depth for incompressible fluids.
    composed_of:
    - density
    - pressure
    - gravitational_acceleration
    tier: 2
    source_domain: college_physics_ch11
  atmospheric_pressure:
    defines: The pressure exerted by the weight of the atmosphere above a given point,
      with a standard value of 1.01 × 10⁵ N/m² at sea level.
    composed_of:
    - pressure
    - fluid
    tier: 2
    source_domain: college_physics_ch11
  pascals_principle:
    defines: A change in pressure applied to an enclosed fluid is transmitted undiminished
      to all portions of the fluid and to the walls of its container.
    composed_of:
    - pressure
    - fluid
    tier: 2
    source_domain: college_physics_ch11
  specific_gravity:
    defines: The dimensionless ratio of the density of an object to the density of
      water at 4.00°C.
    composed_of:
    - density
    tier: 2
    source_domain: college_physics_ch11
  surface_tension:
    defines: The force per unit length exerted by a liquid surface that causes it
      to contract to the smallest possible area, defined as γ = F/L.
    composed_of:
    - cohesive_forces
    tier: 2
    source_domain: college_physics_ch11
  contact_angle:
    defines: The angle θ between the tangent to the liquid surface and the solid surface,
      indicating the relative strength of cohesive versus adhesive forces.
    composed_of:
    - cohesive_forces
    - adhesive_forces
    tier: 2
    source_domain: college_physics_ch11
  gauge_pressure:
    defines: The pressure measured relative to atmospheric pressure, positive above
      atmospheric and negative below.
    composed_of:
    - atmospheric_pressure
    tier: 3
    source_domain: college_physics_ch11
  buoyant_force:
    defines: The net upward force on any object in any fluid, arising because pressure
      increases with depth.
    composed_of:
    - pressure_depth_relation
    - fluid
    tier: 3
    source_domain: college_physics_ch11
  capillary_action:
    defines: The tendency of a fluid to be raised or suppressed in a narrow tube due
      to the interplay of cohesive and adhesive forces, with height h = 2γ cos θ /
      (ρgr).
    composed_of:
    - surface_tension
    - contact_angle
    - density
    - gravitational_acceleration
    tier: 3
    source_domain: college_physics_ch11
  absolute_pressure:
    defines: The total pressure equal to the sum of gauge pressure and atmospheric
      pressure.
    composed_of:
    - gauge_pressure
    tier: 4
    source_domain: college_physics_ch11
  archimedes_principle:
    defines: The buoyant force on an object equals the weight of the fluid it displaces
      (F_b = w_fl).
    composed_of:
    - buoyant_force
    tier: 4
    source_domain: college_physics_ch11
  flow_rate:
    defines: The volume of fluid passing a point per unit time, Q = V/t, related to
      velocity by Q = Av.
    composed_of:
    - velocity
    - cross_sectional_area
    tier: 1
    source_domain: college_physics_ch12
  incompressible_fluid:
    defines: A fluid whose density remains constant regardless of pressure changes,
      such that the same volume flows past any point in a given time.
    composed_of:
    - fluid_density
    tier: 1
    source_domain: college_physics_ch12
  equation_of_continuity:
    defines: For an incompressible fluid, the flow rate is constant along a pipe,
      so A₁v₁ = A₂v₂, meaning speed increases where cross-sectional area decreases.
    composed_of:
    - flow_rate
    - incompressible_fluid
    tier: 2
    source_domain: college_physics_ch12
  bernoullis_equation:
    defines: 'A statement of conservation of energy for an incompressible frictionless
      fluid: P + ½ρv² + ρgh = constant along a streamline.'
    composed_of:
    - pressure
    - kinetic_energy
    - gravitational_potential_energy
    - conservation_of_energy
    - incompressible_fluid
    tier: 2
    source_domain: college_physics_ch12
  bernoullis_principle:
    defines: 'Bernoulli''s equation applied at constant depth, showing that pressure
      decreases where fluid speed increases: P₁ + ½ρv₁² = P₂ + ½ρv₂².'
    composed_of:
    - bernoullis_equation
    tier: 3
    source_domain: college_physics_ch12
  torricellis_theorem:
    defines: The speed of fluid flowing from an opening at depth h below the surface
      equals √(2gh), as if the fluid had fallen that distance freely.
    composed_of:
    - bernoullis_equation
    tier: 3
    source_domain: college_physics_ch12
  power_in_fluid_flow:
    defines: The rate of energy transfer in a fluid, obtained by multiplying each
      term in Bernoulli's equation by the flow rate Q, giving contributions from pressure,
      kinetic energy, and gravitational potential energy.
    composed_of:
    - bernoullis_equation
    - flow_rate
    tier: 3
    source_domain: college_physics_ch12
  viscosity:
    defines: A measure of internal friction in a fluid, defined by F = ηvA/L, where
      η is the coefficient of viscosity relating shear force to velocity gradient.
    composed_of:
    - force
    - velocity
    tier: 1
    source_domain: college_physics_ch12
  laminar_flow:
    defines: Smooth fluid flow in parallel layers that do not mix, characterized by
      streamlines that remain distinct.
    composed_of:
    - viscosity
    tier: 2
    source_domain: college_physics_ch12
  turbulent_flow:
    defines: Irregular fluid flow characterized by eddies and swirls that mix fluid
      layers, caused by obstructions or high speeds.
    composed_of:
    - viscosity
    tier: 2
    source_domain: college_physics_ch12
  streamlines:
    defines: Paths followed by small volumes of fluid, which are smooth and continuous
      in laminar flow but break up in turbulent flow.
    composed_of:
    - laminar_flow
    - turbulent_flow
    tier: 3
    source_domain: college_physics_ch12
  flow_resistance:
    defines: The opposition to fluid flow in a conduit, relating pressure difference
      to flow rate by Q = (P₂ − P₁)/R.
    composed_of:
    - pressure
    - flow_rate
    tier: 2
    source_domain: college_physics_ch12
  poiseuilles_law:
    defines: 'The law governing laminar flow through a tube: Q = (P₂ − P₁)πr⁴/(8ηl),
      where resistance R = 8ηl/(πr⁴) depends on viscosity, length, and the fourth
      power of radius.'
    composed_of:
    - laminar_flow
    - flow_resistance
    tier: 3
    source_domain: college_physics_ch12
  reynolds_number:
    defines: A dimensionless quantity NR = 2ρvr/η that predicts whether flow is laminar
      (below ~2000) or turbulent (above ~3000).
    composed_of:
    - fluid_density
    - velocity
    - viscosity
    tier: 2
    source_domain: college_physics_ch12
  viscous_drag:
    defines: A velocity-dependent resistance force exerted on an object moving through
      a viscous fluid, given by Stokes' law Fs = 6πrηv for a small sphere in laminar
      flow.
    composed_of:
    - viscosity
    - laminar_flow
    tier: 3
    source_domain: college_physics_ch12
  terminal_speed:
    defines: The constant speed reached when viscous drag and buoyant force balance
      gravitational force on a falling object, so its acceleration becomes zero.
    composed_of:
    - viscous_drag
    - force
    tier: 4
    source_domain: college_physics_ch12
  diffusion:
    defines: 'The movement of substances due to random thermal molecular motion, where
      the average distance traveled is proportional to the square root of time: x_rms
      = √(2Dt).'
    composed_of:
    - velocity
    tier: 1
    source_domain: college_physics_ch12
    also_in:
    - college_physics_ch20
  diffusion_constant:
    defines: A coefficient D characterizing how rapidly a particular molecule diffuses
      through a specific medium, depending on molecular mass and temperature.
    composed_of:
    - diffusion
    tier: 2
    source_domain: college_physics_ch12
  semipermeable_membrane:
    defines: A thin barrier that selectively allows certain molecules to pass through
      based on size or chemical properties.
    composed_of:
    - diffusion
    tier: 2
    source_domain: college_physics_ch12
  osmosis:
    defines: The transport of water through a semipermeable membrane from a region
      of high water concentration to a region of low water concentration.
    composed_of:
    - diffusion
    - semipermeable_membrane
    tier: 3
    source_domain: college_physics_ch12
  osmotic_pressure:
    defines: The back pressure sufficient to halt osmosis across a semipermeable membrane,
      which can be substantial depending on the concentration difference.
    composed_of:
    - osmosis
    - pressure
    tier: 4
    source_domain: college_physics_ch12
  dialysis:
    defines: The transport of any molecule other than water through a semipermeable
      membrane from a region of high concentration to one of low concentration.
    composed_of:
    - diffusion
    - semipermeable_membrane
    tier: 3
    source_domain: college_physics_ch12
  active_transport:
    defines: A process in which a living membrane expends energy to move substances
      across it, even against concentration gradients.
    composed_of:
    - diffusion
    - semipermeable_membrane
    - conservation_of_energy
    tier: 3
    source_domain: college_physics_ch12
  temperature:
    defines: The quantity measured by a thermometer, operationally defined and related
      to the average kinetic energy of atoms and molecules.
    composed_of:
    - kinetic_energy
    tier: 1
    source_domain: college_physics_ch13
    also_in:
    - college_physics_ch14
    - college_physics_ch15
    - college_physics_ch17
  mole:
    defines: The amount of a substance that contains as many atoms or molecules as
      there are atoms in exactly 12 grams of carbon-12.
    composed_of:
    - mass
    tier: 1
    source_domain: college_physics_ch13
  temperature_scales:
    defines: Well-defined measurement scales for temperature—Celsius, Fahrenheit,
      and Kelvin—using reproducible reference points and interconversion equations.
    composed_of:
    - temperature
    tier: 2
    source_domain: college_physics_ch13
  absolute_zero:
    defines: The lowest possible temperature (0 K or −273.15 °C) at which molecular
      motion reaches its minimum energy.
    composed_of:
    - temperature
    tier: 2
    source_domain: college_physics_ch13
  thermal_equilibrium:
    defines: The condition in which two systems in thermal contact have the same temperature
      and no net heat flows between them.
    composed_of:
    - temperature
    tier: 2
    source_domain: college_physics_ch13
    also_in:
    - college_physics_ch14
  thermal_expansion:
    defines: The change in size or volume of a given mass of material resulting from
      a change in temperature.
    composed_of:
    - temperature
    - volume
    tier: 2
    source_domain: college_physics_ch13
  boltzmann_constant:
    defines: The physical constant k = 1.38 × 10⁻²³ J/K that relates the average kinetic
      energy of particles in a gas to the absolute temperature.
    composed_of:
    - kinetic_energy
    - temperature
    tier: 2
    source_domain: college_physics_ch13
  phase_change:
    defines: A transition of matter among its solid, liquid, and gas phases, driven
      by changes in temperature and pressure.
    composed_of:
    - temperature
    - pressure
    tier: 2
    source_domain: college_physics_ch13
    also_in:
    - college_physics_ch14
  avogadros_number:
    defines: The number of atoms or molecules in one mole, N₀ = 6.02 × 10²³ particles/mol.
    composed_of:
    - mole
    tier: 2
    source_domain: college_physics_ch13
  zeroth_law_of_thermodynamics:
    defines: If system A is in thermal equilibrium with system B, and B is in thermal
      equilibrium with system C, then A is also in thermal equilibrium with C.
    composed_of:
    - thermal_equilibrium
    tier: 3
    source_domain: college_physics_ch13
  linear_thermal_expansion:
    defines: The change in length ΔL = αL₀ΔT, where α is the coefficient of linear
      expansion that depends on the material.
    composed_of:
    - thermal_expansion
    tier: 3
    source_domain: college_physics_ch13
  thermal_stress:
    defines: Stress created when thermal expansion or contraction is constrained,
      related to the bulk modulus and fractional volume change.
    composed_of:
    - thermal_expansion
    - pressure
    tier: 3
    source_domain: college_physics_ch13
  ideal_gas_law:
    defines: The equation of state PV = NkT (or PV = nRT) relating pressure, volume,
      number of particles, and absolute temperature for an ideal gas.
    composed_of:
    - pressure
    - volume
    - temperature
    - boltzmann_constant
    tier: 3
    source_domain: college_physics_ch13
    also_in:
    - college_physics_ch15
  universal_gas_constant:
    defines: The constant R = N₀k = 8.314 J/(mol·K) used in the molar form of the
      ideal gas law PV = nRT.
    composed_of:
    - avogadros_number
    - boltzmann_constant
    tier: 3
    source_domain: college_physics_ch13
  phase_diagram:
    defines: A pressure-versus-temperature graph showing regions where each phase
      exists and the boundaries where phases coexist.
    composed_of:
    - phase_change
    tier: 3
    source_domain: college_physics_ch13
  vapor:
    defines: A gas that exists at a temperature below its boiling temperature at the
      prevailing pressure.
    composed_of:
    - phase_change
    tier: 3
    source_domain: college_physics_ch13
  volume_thermal_expansion:
    defines: The change in volume ΔV = βV₀ΔT, where β is the coefficient of volume
      expansion and β ≈ 3α.
    composed_of:
    - linear_thermal_expansion
    tier: 4
    source_domain: college_physics_ch13
  kinetic_theory_of_gases:
    defines: The model that explains macroscopic gas properties (pressure, temperature)
      in terms of the continuous random motion and collisions of atoms and molecules.
    composed_of:
    - ideal_gas_law
    - kinetic_energy
    - mass
    tier: 4
    source_domain: college_physics_ch13
  pv_diagram:
    defines: A graph of pressure versus volume showing isotherms that follow hyperbolic
      curves for ideal gases and deviate near phase transitions.
    composed_of:
    - ideal_gas_law
    - phase_change
    tier: 4
    source_domain: college_physics_ch13
    also_in:
    - college_physics_ch15
  critical_point:
    defines: The critical temperature and pressure above which a distinct liquid phase
      cannot exist and the substance forms a supercritical fluid.
    composed_of:
    - phase_diagram
    tier: 4
    source_domain: college_physics_ch13
  triple_point:
    defines: The unique pressure and temperature at which the solid, liquid, and gas
      phases of a substance coexist in equilibrium.
    composed_of:
    - phase_diagram
    tier: 4
    source_domain: college_physics_ch13
  vapor_pressure:
    defines: The pressure at which a gas coexists in equilibrium with its solid or
      liquid phase, increasing with temperature.
    composed_of:
    - vapor
    - pressure
    tier: 4
    source_domain: college_physics_ch13
  partial_pressure:
    defines: The pressure a gas would create if it alone occupied the total available
      volume in a mixture of gases.
    composed_of:
    - pressure
    - ideal_gas_law
    tier: 4
    source_domain: college_physics_ch13
  saturation_vapor_density:
    defines: The maximum density of water vapor that air can hold at a given temperature,
      corresponding to 100% relative humidity.
    composed_of:
    - vapor
    - density
    tier: 4
    source_domain: college_physics_ch13
  rms_speed:
    defines: The square root of the average of the squared molecular speeds, given
      by v_rms = √(3kT/m), characterizing typical molecular speed in a gas.
    composed_of:
    - kinetic_theory_of_gases
    tier: 5
    source_domain: college_physics_ch13
  maxwell_boltzmann_distribution:
    defines: The statistical distribution of molecular speeds in an ideal gas, which
      broadens and shifts to higher speeds at higher temperatures.
    composed_of:
    - kinetic_theory_of_gases
    tier: 5
    source_domain: college_physics_ch13
  sublimation:
    defines: The phase change directly from solid to gas without passing through the
      liquid phase, occurring below the triple-point pressure.
    composed_of:
    - phase_change
    - triple_point
    tier: 5
    source_domain: college_physics_ch13
    also_in:
    - college_physics_ch14
  daltons_law:
    defines: The total pressure of a gas mixture equals the sum of the partial pressures
      of each component gas.
    composed_of:
    - partial_pressure
    tier: 5
    source_domain: college_physics_ch13
  relative_humidity:
    defines: The ratio of the actual vapor density (or partial pressure) of water
      in air to the saturation vapor density (or vapor pressure) at that temperature,
      expressed as a percentage.
    composed_of:
    - partial_pressure
    - saturation_vapor_density
    tier: 5
    source_domain: college_physics_ch13
  boiling:
    defines: The process in which a liquid vaporizes throughout its volume when its
      vapor pressure equals the surrounding atmospheric pressure.
    composed_of:
    - vapor_pressure
    - pressure
    tier: 5
    source_domain: college_physics_ch13
  dew_point:
    defines: The temperature at which air reaches 100% relative humidity and water
      vapor begins to condense.
    composed_of:
    - relative_humidity
    tier: 6
    source_domain: college_physics_ch13
  heat:
    defines: The spontaneous transfer of energy due to a temperature difference between
      two objects.
    composed_of:
    - temperature
    tier: 1
    source_domain: college_physics_ch14
  calorie:
    defines: Units of energy where one calorie is the energy needed to change the
      temperature of 1 g of water by 1 °C, and one kilocalorie equals 1000 calories.
    composed_of:
    - heat
    tier: 2
    source_domain: college_physics_ch14
  specific_heat:
    defines: The amount of heat necessary to change the temperature of 1.00 kg of
      a substance by 1.00 °C, a material-dependent property.
    composed_of:
    - heat
    tier: 2
    source_domain: college_physics_ch14
  conduction:
    defines: Heat transfer through stationary matter by physical contact, driven by
      molecular collisions that transfer kinetic energy from hotter to colder regions.
    composed_of:
    - heat
    - kinetic_energy
    tier: 2
    source_domain: college_physics_ch14
  convection:
    defines: Heat transfer by the macroscopic movement of a fluid, driven by density
      differences due to temperature variations.
    composed_of:
    - heat
    tier: 2
    source_domain: college_physics_ch14
  radiation:
    defines: Heat transfer through the emission or absorption of electromagnetic waves,
      requiring no medium.
    composed_of:
    - heat
    tier: 2
    source_domain: college_physics_ch14
  mechanical_equivalent_of_heat:
    defines: The equivalence between mechanical work and heat transfer, established
      as 1 kcal = 4186 J.
    composed_of:
    - work
    - calorie
    tier: 3
    source_domain: college_physics_ch14
  heat_capacity_equation:
    defines: The relationship Q = mcΔT expressing that heat transferred depends on
      mass, specific heat, and temperature change.
    composed_of:
    - specific_heat
    tier: 3
    source_domain: college_physics_ch14
  latent_heat:
    defines: The energy per unit mass absorbed or released during a phase change,
      hidden because no temperature change accompanies it.
    composed_of:
    - phase_change
    tier: 3
    source_domain: college_physics_ch14
  thermal_conductivity:
    defines: A material property describing how well the material conducts heat, appearing
      in the rate equation Q/t = kA(T₂−T₁)/d.
    composed_of:
    - conduction
    tier: 3
    source_domain: college_physics_ch14
  stefan_boltzmann_law:
    defines: The law stating that the rate of heat transfer by radiation is Q/t =
      σeAT⁴, proportional to the fourth power of absolute temperature.
    composed_of:
    - radiation
    tier: 3
    source_domain: college_physics_ch14
  emissivity:
    defines: A dimensionless measure (0 to 1) of how effectively an object radiates
      and absorbs electromagnetic energy compared to an ideal black body.
    composed_of:
    - radiation
    tier: 3
    source_domain: college_physics_ch14
  latent_heat_of_fusion:
    defines: The energy per unit mass required to change a substance from solid to
      liquid (or released from liquid to solid) at the melting point.
    composed_of:
    - latent_heat
    tier: 4
    source_domain: college_physics_ch14
  latent_heat_of_vaporization:
    defines: The energy per unit mass required to change a substance from liquid to
      gas (or released from gas to liquid) at the boiling point.
    composed_of:
    - latent_heat
    tier: 4
    source_domain: college_physics_ch14
  r_factor:
    defines: The ratio of material thickness to thermal conductivity (d/k), used to
      rate insulation effectiveness.
    composed_of:
    - thermal_conductivity
    tier: 4
    source_domain: college_physics_ch14
  net_radiative_heat_transfer:
    defines: The net radiation exchange between an object at temperature T₁ and surroundings
      at temperature T₂, given by Q_net/t = σeA(T₂⁴ − T₁⁴).
    composed_of:
    - stefan_boltzmann_law
    - emissivity
    tier: 4
    source_domain: college_physics_ch14
  internal_energy:
    defines: The sum of the kinetic and potential energies of all atoms and molecules
      in a system, depending only on the state of the system and not on the path taken
      to reach that state.
    composed_of:
    - kinetic_energy
    - potential_energy
    tier: 1
    source_domain: college_physics_ch15
    also_in:
    - college_physics_ch14
  heat_transfer:
    defines: Energy transferred between systems due to a temperature difference, characterized
      by random molecular motion and dependent on the path taken.
    composed_of:
    - temperature
    - kinetic_energy
    tier: 1
    source_domain: college_physics_ch15
  thermodynamic_work:
    defines: Energy transferred by a macroscopic force exerted through a distance,
      an organized process that is path dependent.
    composed_of:
    - pressure
    - volume
    tier: 1
    source_domain: college_physics_ch15
  macrostate:
    defines: An overall property of a system described by macroscopic variables such
      as pressure, volume, and temperature, without specifying the detailed arrangement
      of individual components.
    composed_of:
    - pressure
    - volume
    - temperature
    tier: 1
    source_domain: college_physics_ch15
  first_law_of_thermodynamics:
    defines: The change in internal energy of a system equals the net heat transfer
      into the system minus the net work done by the system (ΔE_int = Q − W).
    composed_of:
    - internal_energy
    - heat_transfer
    - thermodynamic_work
    - conservation_of_energy
    tier: 2
    source_domain: college_physics_ch15
  reversible_process:
    defines: A process in which both the system and its environment can be returned
      to their exact original states by following the reverse path, with no dissipative
      losses.
    composed_of:
    - heat_transfer
    - thermodynamic_work
    tier: 2
    source_domain: college_physics_ch15
  microstate:
    defines: A detailed description of every element of a system, such as the specific
      positions and velocities of all atoms, where each unique arrangement counts
      as one microstate.
    composed_of:
    - macrostate
    tier: 2
    source_domain: college_physics_ch15
  isobaric_process:
    defines: A thermodynamic process that occurs at constant pressure, where the work
      done equals the pressure times the change in volume (W = PΔV).
    composed_of:
    - first_law_of_thermodynamics
    - pv_diagram
    tier: 3
    source_domain: college_physics_ch15
  isochoric_process:
    defines: A constant-volume thermodynamic process in which no work is done because
      the volume does not change (ΔV = 0).
    composed_of:
    - first_law_of_thermodynamics
    - pv_diagram
    tier: 3
    source_domain: college_physics_ch15
  isothermal_process:
    defines: A constant-temperature thermodynamic process in which the internal energy
      of an ideal gas remains constant and the net heat transfer equals the net work
      done.
    composed_of:
    - first_law_of_thermodynamics
    - ideal_gas_law
    - pv_diagram
    tier: 3
    source_domain: college_physics_ch15
  adiabatic_process:
    defines: A thermodynamic process in which no heat transfer occurs (Q = 0), so
      work is done at the expense of internal energy.
    composed_of:
    - first_law_of_thermodynamics
    - pv_diagram
    tier: 3
    source_domain: college_physics_ch15
  irreversible_process:
    defines: A process that depends on path direction and cannot be fully reversed,
      due to dissipative factors such as friction or turbulence.
    composed_of:
    - reversible_process
    tier: 3
    source_domain: college_physics_ch15
  cyclical_process:
    defines: A process that returns a system to its original state at the end of every
      cycle, so that the change in internal energy is zero.
    composed_of:
    - first_law_of_thermodynamics
    tier: 3
    source_domain: college_physics_ch15
  heat_engine:
    defines: A device that uses heat transfer from a hot reservoir to do work, with
      some heat necessarily transferred to a cold reservoir.
    composed_of:
    - cyclical_process
    tier: 4
    source_domain: college_physics_ch15
  carnot_cycle:
    defines: The most efficient theoretical thermodynamic cycle, composed of two reversible
      isothermal and two reversible adiabatic processes.
    composed_of:
    - cyclical_process
    - reversible_process
    - isothermal_process
    - adiabatic_process
    tier: 4
    source_domain: college_physics_ch15
  second_law_of_thermodynamics:
    defines: Heat transfer occurs spontaneously from higher- to lower-temperature
      bodies but never in reverse, and it is impossible for heat transfer from a reservoir
      to completely convert to work in a cyclical process.
    composed_of:
    - heat_engine
    - irreversible_process
    tier: 5
    source_domain: college_physics_ch15
  thermodynamic_efficiency:
    defines: The ratio of net work output to heat transfer input for a heat engine,
      expressed as Eff = W/Q_h.
    composed_of:
    - heat_engine
    tier: 5
    source_domain: college_physics_ch15
  heat_pump:
    defines: A device that uses work input to transfer heat from a cold reservoir
      to a hot reservoir, supplying Q_h = Q_c + W to the warm environment.
    composed_of:
    - heat_engine
    tier: 5
    source_domain: college_physics_ch15
  refrigerator:
    defines: A heat engine run backward that uses work input to transfer heat from
      a cold environment to a warm one, judged by how much heat is removed from the
      cold reservoir per unit of work.
    composed_of:
    - heat_engine
    tier: 5
    source_domain: college_physics_ch15
  carnot_efficiency:
    defines: The maximum theoretical efficiency of a heat engine operating between
      two temperatures, given by Eff_C = 1 − T_c/T_h.
    composed_of:
    - carnot_cycle
    - thermodynamic_efficiency
    tier: 6
    source_domain: college_physics_ch15
  coefficient_of_performance:
    defines: A measure of the effectiveness of a heat pump or refrigerator, defined
      as the ratio of desired heat transfer to work input (COP_hp = Q_h/W for heat
      pumps, COP_ref = Q_c/W for refrigerators).
    composed_of:
    - heat_pump
    - refrigerator
    tier: 6
    source_domain: college_physics_ch15
  entropy:
    defines: A measure of a system's disorder and the unavailability of its energy
      to do work, defined for a reversible process as ΔS = Q/T, where entropy is a
      state function that never decreases for the total system.
    composed_of:
    - second_law_of_thermodynamics
    - reversible_process
    tier: 6
    source_domain: college_physics_ch15
  boltzmann_entropy:
    defines: The statistical definition of entropy as S = k_B ln W, where k_B is Boltzmann's
      constant and W is the number of microstates corresponding to a given macrostate.
    composed_of:
    - entropy
    - microstate
    tier: 7
    source_domain: college_physics_ch15
  restoring_force:
    defines: A force that acts in the direction opposite to displacement from equilibrium,
      driving an object back toward its equilibrium position.
    composed_of:
    - force
    - displacement
    - equilibrium
    tier: 1
    source_domain: college_physics_ch16
  periodic_motion:
    defines: Motion that repeats itself at regular time intervals.
    composed_of:
    - displacement
    tier: 1
    source_domain: college_physics_ch16
  wave:
    defines: A disturbance that propagates from its source, carrying energy without
      transporting matter.
    composed_of:
    - energy
    - displacement
    tier: 1
    source_domain: college_physics_ch16
    also_in:
    - college_physics_ch17
  period:
    defines: The time required to complete one full oscillation cycle, measured in
      seconds.
    composed_of:
    - periodic_motion
    tier: 2
    source_domain: college_physics_ch16
  frequency:
    defines: The number of oscillations per unit time, related to period by f = 1/T,
      measured in hertz.
    composed_of:
    - periodic_motion
    tier: 2
    source_domain: college_physics_ch16
    also_in:
    - college_physics_ch17
    - college_physics_ch27
    - college_physics_ch29
  amplitude:
    defines: The maximum displacement from the equilibrium position during an oscillation.
    composed_of:
    - periodic_motion
    - equilibrium
    tier: 2
    source_domain: college_physics_ch16
    also_in:
    - college_physics_ch17
  wavelength:
    defines: The distance between adjacent identical parts of a wave, measured parallel
      to the direction of propagation.
    composed_of:
    - wave
    tier: 2
    source_domain: college_physics_ch16
    also_in:
    - college_physics_ch17
    - college_physics_ch25
    - college_physics_ch26
    - college_physics_ch27
    - college_physics_ch29
  transverse_wave:
    defines: A wave in which the disturbance is perpendicular to the direction of
      propagation.
    composed_of:
    - wave
    tier: 2
    source_domain: college_physics_ch16
    also_in:
    - college_physics_ch27
  longitudinal_wave:
    defines: A wave in which the disturbance is parallel to the direction of propagation.
    composed_of:
    - wave
    tier: 2
    source_domain: college_physics_ch16
  superposition:
    defines: The phenomenon in which two or more waves combine at the same point by
      adding their individual disturbances.
    composed_of:
    - wave
    tier: 2
    source_domain: college_physics_ch16
  force_constant:
    defines: The constant k in Hooke's law that measures the stiffness or rigidity
      of a system, in units of newtons per meter.
    composed_of:
    - hookes_law
    tier: 3
    source_domain: college_physics_ch16
  simple_harmonic_motion:
    defines: Oscillatory motion in which the net restoring force is described by Hooke's
      law, producing sinusoidal displacement as a function of time.
    composed_of:
    - periodic_motion
    - hookes_law
    tier: 3
    source_domain: college_physics_ch16
    also_in:
    - college_physics_ch17
  wave_velocity:
    defines: The speed at which a wave disturbance propagates, related to wavelength
      and frequency by v_w = f*lambda.
    composed_of:
    - wavelength
    - frequency
    tier: 3
    source_domain: college_physics_ch16
  constructive_interference:
    defines: Superposition of waves that are in phase, resulting in a combined wave
      with greater amplitude.
    composed_of:
    - superposition
    - amplitude
    tier: 3
    source_domain: college_physics_ch16
    also_in:
    - college_physics_ch27
  destructive_interference:
    defines: Superposition of waves that are exactly out of phase, resulting in reduced
      or zero amplitude.
    composed_of:
    - superposition
    - amplitude
    tier: 3
    source_domain: college_physics_ch16
    also_in:
    - college_physics_ch27
  standing_wave:
    defines: A wave pattern formed by the superposition of two waves traveling in
      opposite directions, producing nodes and antinodes at fixed positions.
    composed_of:
    - superposition
    tier: 3
    source_domain: college_physics_ch16
    also_in:
    - college_physics_ch17
  beat_frequency:
    defines: The frequency of amplitude fluctuations produced by superposition of
      two waves with slightly different frequencies, equal to |f1 - f2|.
    composed_of:
    - superposition
    - frequency
    tier: 3
    source_domain: college_physics_ch16
  wave_intensity:
    defines: Power per unit area carried by a wave, proportional to the square of
      its amplitude, measured in watts per square meter.
    composed_of:
    - wave
    - amplitude
    tier: 3
    source_domain: college_physics_ch16
  elastic_potential_energy:
    defines: Energy stored in the deformation of a system that obeys Hooke's law,
      given by PE_el = (1/2)kx^2.
    composed_of:
    - energy
    - force_constant
    tier: 4
    source_domain: college_physics_ch16
  shm_period_frequency:
    defines: For a simple harmonic oscillator, the period T = 2*pi*sqrt(m/k) and frequency
      f = (1/2*pi)*sqrt(k/m), both independent of amplitude.
    composed_of:
    - simple_harmonic_motion
    - period
    - frequency
    - mass
    - force_constant
    tier: 4
    source_domain: college_physics_ch16
  shm_equations_of_motion:
    defines: The displacement x(t) = X*cos(2*pi*t/T), velocity v(t) = -v_max*sin(2*pi*t/T),
      and acceleration a = -(k/m)*x for simple harmonic motion.
    composed_of:
    - simple_harmonic_motion
    - amplitude
    - velocity
    - acceleration
    tier: 4
    source_domain: college_physics_ch16
  simple_pendulum:
    defines: A mass suspended from a light string that undergoes simple harmonic motion
      for small angles, with period T = 2*pi*sqrt(L/g) independent of mass.
    composed_of:
    - simple_harmonic_motion
    - period
    tier: 4
    source_domain: college_physics_ch16
  uniform_circular_motion_shm:
    defines: The projection of uniform circular motion onto a diameter produces simple
      harmonic motion, linking angular velocity omega to SHM period.
    composed_of:
    - simple_harmonic_motion
    - period
    tier: 4
    source_domain: college_physics_ch16
  damped_harmonic_motion:
    defines: Oscillatory motion in which non-conservative forces such as friction
      remove energy from the system, causing amplitude to decrease over time.
    composed_of:
    - simple_harmonic_motion
    - energy
    - amplitude
    tier: 4
    source_domain: college_physics_ch16
  natural_frequency:
    defines: The frequency at which a system oscillates when not subject to a driving
      or damping force.
    composed_of:
    - frequency
    - simple_harmonic_motion
    tier: 4
    source_domain: college_physics_ch16
  nodes_and_antinodes:
    defines: Nodes are points of zero displacement in a standing wave; antinodes are
      points of maximum displacement.
    composed_of:
    - standing_wave
    - amplitude
    tier: 4
    source_domain: college_physics_ch16
  fundamental_frequency_and_harmonics:
    defines: The lowest resonant frequency of a standing wave system is the fundamental;
      overtones or harmonics are integer multiples of the fundamental.
    composed_of:
    - standing_wave
    - frequency
    tier: 4
    source_domain: college_physics_ch16
  energy_in_shm:
    defines: In undamped SHM, total mechanical energy is conserved as it oscillates
      between kinetic energy (1/2)mv^2 and elastic potential energy (1/2)kx^2.
    composed_of:
    - simple_harmonic_motion
    - elastic_potential_energy
    - mass
    - velocity
    tier: 5
    source_domain: college_physics_ch16
  critical_damping:
    defines: The damping condition in which a system returns to equilibrium as quickly
      as possible without oscillating past it.
    composed_of:
    - damped_harmonic_motion
    tier: 5
    source_domain: college_physics_ch16
  underdamping:
    defines: A damping condition where the system oscillates through equilibrium with
      gradually decreasing amplitude before coming to rest.
    composed_of:
    - damped_harmonic_motion
    tier: 5
    source_domain: college_physics_ch16
  overdamping:
    defines: A damping condition where the system returns to equilibrium without oscillating
      but more slowly than a critically damped system.
    composed_of:
    - damped_harmonic_motion
    tier: 5
    source_domain: college_physics_ch16
  forced_oscillation:
    defines: Oscillation driven by a periodic external force applied at a particular
      frequency, which may differ from the system's natural frequency.
    composed_of:
    - natural_frequency
    - damped_harmonic_motion
    tier: 5
    source_domain: college_physics_ch16
  maximum_velocity_shm:
    defines: The maximum speed of a simple harmonic oscillator is v_max = sqrt(k/m)*X,
      occurring as the object passes through equilibrium.
    composed_of:
    - energy_in_shm
    - amplitude
    tier: 6
    source_domain: college_physics_ch16
  resonance:
    defines: The phenomenon in which a system driven at its natural frequency responds
      with maximum amplitude oscillations.
    composed_of:
    - forced_oscillation
    tier: 6
    source_domain: college_physics_ch16
  sound:
    defines: A disturbance of matter that is transmitted from its source outward as
      a longitudinal pressure wave.
    composed_of:
    - wave
    - pressure
    - simple_harmonic_motion
    tier: 1
    source_domain: college_physics_ch17
  compression_and_rarefaction:
    defines: Regions of higher and lower pressure that propagate as a longitudinal
      sound wave through a medium.
    composed_of:
    - sound
    tier: 2
    source_domain: college_physics_ch17
  speed_of_sound:
    defines: The speed at which sound waves propagate through a medium, determined
      by the medium's rigidity and density and affected by temperature.
    composed_of:
    - sound
    - density
    - temperature
    tier: 2
    source_domain: college_physics_ch17
  pitch:
    defines: The perception of the frequency of a sound, with higher frequency corresponding
      to higher pitch.
    composed_of:
    - sound
    - frequency
    tier: 2
    source_domain: college_physics_ch17
  sound_intensity:
    defines: The power per unit area carried by a sound wave, related to the square
      of the pressure amplitude.
    composed_of:
    - sound
    - power
    - amplitude
    tier: 2
    source_domain: college_physics_ch17
  interference:
    defines: The superposition of two or more sound waves resulting in constructive
      or destructive interference.
    composed_of:
    - sound
    - amplitude
    tier: 2
    source_domain: college_physics_ch17
    also_in:
    - college_physics_ch27
  hearing:
    defines: The perception of sound, encompassing the audible frequency range of
      20 to 20,000 Hz in humans.
    composed_of:
    - sound
    - frequency
    tier: 2
    source_domain: college_physics_ch17
  sound_intensity_level:
    defines: A logarithmic measure of sound intensity relative to the threshold of
      hearing, expressed in decibels.
    composed_of:
    - sound_intensity
    tier: 3
    source_domain: college_physics_ch17
  doppler_effect:
    defines: An alteration in the observed frequency of a sound due to relative motion
      between the source and observer.
    composed_of:
    - frequency
    - speed_of_sound
    tier: 3
    source_domain: college_physics_ch17
    also_in:
    - college_physics_ch34
  sonic_boom:
    defines: A constructive interference of sound waves created by an object moving
      faster than the speed of sound, forming a shock wave cone.
    composed_of:
    - speed_of_sound
    - interference
    tier: 3
    source_domain: college_physics_ch17
  bow_wake:
    defines: A V-shaped disturbance created when a wave source moves faster than the
      wave propagation speed in a medium.
    composed_of:
    - speed_of_sound
    tier: 3
    source_domain: college_physics_ch17
  loudness:
    defines: The perception of sound intensity, measured in phons and dependent on
      both intensity and frequency.
    composed_of:
    - sound_intensity
    - hearing
    tier: 3
    source_domain: college_physics_ch17
  infrasound:
    defines: Sound with frequencies below 20 Hz, below the range of human hearing.
    composed_of:
    - hearing
    tier: 3
    source_domain: college_physics_ch17
  ultrasound:
    defines: Sound with frequencies above 20,000 Hz, above the range of human hearing.
    composed_of:
    - hearing
    tier: 3
    source_domain: college_physics_ch17
  acoustic_impedance:
    defines: A property of a medium equal to the product of its density and the speed
      of sound through it, governing how sound transmits across boundaries.
    composed_of:
    - density
    - speed_of_sound
    tier: 3
    source_domain: college_physics_ch17
  node_and_antinode:
    defines: A node is a point of zero displacement in a standing wave; an antinode
      is a point of maximum displacement.
    composed_of:
    - standing_wave
    tier: 4
    source_domain: college_physics_ch17
  fundamental_frequency:
    defines: The lowest resonant frequency of a vibrating system such as an air column
      or string.
    composed_of:
    - standing_wave
    - frequency
    tier: 4
    source_domain: college_physics_ch17
  phon:
    defines: A unit of loudness perception defined so that at 1000 Hz phons equal
      decibels, with equal-loudness curves relating phons across frequencies.
    composed_of:
    - loudness
    - sound_intensity_level
    tier: 4
    source_domain: college_physics_ch17
  intensity_reflection_coefficient:
    defines: The ratio of reflected wave intensity to incident wave intensity at a
      boundary, determined by the difference in acoustic impedances.
    composed_of:
    - acoustic_impedance
    - sound_intensity
    tier: 4
    source_domain: college_physics_ch17
  overtones_and_harmonics:
    defines: Overtones are resonant frequencies higher than the fundamental; harmonics
      are the collective set of the fundamental and all its overtones.
    composed_of:
    - fundamental_frequency
    tier: 5
    source_domain: college_physics_ch17
  resonance_closed_tube:
    defines: Standing wave resonances in a tube closed at one end, producing only
      odd harmonics with frequencies f_n = nv_w/(4L) for odd n.
    composed_of:
    - overtones_and_harmonics
    - speed_of_sound
    tier: 6
    source_domain: college_physics_ch17
  resonance_open_tube:
    defines: Standing wave resonances in a tube open at both ends, producing all harmonics
      with frequencies f_n = nv_w/(2L).
    composed_of:
    - overtones_and_harmonics
    - speed_of_sound
    tier: 6
    source_domain: college_physics_ch17
  timbre:
    defines: The quality of a sound determined by the number and relative intensities
      of its constituent frequencies, distinguishing instruments playing the same
      note.
    composed_of:
    - overtones_and_harmonics
    tier: 6
    source_domain: college_physics_ch17
  conservation_of_charge:
    defines: Total charge is constant in any process; whenever charge is created or
      destroyed, equal amounts of positive and negative charge are involved.
    composed_of:
    - electric_charge
    tier: 1
    source_domain: college_physics_ch18
    also_in:
    - college_physics_ch21
    - college_physics_ch33
  conductor:
    defines: A material with free charges that allows electric charge to move relatively
      freely through it.
    composed_of:
    - electric_charge
    - electron
    tier: 1
    source_domain: college_physics_ch18
  insulator:
    defines: A material that holds charges securely within its atomic structure, not
      allowing them to move freely.
    composed_of:
    - electric_charge
    tier: 1
    source_domain: college_physics_ch18
  ion:
    defines: An atom or molecule with a nonzero net charge due to having unequal numbers
      of electrons and protons.
    composed_of:
    - electric_charge
    - electron
    - proton
    tier: 1
    source_domain: college_physics_ch18
  polarization:
    defines: The separation of positive and negative charges within a neutral object,
      induced by a nearby charged object or inherent molecular asymmetry.
    composed_of:
    - electric_charge
    tier: 1
    source_domain: college_physics_ch18
    also_in:
    - college_physics_ch19
    - college_physics_ch27
  coulombs_law:
    defines: The electrostatic force between two point charges is F = kq₁q₂/r², where
      k = 8.99 × 10⁹ N·m²/C², directed along the line joining the charges.
    composed_of:
    - electric_charge
    tier: 1
    source_domain: college_physics_ch18
  dipole:
    defines: A configuration of two centers of equal and opposite charge separated
      by a distance, as found in polar molecules like water.
    composed_of:
    - electric_charge
    tier: 1
    source_domain: college_physics_ch18
  charging_by_contact:
    defines: The process of transferring electric charge to a neutral object by directly
      touching it with a charged object, giving it the same sign charge.
    composed_of:
    - electric_charge
    - conductor
    tier: 2
    source_domain: college_physics_ch18
  charging_by_induction:
    defines: The process of charging a neutral object without direct contact by using
      a nearby charge to redistribute charges, producing an opposite sign charge.
    composed_of:
    - polarization
    - conductor
    tier: 2
    source_domain: college_physics_ch18
  grounding:
    defines: Connecting a conductor to the Earth through a conducting path, allowing
      charge to flow freely to or from Earth's large reservoir.
    composed_of:
    - conductor
    tier: 2
    source_domain: college_physics_ch18
    also_in:
    - college_physics_ch19
  electric_field:
    defines: The electric force per unit charge at a point in space, defined as E
      = F/q, depending only on the source charge and distance, with units of N/C.
    composed_of:
    - coulombs_law
    tier: 2
    source_domain: college_physics_ch18
    also_in:
    - college_physics_ch19
    - college_physics_ch20
    - college_physics_ch22
    - college_physics_ch24
  screening:
    defines: The reduction of electrostatic force between charges due to intervening
      polar molecules or ions that terminate field lines, effectively making the Coulomb
      force short-range.
    composed_of:
    - coulombs_law
    - dipole
    tier: 2
    source_domain: college_physics_ch18
  electric_field_lines:
    defines: Visual representations of the electric field where line direction indicates
      field direction and line density indicates field strength, beginning on positive
      charges and ending on negative charges.
    composed_of:
    - electric_field
    tier: 3
    source_domain: college_physics_ch18
  superposition_of_electric_fields:
    defines: The total electric field created by multiple charges is the vector sum
      of the individual fields created by each charge.
    composed_of:
    - electric_field
    tier: 3
    source_domain: college_physics_ch18
  electrostatic_equilibrium:
    defines: The steady state of a conductor in which all free charges have stopped
      moving, the electric field inside is zero, and field lines are perpendicular
      to the surface.
    composed_of:
    - conductor
    - electric_field
    tier: 3
    source_domain: college_physics_ch18
  electric_potential_energy:
    defines: The potential energy a charge possesses due to its position in an electric
      field, where the change in PE equals the negative of the work done by the electrostatic
      force.
    composed_of:
    - potential_energy
    - electric_charge
    - coulomb_force
    tier: 1
    source_domain: college_physics_ch19
  conservation_of_energy:
    defines: For conservative forces, the sum of kinetic energy and potential energy
      remains constant, so a loss in PE becomes an increase in KE.
    composed_of:
    - kinetic_energy
    - potential_energy
    - conservative_force
    tier: 1
    source_domain: college_physics_ch19
    also_in:
    - college_physics_ch12
    - college_physics_ch21
    - college_physics_ch31
  uniform_electric_field:
    defines: An electric field of constant magnitude and direction, such as that produced
      between two parallel conducting plates.
    composed_of:
    - electric_field
    tier: 1
    source_domain: college_physics_ch19
  capacitor:
    defines: A device that stores electric charge by maintaining separated positive
      and negative charges on two conducting surfaces close together but not touching.
    composed_of:
    - electric_charge
    tier: 1
    source_domain: college_physics_ch19
    also_in:
    - college_physics_ch21
  electric_potential:
    defines: The electric potential energy per unit charge at a point in an electric
      field, measured in volts.
    composed_of:
    - electric_potential_energy
    tier: 2
    source_domain: college_physics_ch19
  polar_molecule:
    defines: A molecule with an inherent separation of charge due to its asymmetric
      structure, resulting in greater polarization effects and higher dielectric constants.
    composed_of:
    - polarization
    tier: 2
    source_domain: college_physics_ch19
  potential_difference:
    defines: The difference in electric potential between two points, measured in
      volts (joules per coulomb).
    composed_of:
    - electric_potential
    tier: 3
    source_domain: college_physics_ch19
    also_in:
    - college_physics_ch20
  point_charge_potential:
    defines: The electric potential at distance r from a point charge Q is V = kQ/r,
      decreasing with distance and chosen to be zero at infinity.
    composed_of:
    - electric_potential
    tier: 3
    source_domain: college_physics_ch19
  equipotential_lines:
    defines: Lines or surfaces along which the electric potential is constant, always
      perpendicular to electric field lines, requiring no work to move a charge along
      them.
    composed_of:
    - electric_potential
    - electric_field
    tier: 3
    source_domain: college_physics_ch19
  electron_volt:
    defines: An energy unit equal to the energy given to a fundamental charge accelerated
      through 1 V, equal to 1.60 × 10⁻¹⁹ J.
    composed_of:
    - potential_difference
    tier: 4
    source_domain: college_physics_ch19
  voltage_electric_field_relationship:
    defines: In a uniform field V = Ed; more generally E equals the negative rate
      of change of V with distance.
    composed_of:
    - potential_difference
    - electric_field
    tier: 4
    source_domain: college_physics_ch19
  superposition_of_potentials:
    defines: The total electric potential due to multiple point charges is the algebraic
      (scalar) sum of the individual potentials.
    composed_of:
    - point_charge_potential
    tier: 4
    source_domain: college_physics_ch19
  capacitance:
    defines: The amount of charge a capacitor stores per unit voltage, C = Q/V, measured
      in farads.
    composed_of:
    - capacitor
    - potential_difference
    tier: 4
    source_domain: college_physics_ch19
    also_in:
    - college_physics_ch21
    - college_physics_ch23
  parallel_plate_capacitor:
    defines: Two identical parallel conducting plates separated by distance d, with
      capacitance C = ε₀A/d.
    composed_of:
    - capacitance
    - uniform_electric_field
    tier: 5
    source_domain: college_physics_ch19
  dielectric:
    defines: An insulating material placed between capacitor plates that increases
      capacitance by a factor κ through polarization of its molecules.
    composed_of:
    - capacitance
    - polarization
    tier: 5
    source_domain: college_physics_ch19
  capacitors_in_series:
    defines: Capacitors linked end-to-end sharing the same charge, with 1/C_total
      = 1/C₁ + 1/C₂ + …, always less than any individual capacitance.
    composed_of:
    - capacitance
    tier: 5
    source_domain: college_physics_ch19
  capacitors_in_parallel:
    defines: Capacitors sharing the same voltage, with C_total = C₁ + C₂ + …, equal
      to the sum of individual capacitances.
    composed_of:
    - capacitance
    tier: 5
    source_domain: college_physics_ch19
  energy_stored_in_capacitors:
    defines: The electrical potential energy stored in a capacitor, given by E = ½QV
      = ½CV² = ½Q²/C.
    composed_of:
    - capacitance
    tier: 5
    source_domain: college_physics_ch19
  dielectric_constant:
    defines: A dimensionless factor κ by which a dielectric increases capacitance,
      defined as the ratio of field in vacuum to that in the dielectric.
    composed_of:
    - dielectric
    tier: 6
    source_domain: college_physics_ch19
  dielectric_strength:
    defines: The maximum electric field strength an insulating material can withstand
      before breakdown and conduction.
    composed_of:
    - dielectric
    tier: 6
    source_domain: college_physics_ch19
  electric_current:
    defines: The rate at which charge flows through a cross-sectional area, defined
      as I = ΔQ/Δt and measured in amperes.
    composed_of:
    - electric_charge
    tier: 1
    source_domain: college_physics_ch20
    also_in:
    - college_physics_ch21
    - college_physics_ch22
    - college_physics_ch23
  resting_membrane_potential:
    defines: The voltage of approximately −90 mV across a neuron's cell membrane at
      rest, created by diffusion and Coulomb-force-driven separation of ions across
      the semipermeable membrane.
    composed_of:
    - diffusion
    - coulomb_force
    - potential_difference
    tier: 1
    source_domain: college_physics_ch20
  ampere:
    defines: The SI unit of electric current, equal to one coulomb of charge passing
      through an area per second.
    composed_of:
    - electric_current
    tier: 2
    source_domain: college_physics_ch20
  conventional_current:
    defines: The agreed-upon direction of current flow taken as the direction positive
      charge would move, opposite to the actual motion of electrons in metal wires.
    composed_of:
    - electric_current
    tier: 2
    source_domain: college_physics_ch20
  drift_velocity:
    defines: The average velocity of free charge carriers moving through a conductor
      in response to an electric field, related to current by I = nqAvd.
    composed_of:
    - electric_current
    - electric_field
    - free_charges
    tier: 2
    source_domain: college_physics_ch20
  resistance:
    defines: The electric property that impedes current flow in a material, defined
      as the ratio of voltage to current R = V/I and measured in ohms.
    composed_of:
    - electric_current
    - potential_difference
    tier: 2
    source_domain: college_physics_ch20
    also_in:
    - college_physics_ch21
    - college_physics_ch23
  direct_current:
    defines: The flow of electric charge in only one direction, produced by a constant-voltage
      source such as a battery.
    composed_of:
    - electric_current
    - potential_difference
    tier: 2
    source_domain: college_physics_ch20
  alternating_current:
    defines: The flow of electric charge that periodically reverses direction, typically
      varying sinusoidally as I = I₀ sin(2πft).
    composed_of:
    - electric_current
    tier: 2
    source_domain: college_physics_ch20
  action_potential:
    defines: A brief voltage pulse generated when a stimulus makes the cell membrane
      transiently permeable to Na⁺ ions, causing depolarization followed by repolarization.
    composed_of:
    - resting_membrane_potential
    tier: 2
    source_domain: college_physics_ch20
  electric_power:
    defines: The rate at which electrical energy is supplied or dissipated, given
      by P = IV = V²/R = I²R and measured in watts.
    composed_of:
    - electric_current
    - potential_difference
    tier: 2
    source_domain: college_physics_ch20
  ohms_law:
    defines: The empirical relationship stating that current through an ohmic material
      is directly proportional to the applied voltage and inversely proportional to
      resistance, expressed as I = V/R.
    composed_of:
    - resistance
    tier: 3
    source_domain: college_physics_ch20
    also_in:
    - college_physics_ch21
  voltage_drop:
    defines: The reduction in electric potential across a resistor produced by current
      flowing through it, given by V = IR.
    composed_of:
    - resistance
    - electric_current
    tier: 3
    source_domain: college_physics_ch20
    also_in:
    - college_physics_ch21
  resistivity:
    defines: An intrinsic material property independent of shape or size that quantifies
      how strongly a material opposes current flow, relating resistance to geometry
      by R = ρL/A.
    composed_of:
    - resistance
    tier: 3
    source_domain: college_physics_ch20
    also_in:
    - college_physics_ch34
  rms_values:
    defines: Root-mean-square values of AC voltage and current (Vrms = V₀/√2, Irms
      = I₀/√2) that represent the equivalent DC values for power calculations in resistive
      circuits.
    composed_of:
    - alternating_current
    tier: 3
    source_domain: college_physics_ch20
  nerve_impulse_propagation:
    defines: The transmission of an action potential along an axon as each depolarization
      event triggers the same process in the adjacent membrane, traveling at roughly
      1 m/s in unmyelinated axons.
    composed_of:
    - action_potential
    tier: 3
    source_domain: college_physics_ch20
  short_circuit:
    defines: An undesired low-resistance path between the terminals of a voltage source
      that causes very large current and dangerously high power dissipation.
    composed_of:
    - resistance
    - electric_power
    tier: 3
    source_domain: college_physics_ch20
  electrical_energy:
    defines: The energy used by an electrical device, calculated as E = Pt (power
      times time), and billed commercially in kilowatt-hours.
    composed_of:
    - electric_power
    tier: 3
    source_domain: college_physics_ch20
  ohmic_material:
    defines: A material for which resistance is independent of applied voltage and
      current, so that Ohm's law holds and I is linearly proportional to V.
    composed_of:
    - ohms_law
    tier: 4
    source_domain: college_physics_ch20
  simple_circuit:
    defines: An electric circuit consisting of a single voltage source connected to
      a single resistor, in which the voltage supplied equals the voltage drop across
      the resistor.
    composed_of:
    - ohms_law
    - potential_difference
    tier: 4
    source_domain: college_physics_ch20
  material_classification:
    defines: A classification of materials by resistivity into conductors (low ρ,
      many free charges), semiconductors (intermediate ρ, few free charges), and insulators
      (high ρ, bound charges).
    composed_of:
    - resistivity
    - free_charges
    tier: 4
    source_domain: college_physics_ch20
  temperature_coefficient_of_resistivity:
    defines: An empirical quantity α that describes how resistivity changes with temperature,
      giving ρ = ρ₀(1 + αΔT); positive for metals, negative for semiconductors.
    composed_of:
    - resistivity
    tier: 4
    source_domain: college_physics_ch20
  average_ac_power:
    defines: The time-averaged power dissipated in an AC circuit, equal to half the
      peak power and expressible as P = IrmsVrms = Irms²R = Vrms²/R.
    composed_of:
    - rms_values
    - electric_power
    - resistance
    tier: 4
    source_domain: college_physics_ch20
  myelin_sheath:
    defines: An insulating fat-containing layer around certain axons that speeds signal
      transmission, reduces energy use, and prevents cross-talk by allowing passive
      conduction between nodes of Ranvier.
    composed_of:
    - nerve_impulse_propagation
    tier: 4
    source_domain: college_physics_ch20
  kilowatt_hour:
    defines: A unit of electrical energy equal to the energy consumed by a 1-kW device
      operating for one hour, equivalent to 3.6 × 10⁶ J; used for billing purposes.
    composed_of:
    - electrical_energy
    tier: 4
    source_domain: college_physics_ch20
  temperature_dependence_of_resistance:
    defines: The variation of an object's resistance with temperature, expressed as
      R = R₀(1 + αΔT), following directly from the temperature dependence of resistivity.
    composed_of:
    - resistance
    - temperature_coefficient_of_resistivity
    tier: 5
    source_domain: college_physics_ch20
  kirchhoffs_junction_rule:
    defines: The sum of all currents entering a junction must equal the sum of all
      currents leaving it, as a direct consequence of conservation of charge.
    composed_of:
    - conservation_of_charge
    - electric_current
    tier: 1
    source_domain: college_physics_ch21
  kirchhoffs_loop_rule:
    defines: The algebraic sum of all changes in electric potential around any closed
      loop in a circuit must equal zero, as a consequence of conservation of energy.
    composed_of:
    - conservation_of_energy
    - voltage
    tier: 1
    source_domain: college_physics_ch21
  electromotive_force:
    defines: The potential difference of a voltage source when no current is flowing,
      representing the energy per unit charge supplied by the source's internal chemistry
      or mechanism.
    composed_of:
    - voltage
    tier: 1
    source_domain: college_physics_ch21
  galvanometer:
    defines: An analog measuring device in which current through a coil in a magnetic
      field produces a proportional needle deflection, characterized by its resistance
      and current sensitivity.
    composed_of:
    - electric_current
    - resistance
    tier: 1
    source_domain: college_physics_ch21
  joules_law:
    defines: The relationship P = I²R (equivalently P = V²/R or P = IV) giving the
      power dissipated by a resistor carrying current I.
    composed_of:
    - ohms_law
    tier: 2
    source_domain: college_physics_ch21
  parallel_resistance:
    defines: The total resistance of resistors connected in parallel, found from 1/R_p
      = 1/R1 + 1/R2 + …, always less than the smallest individual resistance, with
      the same voltage across each.
    composed_of:
    - ohms_law
    - conservation_of_charge
    tier: 2
    source_domain: college_physics_ch21
  kirchhoffs_rules:
    defines: A unified set of two rules—the junction rule and the loop rule—that together
      allow analysis of any DC circuit, however complex.
    composed_of:
    - kirchhoffs_junction_rule
    - kirchhoffs_loop_rule
    tier: 2
    source_domain: college_physics_ch21
  internal_resistance:
    defines: The inherent resistance within a voltage source that causes the terminal
      voltage to fall below the EMF whenever current is drawn.
    composed_of:
    - resistance
    - electromotive_force
    tier: 2
    source_domain: college_physics_ch21
  rc_circuit:
    defines: A circuit containing both a resistor and a capacitor, in which the capacitor
      charges or discharges exponentially over time rather than instantaneously.
    composed_of:
    - resistance
    - capacitance
    - ohms_law
    tier: 2
    source_domain: college_physics_ch21
  series_resistance:
    defines: The total resistance of resistors connected in series, equal to the sum
      of all individual resistances (R_s = R1 + R2 + …), with the same current through
      each.
    composed_of:
    - voltage_drop
    - conservation_of_charge
    tier: 3
    source_domain: college_physics_ch21
  terminal_voltage:
    defines: The actual voltage measured across the output terminals of a source under
      load, given by V_T = emf − Ir, where r is internal resistance and I is current.
    composed_of:
    - electromotive_force
    - internal_resistance
    - ohms_law
    tier: 3
    source_domain: college_physics_ch21
  null_measurement:
    defines: A technique that balances a circuit so no current flows through the measuring
      device, eliminating circuit loading and yielding greater measurement accuracy.
    composed_of:
    - galvanometer
    - kirchhoffs_rules
    tier: 3
    source_domain: college_physics_ch21
  rc_time_constant:
    defines: The characteristic time τ = RC governing the rate of charging or discharging
      in an RC circuit; after one time constant the voltage changes by a factor of
      1 − 1/e ≈ 0.632 of its remaining range.
    composed_of:
    - rc_circuit
    tier: 3
    source_domain: college_physics_ch21
  meter_circuit_loading:
    defines: The alteration of a measured circuit caused by inserting a voltmeter
      or ammeter, which can be minimized by using high resistance in voltmeters and
      low resistance in ammeters.
    composed_of:
    - voltmeter
    - ammeter
    tier: 3
    source_domain: college_physics_ch21
  series_parallel_combination:
    defines: A method of reducing complex resistor networks to a single equivalent
      resistance by iteratively identifying and simplifying series and parallel sub-groups.
    composed_of:
    - series_resistance
    - parallel_resistance
    tier: 4
    source_domain: college_physics_ch21
  voltage_sources_in_combination:
    defines: Multiple voltage sources connected in series add their EMFs and internal
      resistances algebraically; sources in parallel share current while keeping the
      same EMF and reducing total internal resistance.
    composed_of:
    - terminal_voltage
    - series_resistance
    - parallel_resistance
    tier: 4
    source_domain: college_physics_ch21
  capacitor_charging:
    defines: The exponential rise in capacitor voltage when connected through a resistor
      to a DC source, described by V(t) = emf(1 − e^{−t/τ}), approaching the source
      EMF asymptotically.
    composed_of:
    - rc_time_constant
    - electromotive_force
    tier: 4
    source_domain: college_physics_ch21
  capacitor_discharging:
    defines: The exponential decay of capacitor voltage when it releases stored charge
      through a resistor, described by V(t) = V₀ e^{−t/τ}, approaching zero asymptotically.
    composed_of:
    - rc_time_constant
    tier: 4
    source_domain: college_physics_ch21
  magnetic_poles:
    defines: The two ends of a magnet, called north and south, where like poles repel
      and unlike poles attract.
    composed_of: []
    tier: 1
    source_domain: college_physics_ch22
  magnetic_field:
    defines: A vector field that represents magnetic forces in space, defined in terms
      of the force it exerts on a moving charge.
    composed_of:
    - electric_charge
    - velocity
    tier: 1
    source_domain: college_physics_ch22
    also_in:
    - college_physics_ch23
    - college_physics_ch24
  no_magnetic_monopoles:
    defines: The empirical rule that north and south magnetic poles always occur in
      pairs and cannot be isolated, unlike electric charges.
    composed_of:
    - magnetic_poles
    - electric_charge
    tier: 2
    source_domain: college_physics_ch22
  ferromagnetism:
    defines: The property of certain materials (iron, cobalt, nickel, gadolinium)
      to exhibit strong magnetic effects and to be permanently magnetized.
    composed_of:
    - magnetic_poles
    tier: 2
    source_domain: college_physics_ch22
  magnetic_field_lines:
    defines: Continuous closed loops used to pictorially represent the direction and
      relative strength of a magnetic field, always running from north to south poles
      externally.
    composed_of:
    - magnetic_field
    - magnetic_poles
    tier: 2
    source_domain: college_physics_ch22
  lorentz_force:
    defines: The magnetic force on a charge q moving at speed v in field B, given
      by F = qvB sin theta, directed perpendicular to both v and B.
    composed_of:
    - electric_charge
    - velocity
    - magnetic_field
    tier: 2
    source_domain: college_physics_ch22
  permeability_of_free_space:
    defines: The fundamental constant mu_0 = 4pi x 10^-7 T·m/A that relates magnetic
      field strength to the currents that produce it.
    composed_of:
    - magnetic_field
    - electric_current
    tier: 2
    source_domain: college_physics_ch22
    also_in:
    - college_physics_ch24
  right_hand_rule_2:
    defines: 'A mnemonic for finding the direction of the magnetic field produced
      by a current: point the right thumb in the direction of current flow and the
      curling fingers indicate the direction of the circular field loops.'
    composed_of:
    - electric_current
    - magnetic_field
    tier: 2
    source_domain: college_physics_ch22
  magnetic_domains:
    defines: Millimeter-sized regions within a ferromagnetic material in which atomic
      magnetic moments are aligned, acting collectively like small bar magnets.
    composed_of:
    - ferromagnetism
    tier: 3
    source_domain: college_physics_ch22
  current_as_source_of_magnetism:
    defines: The principle that every magnetic effect, including ferromagnetism, arises
      from electric current (including orbital and spin currents of electrons).
    composed_of:
    - electric_current
    - ferromagnetism
    tier: 3
    source_domain: college_physics_ch22
  right_hand_rule_1:
    defines: 'A mnemonic rule for finding the direction of the magnetic force on a
      positive moving charge: thumb points along v, fingers along B, palm-push direction
      is F.'
    composed_of:
    - lorentz_force
    tier: 3
    source_domain: college_physics_ch22
  tesla:
    defines: The SI unit of magnetic field strength B, defined as the field that exerts
      a 1-N force on a 1-C charge moving at 1 m/s perpendicular to it.
    composed_of:
    - lorentz_force
    tier: 3
    source_domain: college_physics_ch22
  circular_motion_in_magnetic_field:
    defines: The uniform circular path followed by a charged particle moving perpendicular
      to a uniform magnetic field, because the magnetic force is always perpendicular
      to velocity and supplies the centripetal force.
    composed_of:
    - lorentz_force
    - centripetal_force
    tier: 3
    source_domain: college_physics_ch22
  hall_effect:
    defines: The creation of a transverse voltage (Hall emf) across a current-carrying
      conductor placed in a magnetic field, caused by the deflection of charge carriers
      to one side.
    composed_of:
    - electric_current
    - lorentz_force
    - electric_field
    tier: 3
    source_domain: college_physics_ch22
  magnetic_force_on_current:
    defines: The force F = IlB sin theta on a straight wire of length l carrying current
      I in a uniform field B, arising because the field acts on the moving charges
      inside the conductor.
    composed_of:
    - electric_current
    - lorentz_force
    tier: 3
    source_domain: college_physics_ch22
  magnetic_field_straight_wire:
    defines: The magnetic field of magnitude B = mu_0 I/(2 pi r) that forms circular
      loops around a long straight current-carrying wire at perpendicular distance
      r.
    composed_of:
    - electric_current
    - permeability_of_free_space
    - right_hand_rule_2
    tier: 3
    source_domain: college_physics_ch22
  magnetic_field_circular_loop:
    defines: The magnetic field B = mu_0 I/(2R) at the center of a circular loop of
      radius R carrying current I, analogous in shape to a bar magnet's field.
    composed_of:
    - electric_current
    - permeability_of_free_space
    - right_hand_rule_2
    tier: 3
    source_domain: college_physics_ch22
  curie_temperature:
    defines: The temperature above which thermal agitation randomizes domain alignment
      and a ferromagnetic material can no longer be magnetized.
    composed_of:
    - magnetic_domains
    tier: 4
    source_domain: college_physics_ch22
  electromagnet:
    defines: A temporarily magnetic object created by passing electric current through
      a coil of wire, often enhanced by a ferromagnetic core.
    composed_of:
    - electric_current
    - current_as_source_of_magnetism
    tier: 4
    source_domain: college_physics_ch22
  radius_of_curvature:
    defines: The radius r = mv/(qB) of the circular path traced by a particle of mass
      m and charge q moving at speed v perpendicular to field B.
    composed_of:
    - circular_motion_in_magnetic_field
    tier: 4
    source_domain: college_physics_ch22
    also_in:
    - college_physics_ch06
    - college_physics_ch25
  magnetic_mirror:
    defines: A region of increasing magnetic field strength that reflects charged
      particles moving along field lines by converting parallel velocity into perpendicular
      velocity.
    composed_of:
    - circular_motion_in_magnetic_field
    tier: 4
    source_domain: college_physics_ch22
  hall_emf:
    defines: The equilibrium voltage V = vBd produced across a conductor of width
      d when charge carriers moving at drift speed v are deflected by magnetic field
      B until the electric force balances the magnetic force.
    composed_of:
    - hall_effect
    tier: 4
    source_domain: college_physics_ch22
  torque_on_current_loop:
    defines: The rotational force tau = NIAB sin theta exerted by a uniform magnetic
      field on a flat loop of N turns, area A, carrying current I, where theta is
      the angle between the field and the loop normal.
    composed_of:
    - magnetic_force_on_current
    tier: 4
    source_domain: college_physics_ch22
  amperes_law:
    defines: The general physical law stating that the magnetic field around any closed
      path is proportional to the net current enclosed; the total field of any current
      shape is the vector sum of contributions from each current segment.
    composed_of:
    - electric_current
    - magnetic_field
    - magnetic_field_straight_wire
    tier: 4
    source_domain: college_physics_ch22
    also_in:
    - college_physics_ch24
  force_between_parallel_conductors:
    defines: The force per unit length F/l = mu_0 I_1 I_2 / (2 pi d) between two parallel
      wires separated by distance d; attractive for currents in the same direction,
      repulsive for opposite directions.
    composed_of:
    - magnetic_field_straight_wire
    - magnetic_force_on_current
    tier: 4
    source_domain: college_physics_ch22
  solenoid:
    defines: A long coil of wire with many turns that produces a highly uniform interior
      field B = mu_0 n I, where n is the number of turns per unit length, and a near-zero
      exterior field.
    composed_of:
    - magnetic_field_circular_loop
    - amperes_law
    tier: 5
    source_domain: college_physics_ch22
  definition_of_ampere:
    defines: One ampere is the current that, flowing in each of two infinitely long
      parallel wires separated by 1 m in vacuum, produces a force of 2 x 10^-7 N per
      meter of length between them.
    composed_of:
    - force_between_parallel_conductors
    tier: 5
    source_domain: college_physics_ch22
  magnetic_flux:
    defines: The quantity Phi = BA cos(theta) representing the amount of magnetic
      field passing through an area A at angle theta to the perpendicular; the central
      quantity governing induction.
    composed_of:
    - magnetic_field
    tier: 1
    source_domain: college_physics_ch23
  capacitive_reactance:
    defines: The frequency-dependent opposition X_C = 1/(2*pi*f*C) of a capacitor
      to AC current, causing voltage to lag current by 90 degrees.
    composed_of:
    - capacitance
    tier: 1
    source_domain: college_physics_ch23
  electromagnetic_induction:
    defines: The process by which any change in magnetic flux induces an electromotive
      force (emf) in a conductor or coil.
    composed_of:
    - magnetic_flux
    tier: 2
    source_domain: college_physics_ch23
  faradays_law:
    defines: The quantitative law stating that the induced emf equals -N * Delta(Phi)/Delta(t),
      where N is the number of turns and Delta(Phi)/Delta(t) is the rate of change
      of magnetic flux.
    composed_of:
    - electromagnetic_induction
    tier: 3
    source_domain: college_physics_ch23
    also_in:
    - college_physics_ch24
  lenzs_law:
    defines: The principle, expressed by the minus sign in Faraday's law, that the
      induced emf drives a current whose magnetic field opposes the change in flux
      that caused it.
    composed_of:
    - faradays_law
    tier: 4
    source_domain: college_physics_ch23
  motional_emf:
    defines: An emf induced by the relative motion of a conductor of length l through
      a magnetic field B at speed v, given by emf = Blv.
    composed_of:
    - magnetic_field
    - faradays_law
    tier: 4
    source_domain: college_physics_ch23
  eddy_currents:
    defines: Current loops induced within bulk conducting materials when the magnetic
      flux through them changes, arising as a consequence of Faraday's law.
    composed_of:
    - faradays_law
    tier: 4
    source_domain: college_physics_ch23
  electric_generator:
    defines: A device that converts mechanical work into electrical energy by rotating
      an N-turn coil of area A in a uniform magnetic field B, producing a sinusoidal
      emf = NBA*omega*sin(omega*t) with peak emf = NBA*omega.
    composed_of:
    - faradays_law
    - angular_velocity
    tier: 4
    source_domain: college_physics_ch23
  mutual_inductance:
    defines: The property M (in henries) quantifying how effectively a change in current
      in one coil induces an emf in a neighboring coil, via emf_2 = -M * Delta(I_1)/Delta(t).
    composed_of:
    - faradays_law
    - electric_current
    tier: 4
    source_domain: college_physics_ch23
  self_inductance:
    defines: The property L (in henries) of a device quantifying how effectively a
      change in its own current induces an opposing emf in itself, via emf = -L *
      Delta(I)/Delta(t).
    composed_of:
    - faradays_law
    - electric_current
    tier: 4
    source_domain: college_physics_ch23
  magnetic_damping:
    defines: The drag force on a moving conductor produced by eddy currents, which
      by Lenz's law always opposes the motion inducing them.
    composed_of:
    - eddy_currents
    - lenzs_law
    tier: 5
    source_domain: college_physics_ch23
  back_emf:
    defines: The emf self-generated by a rotating motor coil (via Faraday's law) that
      opposes the driving input voltage and grows proportionally with the motor's
      angular velocity.
    composed_of:
    - lenzs_law
    - angular_velocity
    tier: 5
    source_domain: college_physics_ch23
  inductor_energy:
    defines: The energy E = (1/2)*L*I^2 stored in the magnetic field of an inductor
      carrying current I.
    composed_of:
    - self_inductance
    - electric_current
    tier: 5
    source_domain: college_physics_ch23
  rl_time_constant:
    defines: The characteristic time tau = L/R governing exponential current growth
      and decay in a series RL circuit; current rises or falls by a factor of e^-1
      in each interval tau.
    composed_of:
    - self_inductance
    - resistance
    tier: 5
    source_domain: college_physics_ch23
  inductive_reactance:
    defines: The frequency-dependent opposition X_L = 2*pi*f*L of an inductor to AC
      current, causing voltage to lead current by 90 degrees.
    composed_of:
    - self_inductance
    tier: 5
    source_domain: college_physics_ch23
  impedance:
    defines: The total AC opposition Z = sqrt(R^2 + (X_L - X_C)^2) of a series RLC
      circuit, relating peak voltage to peak current via the AC form of Ohm's law.
    composed_of:
    - resistance
    - inductive_reactance
    - capacitive_reactance
    tier: 6
    source_domain: college_physics_ch23
  resonant_frequency:
    defines: The frequency f_0 = 1/(2*pi*sqrt(L*C)) at which inductive and capacitive
      reactances cancel, impedance equals resistance alone, and current is maximized.
    composed_of:
    - inductive_reactance
    - capacitive_reactance
    tier: 6
    source_domain: college_physics_ch23
  phase_angle:
    defines: The angle phi between source voltage and current in an AC circuit, given
      by cos(phi) = R/Z, reflecting the net reactance of the circuit.
    composed_of:
    - impedance
    - resistance
    tier: 7
    source_domain: college_physics_ch23
  power_factor:
    defines: The quantity cos(phi) by which the product I_rms * V_rms must be multiplied
      to obtain the true average power delivered to an AC circuit.
    composed_of:
    - phase_angle
    tier: 8
    source_domain: college_physics_ch23
  changing_electric_field_creates_magnetic_field:
    defines: 'Maxwell''s key addition to Ampere''s law: a time-varying electric field
      generates a magnetic field, making the theory symmetric with Faraday''s law.'
    composed_of:
    - electric_field
    - magnetic_field
    - amperes_law
    tier: 1
    source_domain: college_physics_ch24
  speed_of_light:
    defines: The propagation speed of electromagnetic waves in a vacuum, c ≈ 3×10⁸
      m/s, derived from the constants ε₀ and μ₀ via c = 1/√(μ₀ε₀).
    composed_of:
    - permittivity_of_free_space
    - permeability_of_free_space
    tier: 1
    source_domain: college_physics_ch24
    also_in:
    - college_physics_ch27
    - college_physics_ch28
  maxwells_equations:
    defines: A complete, symmetric set of four equations unifying Gauss's law for
      electricity, Gauss's law for magnetism, Faraday's law, and an extended Ampere's
      law that includes changing electric fields as a source of magnetic fields.
    composed_of:
    - gauss_law_electricity
    - gauss_law_magnetism
    - faradays_law
    - amperes_law
    - changing_electric_field_creates_magnetic_field
    tier: 2
    source_domain: college_physics_ch24
  wave_equation_em:
    defines: For all electromagnetic waves the propagation speed equals frequency
      times wavelength (c = fλ), so higher frequency implies shorter wavelength.
    composed_of:
    - speed_of_light
    - wave_frequency_wavelength
    tier: 2
    source_domain: college_physics_ch24
  electromagnetic_wave:
    defines: Oscillating, mutually perpendicular electric and magnetic fields that
      propagate through space at the speed of light, requiring no medium.
    composed_of:
    - maxwells_equations
    - speed_of_light
    tier: 3
    source_domain: college_physics_ch24
    also_in:
    - college_physics_ch27
  em_wave_production:
    defines: Electromagnetic waves are generated whenever charges oscillate or accelerate;
      the wave frequency equals the frequency of charge oscillation.
    composed_of:
    - electromagnetic_wave
    - electric_charge
    tier: 4
    source_domain: college_physics_ch24
  transverse_em_wave:
    defines: In an electromagnetic wave the electric and magnetic fields are perpendicular
      to each other and to the direction of propagation, making it a transverse wave.
    composed_of:
    - electromagnetic_wave
    tier: 4
    source_domain: college_physics_ch24
  e_b_field_ratio:
    defines: 'In any electromagnetic wave traveling in a vacuum the ratio of electric
      to magnetic field strength equals the speed of light: E/B = c.'
    composed_of:
    - electromagnetic_wave
    - speed_of_light
    tier: 4
    source_domain: college_physics_ch24
  electromagnetic_spectrum:
    defines: The full continuum of electromagnetic radiation ordered by frequency
      and wavelength, ranging from extremely low-frequency radio waves through microwaves,
      infrared, visible light, ultraviolet, X-rays, and gamma rays.
    composed_of:
    - electromagnetic_wave
    - wave_equation_em
    tier: 4
    source_domain: college_physics_ch24
  wave_energy_amplitude:
    defines: The energy carried by a wave is proportional to the square of its amplitude;
      for EM waves this means energy scales with E₀² or B₀².
    composed_of:
    - electromagnetic_wave
    tier: 4
    source_domain: college_physics_ch24
  em_wave_intensity:
    defines: The average power per unit area carried by an EM wave, given by I_avg
      = (cε₀/2)E₀², where E₀ is the peak electric field strength.
    composed_of:
    - wave_energy_amplitude
    - speed_of_light
    - permittivity_of_free_space
    tier: 5
    source_domain: college_physics_ch24
  geometric_optics:
    defines: The branch of optics in which light is described by rays and geometry
      because it interacts with objects much larger than its wavelength.
    composed_of:
    - light_ray
    tier: 1
    source_domain: college_physics_ch25
  index_of_refraction:
    defines: A dimensionless quantity n = c/v giving the ratio of the speed of light
      in vacuum to its speed in a given medium; always greater than or equal to 1.
    composed_of:
    - speed_of_light_vacuum
    tier: 1
    source_domain: college_physics_ch25
    also_in:
    - college_physics_ch27
  law_of_reflection:
    defines: The angle of reflection equals the angle of incidence, both measured
      from the perpendicular to the surface at the point of contact.
    composed_of:
    - light_ray
    - geometric_optics
    tier: 2
    source_domain: college_physics_ch25
  refraction:
    defines: The change in direction of a light ray as it passes from one medium to
      another, caused by the change in the speed of light between media.
    composed_of:
    - light_ray
    - index_of_refraction
    tier: 2
    source_domain: college_physics_ch25
  focal_point:
    defines: For a converging lens or mirror, the point at which parallel rays converge
      after passing through or reflecting; for a diverging lens or mirror, the point
      from which diverging rays appear to originate.
    composed_of:
    - light_ray
    - geometric_optics
    tier: 2
    source_domain: college_physics_ch25
  object_distance:
    defines: The distance d_o from an object to the center of a lens or mirror.
    composed_of:
    - geometric_optics
    tier: 2
    source_domain: college_physics_ch25
  image_distance:
    defines: The distance d_i from the center of a lens or mirror to the image it
      forms; positive for a real image and negative for a virtual image.
    composed_of:
    - geometric_optics
    tier: 2
    source_domain: college_physics_ch25
  specular_reflection:
    defines: Reflection from a smooth surface (relative to the wavelength of light)
      in which parallel incoming rays reflect in a single well-defined direction.
    composed_of:
    - law_of_reflection
    - wavelength
    tier: 3
    source_domain: college_physics_ch25
  diffuse_reflection:
    defines: Reflection from a rough surface that scatters incoming rays in many directions,
      allowing objects to be seen from any angle.
    composed_of:
    - law_of_reflection
    tier: 3
    source_domain: college_physics_ch25
  snells_law:
    defines: The quantitative relationship n₁ sin θ₁ = n₂ sin θ₂ that governs the
      angle of refraction when light crosses the boundary between two media.
    composed_of:
    - refraction
    - index_of_refraction
    tier: 3
    source_domain: college_physics_ch25
  dispersion:
    defines: The spreading of white light into its full spectrum of wavelengths that
      occurs because the index of refraction of a medium varies with wavelength.
    composed_of:
    - refraction
    - index_of_refraction
    - wavelength
    tier: 3
    source_domain: college_physics_ch25
  focal_length:
    defines: The distance f from the center of a lens or mirror to its focal point,
      positive for converging optics and negative for diverging optics.
    composed_of:
    - focal_point
    tier: 3
    source_domain: college_physics_ch25
    also_in:
    - college_physics_ch26
  ray_tracing:
    defines: A graphical technique for determining image location and size by following
      the paths of selected light rays through an optical system using a defined set
      of rules.
    composed_of:
    - light_ray
    - focal_point
    tier: 3
    source_domain: college_physics_ch25
  magnification:
    defines: The ratio m = h_i/h_o = −d_i/d_o of image height to object height, with
      sign indicating orientation (negative = inverted).
    composed_of:
    - image_distance
    - object_distance
    tier: 3
    source_domain: college_physics_ch25
    also_in:
    - college_physics_ch26
  critical_angle:
    defines: The incident angle θ_c at which the refracted ray travels exactly along
      the boundary (θ_refracted = 90°), given by sin θ_c = n₂/n₁ when n₂ < n₁.
    composed_of:
    - snells_law
    - index_of_refraction
    tier: 4
    source_domain: college_physics_ch25
  lens_power:
    defines: The inverse of the focal length in meters, P = 1/f, measured in diopters
      (D), expressing the converging or diverging strength of a lens or mirror.
    composed_of:
    - focal_length
    tier: 4
    source_domain: college_physics_ch25
    also_in:
    - college_physics_ch26
  converging_lens:
    defines: A lens shaped so that parallel rays entering along its axis are refracted
      to cross at a single focal point on the opposite side, with positive focal length.
    composed_of:
    - refraction
    - focal_length
    tier: 4
    source_domain: college_physics_ch25
  diverging_lens:
    defines: A lens shaped so that parallel rays entering along its axis are refracted
      to spread apart, appearing to originate from a focal point on the same side
      as the incoming light, with negative focal length.
    composed_of:
    - refraction
    - focal_length
    tier: 4
    source_domain: college_physics_ch25
  thin_lens_equations:
    defines: The pair of equations 1/d_o + 1/d_i = 1/f and m = −d_i/d_o that quantitatively
      relate object distance, image distance, focal length, and magnification for
      a thin lens or mirror.
    composed_of:
    - object_distance
    - image_distance
    - focal_length
    - magnification
    tier: 4
    source_domain: college_physics_ch25
  real_image:
    defines: An image formed where light rays actually converge, which can be projected
      onto a screen and is always inverted relative to the object.
    composed_of:
    - ray_tracing
    tier: 4
    source_domain: college_physics_ch25
  virtual_image:
    defines: An image from which light rays only appear to diverge — rays do not actually
      pass through the image location — so it cannot be projected on a screen and
      is always upright.
    composed_of:
    - ray_tracing
    tier: 4
    source_domain: college_physics_ch25
  total_internal_reflection:
    defines: The complete reflection of a light ray back into the original medium
      that occurs when the incident angle exceeds the critical angle and the second
      medium has a lower index of refraction.
    composed_of:
    - critical_angle
    tier: 5
    source_domain: college_physics_ch25
  spherical_mirror:
    defines: A mirror whose reflecting surface is a section of a sphere; concave (converging,
      positive f) or convex (diverging, negative f), with focal length equal to half
      the radius of curvature.
    composed_of:
    - law_of_reflection
    - radius_of_curvature
    tier: 5
    source_domain: college_physics_ch25
  flat_mirror_image:
    defines: A flat mirror produces a virtual, upright image located the same distance
      behind the mirror as the object is in front, with unit magnification.
    composed_of:
    - law_of_reflection
    - virtual_image
    tier: 5
    source_domain: college_physics_ch25
  eye_as_optical_system:
    defines: The cornea and lens of the eye act together as a single thin lens that
      forms a real, inverted image on the retina.
    composed_of:
    - thin_lens_equation
    - convex_lens
    tier: 1
    source_domain: college_physics_ch26
  accommodation:
    defines: The process by which the ciliary muscle changes the shape and power of
      the eye's lens to focus on objects at different distances.
    composed_of:
    - eye_as_optical_system
    - lens_power
    tier: 2
    source_domain: college_physics_ch26
  near_point:
    defines: The closest distance at which the eye can focus sharply on an object,
      normally about 25 cm for a young adult.
    composed_of:
    - accommodation
    tier: 3
    source_domain: college_physics_ch26
  far_point:
    defines: The farthest distance at which the eye can focus sharply, normally at
      infinity for an unaccommodated eye.
    composed_of:
    - accommodation
    tier: 3
    source_domain: college_physics_ch26
  myopia:
    defines: A vision defect in which the eye overconverges light so that distant
      objects are focused in front of the retina.
    composed_of:
    - eye_as_optical_system
    - far_point
    tier: 4
    source_domain: college_physics_ch26
  hyperopia:
    defines: A vision defect in which the eye underconverges light so that close objects
      are focused behind the retina.
    composed_of:
    - eye_as_optical_system
    - near_point
    tier: 4
    source_domain: college_physics_ch26
  presbyopia:
    defines: The age-related loss of the eye's ability to accommodate, caused by stiffening
      of the lens.
    composed_of:
    - accommodation
    tier: 3
    source_domain: college_physics_ch26
  astigmatism:
    defines: A vision defect caused by asymmetric curvature of the cornea or lens,
      producing uneven focus along certain axes.
    composed_of:
    - eye_as_optical_system
    tier: 2
    source_domain: college_physics_ch26
  rods_and_cones:
    defines: The two types of photoreceptors in the retina, responsible for dim-light
      vision and color/high-acuity vision respectively.
    composed_of:
    - wavelength
    tier: 1
    source_domain: college_physics_ch26
  simplified_color_vision_theory:
    defines: The theory that three types of cones, each sensitive to a different wavelength
      range, combine responses to produce all perceived hues.
    composed_of:
    - rods_and_cones
    tier: 2
    source_domain: college_physics_ch26
  color_constancy:
    defines: The ability of the eye-brain system to perceive the true color of an
      object despite changes in illumination.
    composed_of:
    - simplified_color_vision_theory
    tier: 3
    source_domain: college_physics_ch26
  retinex_theory:
    defines: A modified color vision theory proposing three retinex systems that are
      compared to determine true colors under varying illumination.
    composed_of:
    - simplified_color_vision_theory
    - color_constancy
    tier: 4
    source_domain: college_physics_ch26
  compound_microscope:
    defines: An optical instrument using an objective lens to form an enlarged real
      image, further magnified by an eyepiece.
    composed_of:
    - convex_lens
    - focal_length
    - magnification
    tier: 1
    source_domain: college_physics_ch26
  overall_magnification:
    defines: The total magnification of a multi-element optical system, equal to the
      product of the individual magnifications.
    composed_of:
    - magnification
    - compound_microscope
    tier: 2
    source_domain: college_physics_ch26
  numerical_aperture:
    defines: A measure of a lens's light-gathering ability defined as NA = n sin alpha.
    composed_of:
    - refractive_index
    tier: 1
    source_domain: college_physics_ch26
    also_in:
    - college_physics_ch27
  f_number:
    defines: The ratio of a lens's focal length to its aperture diameter, characterizing
      light per unit area reaching the image plane.
    composed_of:
    - focal_length
    tier: 1
    source_domain: college_physics_ch26
  telescope:
    defines: An optical instrument using a long-focal-length objective and short-focal-length
      eyepiece to magnify distant objects.
    composed_of:
    - convex_lens
    - focal_length
    tier: 1
    source_domain: college_physics_ch26
  angular_magnification:
    defines: The ratio of the angle subtended by the image through a telescope to
      the angle subtended by the object unaided, M = -fo/fe.
    composed_of:
    - telescope
    - magnification
    tier: 2
    source_domain: college_physics_ch26
  aberration:
    defines: A distortion in an image produced by an optical system, arising from
      lens geometry, material properties, or object position.
    composed_of:
    - convex_lens
    tier: 1
    source_domain: college_physics_ch26
  chromatic_aberration:
    defines: An aberration caused by the wavelength-dependence of refractive index,
      producing different focal points for different colors.
    composed_of:
    - aberration
    - refractive_index
    - wavelength
    tier: 2
    source_domain: college_physics_ch26
  spherical_aberration:
    defines: An aberration in which rays through outer edges of a spherical lens converge
      at a different point than rays near the axis.
    composed_of:
    - aberration
    tier: 2
    source_domain: college_physics_ch26
  coma:
    defines: An aberration from off-axis imaging that produces pear-shaped distortion.
    composed_of:
    - aberration
    tier: 2
    source_domain: college_physics_ch26
  wavelength_in_medium:
    defines: The wavelength of light in a medium, given by λ_n = λ/n, which is always
      shorter than its vacuum wavelength.
    composed_of:
    - wavelength
    - index_of_refraction
    tier: 1
    source_domain: college_physics_ch27
  coherence:
    defines: The property of waves being in phase or having a definite phase relationship,
      as opposed to incoherent waves with random phase relationships.
    composed_of:
    - electromagnetic_wave
    - frequency
    tier: 1
    source_domain: college_physics_ch27
  huygens_principle:
    defines: Every point on a wavefront is a source of wavelets that spread out in
      the forward direction at the wave speed, and the new wavefront is the line tangent
      to all wavelets.
    composed_of:
    - wavefront
    tier: 1
    source_domain: college_physics_ch27
  path_length_difference:
    defines: The difference in distance traveled by two waves from their sources to
      a common point, which determines whether they interfere constructively or destructively.
    composed_of:
    - wavelength
    tier: 1
    source_domain: college_physics_ch27
  phase_change_on_reflection:
    defines: A half-wavelength (λ/2) phase shift that occurs when light reflects from
      a medium with a greater index of refraction than the medium in which it is traveling.
    composed_of:
    - wavelength
    - index_of_refraction
    tier: 1
    source_domain: college_physics_ch27
  diffraction:
    defines: The bending of a wave around the edges of an opening or obstacle, most
      prominent when the opening is comparable in size to the wavelength.
    composed_of:
    - huygens_principle
    - wavelength
    tier: 2
    source_domain: college_physics_ch27
  malus_law:
    defines: The intensity of polarized light transmitted through a polarizing filter
      is I = I₀ cos²θ, where θ is the angle between the polarization direction and
      the filter axis.
    composed_of:
    - polarization
    tier: 2
    source_domain: college_physics_ch27
  brewsters_law:
    defines: Reflected light is completely polarized at Brewster's angle θ_b, given
      by tan θ_b = n₂/n₁, where n₁ and n₂ are the indices of refraction of the two
      media.
    composed_of:
    - polarization
    - index_of_refraction
    tier: 2
    source_domain: college_physics_ch27
  polarization_by_scattering:
    defines: The partial polarization of light that occurs when it is scattered by
      particles such as air molecules, which oscillate perpendicular to the incident
      ray and radiate polarized light.
    composed_of:
    - polarization
    tier: 2
    source_domain: college_physics_ch27
  optical_activity:
    defines: The property of certain substances to rotate the plane of polarization
      of light passing through them, due to asymmetric molecular shapes.
    composed_of:
    - polarization
    tier: 2
    source_domain: college_physics_ch27
  birefringence:
    defines: The property of certain crystals to split an unpolarized beam of light
      into two beams with different polarizations, one ordinary and one extraordinary.
    composed_of:
    - polarization
    - index_of_refraction
    tier: 2
    source_domain: college_physics_ch27
  double_slit_interference:
    defines: The interference pattern produced when coherent light passes through
      two narrow slits, with constructive interference at d sin θ = mλ and destructive
      at d sin θ = (m + ½)λ.
    composed_of:
    - coherence
    - diffraction
    - constructive_interference
    - destructive_interference
    - path_length_difference
    tier: 3
    source_domain: college_physics_ch27
  interference_order:
    defines: The integer m used in interference equations that labels the sequence
      of maxima or minima in a diffraction or interference pattern.
    composed_of:
    - constructive_interference
    - destructive_interference
    - path_length_difference
    tier: 3
    source_domain: college_physics_ch27
  interference_fringes:
    defines: The pattern of alternating bright and dark bands produced by constructive
      and destructive interference of light waves.
    composed_of:
    - constructive_interference
    - destructive_interference
    tier: 3
    source_domain: college_physics_ch27
  single_slit_diffraction:
    defines: The diffraction pattern from a single slit characterized by a broad central
      maximum and progressively dimmer side maxima, with destructive minima at D sin
      θ = mλ.
    composed_of:
    - diffraction
    - constructive_interference
    - destructive_interference
    - path_length_difference
    tier: 3
    source_domain: college_physics_ch27
  thin_film_interference:
    defines: Interference between light reflected from the top and bottom surfaces
      of a thin film, producing colors dependent on film thickness, wavelength, and
      refractive indices.
    composed_of:
    - wavelength_in_medium
    - constructive_interference
    - destructive_interference
    - phase_change_on_reflection
    tier: 3
    source_domain: college_physics_ch27
  diffraction_grating:
    defines: An optical element with a large number of evenly spaced parallel slits
      that produces an interference pattern with sharper and narrower maxima than
      a double slit, with constructive interference at d sin θ = mλ.
    composed_of:
    - double_slit_interference
    - interference_order
    tier: 4
    source_domain: college_physics_ch27
  rayleigh_criterion:
    defines: Two images are just resolvable when the center of the diffraction pattern
      of one falls on the first minimum of the other, giving a minimum angular separation
      of θ = 1.22λ/D.
    composed_of:
    - single_slit_diffraction
    tier: 4
    source_domain: college_physics_ch27
  resolving_power:
    defines: The minimum distance by which two point objects can be separated and
      still be seen as distinct, limited by diffraction.
    composed_of:
    - rayleigh_criterion
    tier: 5
    source_domain: college_physics_ch27
  first_postulate:
    defines: The laws of physics are the same and can be stated in their simplest
      form in all inertial frames of reference.
    composed_of:
    - inertial_reference_frame
    tier: 1
    source_domain: college_physics_ch28
  second_postulate:
    defines: The speed of light c is a constant, independent of the relative motion
      of the source.
    composed_of:
    - speed_of_light
    tier: 1
    source_domain: college_physics_ch28
  proper_time:
    defines: The time interval Δt₀ measured by an observer at rest relative to the
      event being observed.
    composed_of:
    - inertial_reference_frame
    tier: 1
    source_domain: college_physics_ch28
  proper_length:
    defines: The distance L₀ between two points measured by an observer who is at
      rest relative to both points.
    composed_of:
    - inertial_reference_frame
    tier: 1
    source_domain: college_physics_ch28
  rest_energy:
    defines: The energy an object possesses due to its mass when at rest, given by
      E₀ = mc², showing that mass is a form of energy.
    composed_of:
    - rest_mass
    - speed_of_light
    tier: 1
    source_domain: college_physics_ch28
  lorentz_factor:
    defines: The relativistic factor γ = 1/√(1 − v²/c²) that quantifies the magnitude
      of relativistic effects at a given velocity.
    composed_of:
    - second_postulate
    tier: 2
    source_domain: college_physics_ch28
  simultaneity:
    defines: Two events are simultaneous if an observer measures them as occurring
      at the same time; simultaneity is not absolute and depends on the observer's
      frame of reference.
    composed_of:
    - first_postulate
    - second_postulate
    tier: 2
    source_domain: college_physics_ch28
  relativistic_velocity_addition:
    defines: The correct formula for combining velocities at relativistic speeds,
      u = (v + u’)/(1 + vu’/c²), ensuring the result never exceeds c.
    composed_of:
    - classical_velocity_addition
    - second_postulate
    tier: 2
    source_domain: college_physics_ch28
  mass_energy_equivalence:
    defines: The principle that mass can be converted into energy and vice versa,
      as expressed by E = mc², making mass a form of stored energy.
    composed_of:
    - rest_energy
    tier: 2
    source_domain: college_physics_ch28
    also_in:
    - college_physics_ch31
  time_dilation:
    defines: The phenomenon whereby time passes slower for an observer moving relative
      to another observer, described by Δt = γΔt₀.
    composed_of:
    - lorentz_factor
    - proper_time
    tier: 3
    source_domain: college_physics_ch28
  length_contraction:
    defines: The shortening of the measured length of an object moving relative to
      the observer’s frame, given by L = L₀/γ.
    composed_of:
    - lorentz_factor
    - proper_length
    tier: 3
    source_domain: college_physics_ch28
  relativistic_momentum:
    defines: Momentum of an object moving at relativistic speed, defined as p = γmu,
      which approaches infinity as v approaches c.
    composed_of:
    - lorentz_factor
    - classical_momentum
    - rest_mass
    tier: 3
    source_domain: college_physics_ch28
  total_energy:
    defines: The total energy of an object defined as E = γmc², encompassing both
      rest energy and kinetic energy.
    composed_of:
    - lorentz_factor
    - rest_energy
    tier: 3
    source_domain: college_physics_ch28
  relativistic_doppler_effect:
    defines: The shift in observed wavelength of electromagnetic radiation due to
      relative motion between source and observer, with red shift for recession and
      blue shift for approach.
    composed_of:
    - time_dilation
    tier: 4
    source_domain: college_physics_ch28
  relativistic_kinetic_energy:
    defines: The kinetic energy of a relativistic object, KE = (γ − 1)mc², which reduces
      to ½mv² at low speeds and approaches infinity as v approaches c.
    composed_of:
    - total_energy
    - rest_energy
    - classical_kinetic_energy
    tier: 4
    source_domain: college_physics_ch28
  energy_momentum_relation:
    defines: The relativistic relationship E² = (pc)² + (mc²)² connecting total energy,
      momentum, and rest mass, implying massless particles carry momentum equal to
      E/c.
    composed_of:
    - total_energy
    - relativistic_momentum
    tier: 4
    source_domain: college_physics_ch28
  quantization:
    defines: The principle that certain physical quantities such as energy exist only
      in discrete values rather than a continuous range.
    composed_of:
    - energy
    tier: 1
    source_domain: college_physics_ch29
  planck_constant:
    defines: The fundamental constant h = 6.626 × 10⁻³⁴ J·s that sets the scale of
      quantum effects and relates photon energy to frequency.
    composed_of:
    - quantization
    - frequency
    tier: 2
    source_domain: college_physics_ch29
    also_in:
    - college_physics_ch30
  correspondence_principle:
    defines: The principle that quantum mechanics reduces to classical physics in
      the limit of large, slow-moving objects where quantum steps become negligibly
      small.
    composed_of:
    - quantization
    tier: 2
    source_domain: college_physics_ch29
  energy_quantization:
    defines: The restriction that oscillator energies can only take values E = nhf,
      where n is a non-negative integer, f is frequency, and h is Planck's constant.
    composed_of:
    - planck_constant
    tier: 3
    source_domain: college_physics_ch29
  photon:
    defines: A quantum of electromagnetic radiation that carries energy E = hf and
      interacts as a discrete particle-like unit.
    composed_of:
    - electromagnetic_radiation
    - planck_constant
    tier: 3
    source_domain: college_physics_ch29
    also_in:
    - college_physics_ch30
    - college_physics_ch31
  blackbody_radiation:
    defines: Electromagnetic radiation emitted by an ideal radiator whose spectrum
      depends only on temperature and required quantized energy levels for theoretical
      explanation.
    composed_of:
    - electromagnetic_radiation
    - energy_quantization
    tier: 4
    source_domain: college_physics_ch29
    also_in:
    - college_physics_ch34
  atomic_spectra:
    defines: Discrete line spectra of electromagnetic emissions from atoms and molecules,
      arising from electrons transitioning between quantized energy levels.
    composed_of:
    - electromagnetic_radiation
    - electron
    - energy_quantization
    tier: 4
    source_domain: college_physics_ch29
    also_in:
    - college_physics_ch30
  photon_energy:
    defines: The energy of a single photon given by E = hf = hc/λ, determining its
      ability to interact with atoms, molecules, and electrons.
    composed_of:
    - photon
    - wavelength
    tier: 4
    source_domain: college_physics_ch29
  photon_momentum:
    defines: The momentum carried by a massless photon, given by p = h/λ, verified
      experimentally through the Compton effect.
    composed_of:
    - photon
    - momentum
    - wavelength
    tier: 4
    source_domain: college_physics_ch29
  particle_wave_duality:
    defines: The principle that all entities, including photons and matter, exhibit
      both particle-like and wave-like properties depending on the observation.
    composed_of:
    - photon
    tier: 4
    source_domain: college_physics_ch29
  photoelectric_effect:
    defines: The ejection of electrons from a material when struck by light, explained
      by individual photons transferring their energy to individual electrons.
    composed_of:
    - photon_energy
    - electron
    tier: 5
    source_domain: college_physics_ch29
  ionizing_radiation:
    defines: Electromagnetic radiation (UV, x rays, gamma rays) with sufficient photon
      energy to ionize atoms and molecules in absorbing materials.
    composed_of:
    - photon_energy
    tier: 5
    source_domain: college_physics_ch29
    also_in:
    - college_physics_ch31
    - college_physics_ch32
  compton_effect:
    defines: The scattering of x-ray photons by electrons in which energy and momentum
      are conserved, resulting in increased photon wavelength and confirming photon
      momentum.
    composed_of:
    - photon_momentum
    - electron
    tier: 5
    source_domain: college_physics_ch29
  de_broglie_wavelength:
    defines: The wavelength λ = h/p associated with any particle of momentum p, establishing
      that all matter has wave properties.
    composed_of:
    - particle_wave_duality
    - momentum
    - wavelength
    tier: 5
    source_domain: college_physics_ch29
    also_in:
    - college_physics_ch30
  probability_distribution:
    defines: The spatial distribution describing the probability of finding a particle
      at a given location, built up statistically from many individual measurements.
    composed_of:
    - particle_wave_duality
    tier: 5
    source_domain: college_physics_ch29
  binding_energy:
    defines: The minimum energy BE = hf₀ required to eject an electron from a material,
      where f₀ is the threshold frequency.
    composed_of:
    - photoelectric_effect
    tier: 6
    source_domain: college_physics_ch29
    also_in:
    - college_physics_ch31
  heisenberg_uncertainty_principle:
    defines: The fundamental limit ΔxΔp ≥ h/4π (and ΔEΔt ≥ h/4π) stating that certain
      pairs of physical quantities cannot both be measured to arbitrary precision
      simultaneously.
    composed_of:
    - probability_distribution
    - de_broglie_wavelength
    tier: 6
    source_domain: college_physics_ch29
    also_in:
    - college_physics_ch33
  electron:
    defines: A negatively charged subatomic particle with mass 9.11e-31 kg.
    composed_of:
    - atom
    - electric_charge
    tier: 1
    source_domain: college_physics_ch30
    also_in:
    - college_physics_ch18
    - college_physics_ch31
  atomic_nucleus:
    defines: The very small, dense, positively charged core of an atom containing
      nearly all of its mass.
    composed_of:
    - atom
    - electric_charge
    tier: 1
    source_domain: college_physics_ch30
  charge_to_mass_ratio:
    defines: The ratio e/m measured by Thomson using crossed electric and magnetic
      fields to deflect cathode rays.
    composed_of:
    - electron
    tier: 2
    source_domain: college_physics_ch30
  electron_charge:
    defines: The fundamental unit of electric charge, 1.60e-19 C, with all charges
      found to be integer multiples of this value.
    composed_of:
    - electron
    tier: 2
    source_domain: college_physics_ch30
  planetary_model:
    defines: Rutherford's model in which electrons orbit a small massive nucleus,
      analogous to planets orbiting the sun.
    composed_of:
    - electron
    - atomic_nucleus
    - coulomb_force
    tier: 2
    source_domain: college_physics_ch30
  rydberg_formula:
    defines: Empirical equation predicting hydrogen spectrum wavelengths as 1/lambda
      = R(1/n_f^2 - 1/n_i^2).
    composed_of:
    - atomic_spectra
    tier: 2
    source_domain: college_physics_ch30
  bremsstrahlung:
    defines: A continuous spectrum of x rays produced by the deceleration of electrons
      striking a material.
    composed_of:
    - electron
    - photon
    tier: 2
    source_domain: college_physics_ch30
  atomic_excitation:
    defines: The process by which an atom absorbs energy to promote electrons to higher
      energy states.
    composed_of:
    - atomic_spectra
    - photon
    tier: 2
    source_domain: college_physics_ch30
  bohr_model:
    defines: Semiclassical model with quantized circular orbits and angular momentum
      L = n*hbar, predicting the hydrogen spectrum.
    composed_of:
    - planetary_model
    - classical_angular_momentum
    - planck_constant
    - atomic_spectra
    tier: 3
    source_domain: college_physics_ch30
  atomic_de_excitation:
    defines: The process by which an excited atom transitions to a lower energy state
      by emitting a photon.
    composed_of:
    - atomic_excitation
    tier: 3
    source_domain: college_physics_ch30
  orbital_magnetic_field:
    defines: The magnetic field generated by the current loop of an electron's orbital
      motion.
    composed_of:
    - planetary_model
    tier: 3
    source_domain: college_physics_ch30
  quantized_orbits:
    defines: Allowed electron orbits with discrete energy values, with transitions
      involving photon emission or absorption of energy hf.
    composed_of:
    - bohr_model
    tier: 4
    source_domain: college_physics_ch30
  bohr_radius:
    defines: The radius of the lowest electron orbit in hydrogen, a_B = 0.529e-10
      m, with allowed radii scaling as n^2/Z.
    composed_of:
    - bohr_model
    tier: 4
    source_domain: college_physics_ch30
  hydrogen_like_atom:
    defines: Any atom with Z protons and a single electron, with energies shifted
      by Z^2 relative to hydrogen.
    composed_of:
    - bohr_model
    tier: 4
    source_domain: college_physics_ch30
  principal_quantum_number:
    defines: The quantum number n = 1, 2, 3, ... labeling basic energy states and
      determining energy and average distance from nucleus.
    composed_of:
    - bohr_model
    tier: 4
    source_domain: college_physics_ch30
  fluorescence:
    defines: De-excitation by emitting multiple lower-energy photons through intermediate
      steps after high-energy photon absorption.
    composed_of:
    - atomic_de_excitation
    tier: 4
    source_domain: college_physics_ch30
  metastable_state:
    defines: An excited energy level with long lifetime because quantum numbers inhibit
      rapid de-excitation.
    composed_of:
    - atomic_de_excitation
    tier: 4
    source_domain: college_physics_ch30
  stimulated_emission:
    defines: Photon emission triggered by an incoming photon of the same energy, producing
      an identical second photon.
    composed_of:
    - atomic_de_excitation
    tier: 4
    source_domain: college_physics_ch30
  orbital_energies:
    defines: Quantized energies E_n = -Z^2 E_0/n^2, where E_0 = 13.6 eV is the hydrogen
      ground-state energy.
    composed_of:
    - hydrogen_like_atom
    - quantized_orbits
    tier: 5
    source_domain: college_physics_ch30
  energy_level_diagram:
    defines: A vertical plot of allowed quantized energy states, with ground state
      at bottom and excited states above.
    composed_of:
    - quantized_orbits
    tier: 5
    source_domain: college_physics_ch30
  angular_momentum_quantum_number:
    defines: Quantum number l determining orbital angular momentum magnitude L = sqrt(l(l+1))*hbar,
      with l = 0 to n-1.
    composed_of:
    - principal_quantum_number
    tier: 5
    source_domain: college_physics_ch30
  space_quantization:
    defines: Quantization of the direction of orbital angular momentum to discrete
      angles relative to an external axis.
    composed_of:
    - quantized_orbits
    tier: 5
    source_domain: college_physics_ch30
  wave_nature_quantization:
    defines: Quantization arising because only orbits fitting an integer number of
      de Broglie wavelengths allow constructive interference.
    composed_of:
    - de_broglie_wavelength
    - quantized_orbits
    tier: 5
    source_domain: college_physics_ch30
  phosphorescence:
    defines: Slow light emission from de-excitation of a metastable state, long after
      initial excitation.
    composed_of:
    - metastable_state
    tier: 5
    source_domain: college_physics_ch30
  population_inversion:
    defines: Condition where most atoms occupy a metastable excited state rather than
      the ground state, required for laser operation.
    composed_of:
    - metastable_state
    - stimulated_emission
    tier: 5
    source_domain: college_physics_ch30
  laser:
    defines: Device producing coherent single-wavelength radiation through light amplification
      by stimulated emission, requiring population inversion.
    composed_of:
    - population_inversion
    tier: 6
    source_domain: college_physics_ch30
  characteristic_x_rays:
    defines: Discrete-energy x rays emitted when inner-shell vacancies are filled,
      with energies scaling as Z^2.
    composed_of:
    - orbital_energies
    - atomic_de_excitation
    tier: 6
    source_domain: college_physics_ch30
  magnetic_quantum_number:
    defines: Quantum number m_l specifying the z-component of orbital angular momentum
      L_z = m_l*hbar, from -l to +l.
    composed_of:
    - angular_momentum_quantum_number
    - space_quantization
    tier: 6
    source_domain: college_physics_ch30
  intrinsic_spin:
    defines: Internal angular momentum of an electron, quantized with s = 1/2 and
      spin-up or spin-down direction.
    composed_of:
    - space_quantization
    tier: 6
    source_domain: college_physics_ch30
    also_in:
    - college_physics_ch33
  probability_cloud:
    defines: Quantum mechanical description of electron position as a probability
      distribution rather than a definite orbit.
    composed_of:
    - wave_nature_quantization
    tier: 6
    source_domain: college_physics_ch30
  zeeman_effect:
    defines: Splitting of spectral lines in an external magnetic field due to interaction
      with quantized orbital magnetic moment.
    composed_of:
    - orbital_magnetic_field
    - space_quantization
    tier: 6
    source_domain: college_physics_ch30
  spin_quantum_number:
    defines: Quantum numbers s = 1/2 and m_s = +/-1/2 specifying magnitude and z-component
      of intrinsic spin.
    composed_of:
    - intrinsic_spin
    tier: 7
    source_domain: college_physics_ch30
  fine_structure:
    defines: Splitting of spectral lines into doublets from interaction between spin
      and orbital magnetic fields.
    composed_of:
    - intrinsic_spin
    - orbital_magnetic_field
    tier: 7
    source_domain: college_physics_ch30
  pauli_exclusion_principle:
    defines: No two electrons in an atom can share the same set of quantum numbers
      (n, l, m_l, m_s).
    composed_of:
    - magnetic_quantum_number
    - spin_quantum_number
    tier: 8
    source_domain: college_physics_ch30
    also_in:
    - college_physics_ch33
  electron_shells:
    defines: Groupings by n (shells) and l (subshells), with max occupancies 2(2l+1)
      per subshell and 2n^2 per shell.
    composed_of:
    - pauli_exclusion_principle
    tier: 9
    source_domain: college_physics_ch30
  electron_configuration:
    defines: Arrangement of electrons in shells and subshells (e.g. 1s^2 2s^2 2p^6),
      determining chemical properties.
    composed_of:
    - electron_shells
    tier: 10
    source_domain: college_physics_ch30
  radioactivity:
    defines: The spontaneous emission of radiation by unstable nuclei that convert
      part of their mass into energy.
    composed_of:
    - nucleus
    - mass_energy_equivalence
    tier: 1
    source_domain: college_physics_ch31
  nucleon:
    defines: A constituent particle of the nucleus, either a proton or a neutron.
    composed_of:
    - proton
    - neutron
    tier: 1
    source_domain: college_physics_ch31
  atomic_number:
    defines: The number of protons Z in a nucleus, which uniquely identifies the element.
    composed_of:
    - nucleus
    - proton
    tier: 1
    source_domain: college_physics_ch31
  antimatter:
    defines: Particles that are counterparts to ordinary matter with opposite charge,
      including positrons and antineutrinos.
    composed_of:
    - electron
    tier: 1
    source_domain: college_physics_ch31
    also_in:
    - college_physics_ch33
  potential_energy_barrier:
    defines: A region of high potential energy that classically confines a particle
      but can be penetrated quantum mechanically.
    composed_of:
    - kinetic_energy
    tier: 1
    source_domain: college_physics_ch31
  nuclear_radiation:
    defines: Energetic rays originating from nuclei, including alpha, beta, and gamma
      radiation, with energies on the order of MeV.
    composed_of:
    - radioactivity
    tier: 2
    source_domain: college_physics_ch31
  unified_atomic_mass_unit:
    defines: A mass unit defined so that carbon-12 has exactly 12 u, with 1 u = 931.5
      MeV/c².
    composed_of:
    - nucleon
    - mass_energy_equivalence
    tier: 2
    source_domain: college_physics_ch31
  mass_number:
    defines: The total number of nucleons A = Z + N in a nucleus.
    composed_of:
    - atomic_number
    - nucleon
    tier: 2
    source_domain: college_physics_ch31
  strong_nuclear_force:
    defines: A very short-range attractive force between nucleons about 100 times
      stronger than the Coulomb force, responsible for holding nuclei together.
    composed_of:
    - nucleon
    - electromagnetic_force
    tier: 2
    source_domain: college_physics_ch31
  weak_nuclear_force:
    defines: A very short-range nuclear force distinct from the strong force, responsible
      for beta decay.
    composed_of:
    - nucleon
    tier: 2
    source_domain: college_physics_ch31
  quantum_tunneling:
    defines: A quantum process in which a particle penetrates a potential energy barrier
      it classically lacks the energy to surmount.
    composed_of:
    - wave_function
    - potential_energy_barrier
    tier: 2
    source_domain: college_physics_ch31
    also_in:
    - college_physics_ch32
  conservation_of_electron_family_number:
    defines: The total electron family number remains constant in any process, requiring
      creation of antimatter counterparts when electrons or positrons are produced.
    composed_of:
    - electron
    - antimatter
    tier: 2
    source_domain: college_physics_ch31
  alpha_radiation:
    defines: Nuclear radiation consisting of helium-4 nuclei (two protons and two
      neutrons) with the shortest range and strongest ionizing ability.
    composed_of:
    - nuclear_radiation
    - proton
    - neutron
    tier: 3
    source_domain: college_physics_ch31
  beta_radiation:
    defines: Nuclear radiation consisting of electrons or positrons emitted from the
      nucleus, with intermediate range and ionizing ability.
    composed_of:
    - nuclear_radiation
    - electron
    tier: 3
    source_domain: college_physics_ch31
  gamma_radiation:
    defines: Nuclear radiation consisting of high-energy photons emitted by nuclei,
      uncharged, with the greatest range and least ionizing ability.
    composed_of:
    - nuclear_radiation
    - photon
    tier: 3
    source_domain: college_physics_ch31
  nuclide:
    defines: A specific nuclear species defined by a unique combination of protons
      (Z) and neutrons (N).
    composed_of:
    - atomic_number
    - mass_number
    tier: 3
    source_domain: college_physics_ch31
  mass_defect:
    defines: The difference between the total mass of a nucleus’s separate nucleons
      and the actual mass of the nucleus.
    composed_of:
    - nucleon
    - unified_atomic_mass_unit
    tier: 3
    source_domain: college_physics_ch31
  neutrino:
    defines: A nearly massless, uncharged fermion emitted in beta decay that interacts
      only via the weak nuclear force.
    composed_of:
    - weak_nuclear_force
    - conservation_of_energy
    - conservation_of_momentum
    tier: 3
    source_domain: college_physics_ch31
    also_in:
    - college_physics_ch34
  nuclear_radius:
    defines: The approximate radius of a nucleus given by r = r₀A^(1/3), implying
      nuclear volume is proportional to the number of nucleons.
    composed_of:
    - mass_number
    tier: 3
    source_domain: college_physics_ch31
  range_of_radiation:
    defines: The distance radiation can travel through a material, determined by energy,
      charge, speed, and the material’s electron density.
    composed_of:
    - ionizing_radiation
    tier: 4
    source_domain: college_physics_ch31
  radiation_detector:
    defines: An instrument that detects ionizing radiation based on the ionization
      it produces in matter.
    composed_of:
    - ionizing_radiation
    tier: 4
    source_domain: college_physics_ch31
  isotope:
    defines: Nuclei of the same element (same Z) that differ in the number of neutrons,
      with nearly identical chemistry but different nuclear properties.
    composed_of:
    - nuclide
    tier: 4
    source_domain: college_physics_ch31
  chart_of_nuclides:
    defines: A plot of N versus Z for known nuclides that reveals patterns in nuclear
      stability, abundance, and decay modes.
    composed_of:
    - nuclide
    tier: 4
    source_domain: college_physics_ch31
  magic_numbers:
    defines: Specific numbers of protons or neutrons that correspond to closed nuclear
      shells and greater stability.
    composed_of:
    - nuclide
    - strong_nuclear_force
    tier: 4
    source_domain: college_physics_ch31
  nuclear_decay:
    defines: The process by which an unstable parent nucleus transforms into a daughter
      nucleus by emitting particles or radiation, obeying conservation laws.
    composed_of:
    - radioactivity
    - nuclide
    - conservation_of_energy
    - conservation_of_momentum
    tier: 4
    source_domain: college_physics_ch31
  decay_series:
    defines: A sequence of successive nuclear decays from an unstable parent through
      intermediate daughters until a stable nuclide is produced.
    composed_of:
    - nuclear_decay
    tier: 5
    source_domain: college_physics_ch31
  alpha_decay:
    defines: Nuclear decay in which a parent nucleus emits a helium-4 nucleus, reducing
      Z by 2 and A by 4.
    composed_of:
    - nuclear_decay
    - alpha_radiation
    tier: 5
    source_domain: college_physics_ch31
  beta_minus_decay:
    defines: Nuclear decay in which a neutron converts into a proton with emission
      of an electron and an antineutrino.
    composed_of:
    - nuclear_decay
    - beta_radiation
    - weak_nuclear_force
    - neutrino
    tier: 5
    source_domain: college_physics_ch31
  positron_decay:
    defines: Nuclear decay in which a proton converts into a neutron with emission
      of a positron and a neutrino.
    composed_of:
    - nuclear_decay
    - weak_nuclear_force
    - neutrino
    - antimatter
    tier: 5
    source_domain: college_physics_ch31
  electron_capture:
    defines: A nuclear decay process in which a nucleus absorbs an inner-shell electron,
      converting a proton to a neutron and emitting a neutrino.
    composed_of:
    - nuclear_decay
    - weak_nuclear_force
    - neutrino
    - electron
    tier: 5
    source_domain: college_physics_ch31
  gamma_decay:
    defines: Nuclear decay in which an excited nucleus emits a high-energy photon
      without changing Z or A.
    composed_of:
    - nuclear_decay
    - gamma_radiation
    tier: 5
    source_domain: college_physics_ch31
  nuclear_reaction_energy:
    defines: The energy released or absorbed in a nuclear decay, given by Q = (Δm)c².
    composed_of:
    - nuclear_decay
    - mass_energy_equivalence
    tier: 5
    source_domain: college_physics_ch31
  half_life:
    defines: The time interval during which a radioactive nucleus has a 50% probability
      of decaying.
    composed_of:
    - nuclear_decay
    tier: 5
    source_domain: college_physics_ch31
    also_in:
    - college_physics_ch32
  binding_energy_per_nucleon:
    defines: The binding energy divided by mass number (BE/A), averaging about 8 MeV
      and peaking near A ≈ 60.
    composed_of:
    - binding_energy
    - mass_number
    tier: 5
    source_domain: college_physics_ch31
    also_in:
    - college_physics_ch32
  decay_constant:
    defines: The quantity λ = 0.693/t½ that governs the rate of exponential radioactive
      decay.
    composed_of:
    - half_life
    tier: 6
    source_domain: college_physics_ch31
  exponential_decay_law:
    defines: The number of radioactive nuclei decreases as N = N₀e^(−λt).
    composed_of:
    - decay_constant
    tier: 7
    source_domain: college_physics_ch31
  activity:
    defines: The rate of radioactive decay in decays per unit time, expressed in becquerels
      or curies.
    composed_of:
    - exponential_decay_law
    tier: 8
    source_domain: college_physics_ch31
  tagging:
    defines: The process of attaching a radioactive nuclide to a chemical compound
      so that the compound can be tracked inside the body.
    composed_of:
    - radioactive_decay
    tier: 1
    source_domain: college_physics_ch32
  radiation_absorbed_dose:
    defines: A measure of ionizing energy deposited per kilogram of tissue, where
      1 rad equals 0.01 J/kg and 1 Gray equals 1 J/kg.
    composed_of:
    - ionizing_radiation
    tier: 1
    source_domain: college_physics_ch32
  free_radicals:
    defines: Unstable oxygen- or hydrogen-containing molecular fragments created by
      ionizing radiation that undergo rapid chemical reactions to produce radiolytic
      products capable of destroying cells.
    composed_of:
    - ionizing_radiation
    tier: 1
    source_domain: college_physics_ch32
  nuclear_fusion:
    defines: A reaction in which two light nuclei combine to form a larger nucleus,
      releasing energy because the product has greater binding energy per nucleon
      than the reactants.
    composed_of:
    - binding_energy_per_nucleon
    - coulomb_repulsion
    - quantum_tunneling
    - nuclear_force
    tier: 1
    source_domain: college_physics_ch32
  nuclear_fission:
    defines: A reaction in which a heavy nucleus splits into two or more lighter fission
      fragments, releasing energy because the products have greater binding energy
      per nucleon.
    composed_of:
    - binding_energy_per_nucleon
    - nuclear_force
    - coulomb_repulsion
    tier: 1
    source_domain: college_physics_ch32
  radiopharmaceutical:
    defines: A radioactive compound tagged to a chemical designed for specific medical
      purposes, used to image or treat organs and diseases.
    composed_of:
    - tagging
    tier: 2
    source_domain: college_physics_ch32
  relative_biological_effectiveness:
    defines: A factor that accounts for the varying biological damage caused by different
      types of ionizing radiation for the same absorbed dose, with short-range particles
      having higher RBE values.
    composed_of:
    - radiation_absorbed_dose
    tier: 2
    source_domain: college_physics_ch32
  chain_reaction:
    defines: A self-sustaining sequence of fission reactions in which neutrons produced
      by each fission induce further fissions, requiring on average more than one
      neutron per fission to sustain.
    composed_of:
    - nuclear_fission
    tier: 2
    source_domain: college_physics_ch32
  proton_proton_cycle:
    defines: The principal fusion reaction sequence in the Sun in which four protons
      are fused into a helium-4 nucleus, releasing 26.7 MeV of energy along with positrons,
      neutrinos, and gamma rays.
    composed_of:
    - nuclear_fusion
    tier: 2
    source_domain: college_physics_ch32
  magnetic_confinement:
    defines: A fusion confinement technique that uses strong magnetic fields, as in
      a tokamak, to trap charged plasma particles and sustain the high temperatures
      needed for fusion.
    composed_of:
    - nuclear_fusion
    tier: 2
    source_domain: college_physics_ch32
  inertial_confinement:
    defines: A fusion confinement technique that uses multiple high-power lasers to
      compress and heat tiny fuel pellets to extreme density and temperature before
      the fuel can expand.
    composed_of:
    - nuclear_fusion
    tier: 2
    source_domain: college_physics_ch32
  therapeutic_ratio:
    defines: The ratio of abnormal (cancer) cells killed to normal cells killed during
      radiotherapy, which radiotherapy techniques are designed to maximize.
    composed_of:
    - radiation_absorbed_dose
    tier: 2
    source_domain: college_physics_ch32
  food_irradiation:
    defines: The treatment of food with large doses of gamma rays, x-rays, or electrons
      to reduce pest infestation, delay spoilage, and prevent illness from microorganisms.
    composed_of:
    - free_radicals
    tier: 2
    source_domain: college_physics_ch32
  anger_camera:
    defines: A medical imaging device that uses a lead collimator and scintillation
      detectors to produce a two-dimensional image of gamma-ray-emitting radiopharmaceutical
      concentrations in the body.
    composed_of:
    - radiopharmaceutical
    - ionizing_radiation
    tier: 3
    source_domain: college_physics_ch32
  pet:
    defines: An imaging technique that detects pairs of 0.511-MeV gamma rays produced
      by positron-electron annihilation to accurately localize radiopharmaceuticals
      in the body.
    composed_of:
    - radiopharmaceutical
    - ionizing_radiation
    tier: 3
    source_domain: college_physics_ch32
  dose_equivalent:
    defines: The biologically effective radiation dose, defined as absorbed dose in
      rads multiplied by the RBE, with 1 Sv equal to 100 rem.
    composed_of:
    - radiation_absorbed_dose
    - relative_biological_effectiveness
    tier: 3
    source_domain: college_physics_ch32
  critical_mass:
    defines: The minimum amount of fissionable material needed to sustain a chain
      reaction, dependent on the nuclide's neutron production rate and fission probability.
    composed_of:
    - chain_reaction
    tier: 3
    source_domain: college_physics_ch32
  neutron_moderation:
    defines: The process of slowing fast fission-produced neutrons to thermal energies
      using a moderator such as water, enabling them to be efficiently absorbed by
      fissile fuel like U-235.
    composed_of:
    - chain_reaction
    tier: 3
    source_domain: college_physics_ch32
  radiotherapy:
    defines: The therapeutic use of ionizing radiation to treat cancer by exploiting
      the greater sensitivity of rapidly reproducing cancer cells to radiation damage.
    composed_of:
    - therapeutic_ratio
    tier: 3
    source_domain: college_physics_ch32
  breeding:
    defines: The production of fissile plutonium-239 from non-fissile uranium-238
      through neutron capture and subsequent beta decays in a nuclear reactor.
    composed_of:
    - chain_reaction
    - radioactive_decay
    tier: 3
    source_domain: college_physics_ch32
  spect:
    defines: A tomographic imaging technique that uses gamma-emitting radiopharmaceuticals
      and a circular detector array to construct three-dimensional images of radioactive
      concentration in the body.
    composed_of:
    - anger_camera
    tier: 4
    source_domain: college_physics_ch32
  linear_hypothesis:
    defines: The assumption that the risk of radiation-induced cancer or genetic defects
      is directly proportional to dose, even at low doses, implying no threshold for
      harm.
    composed_of:
    - dose_equivalent
    tier: 4
    source_domain: college_physics_ch32
  radiation_protection:
    defines: Methods to limit radiation exposure using three principles — shielding
      to absorb radiation, increasing distance from the source, and limiting exposure
      time.
    composed_of:
    - dose_equivalent
    tier: 4
    source_domain: college_physics_ch32
  virtual_particle:
    defines: A particle that cannot be directly observed but whose effects are observable,
      existing temporarily via the Heisenberg uncertainty principle.
    composed_of:
    - heisenberg_uncertainty_principle
    - conservation_of_mass_energy
    tier: 1
    source_domain: college_physics_ch33
  carrier_particle:
    defines: A virtual particle exchanged between other particles to transmit a fundamental
      force, as proposed by Yukawa.
    composed_of:
    - heisenberg_uncertainty_principle
    tier: 1
    source_domain: college_physics_ch33
  boson:
    defines: A particle with zero or integer intrinsic spin that does not obey the
      Pauli exclusion principle; all force carrier particles are bosons.
    composed_of:
    - intrinsic_spin
    - pauli_exclusion_principle
    tier: 1
    source_domain: college_physics_ch33
  fermion:
    defines: A particle with half-integer intrinsic spin that obeys the Pauli exclusion
      principle; all quarks and leptons are fermions.
    composed_of:
    - intrinsic_spin
    - pauli_exclusion_principle
    tier: 1
    source_domain: college_physics_ch33
  colliding_beams:
    defines: A technique where particle beams moving in opposite directions collide
      head-on, making all kinetic energy available for particle creation since total
      momentum is zero.
    composed_of:
    - conservation_of_momentum
    - conservation_of_mass_energy
    tier: 1
    source_domain: college_physics_ch33
  cyclotron:
    defines: A particle accelerator using fixed-frequency alternating electric fields
      and fixed magnets to accelerate particles in a circular spiral path of increasing
      radius.
    composed_of:
    - electromagnetic_force
    tier: 1
    source_domain: college_physics_ch33
  four_basic_forces:
    defines: 'The four distinct fundamental forces in nature: gravity, electromagnetic,
      weak nuclear, and strong nuclear, each carried by specific particles.'
    composed_of:
    - carrier_particle
    - electromagnetic_force
    tier: 2
    source_domain: college_physics_ch33
    also_in:
    - college_physics_ch34
  pion:
    defines: A meson exchanged between nucleons that carries the strong nuclear force,
      with mass approximately 100–140 MeV/c².
    composed_of:
    - carrier_particle
    - virtual_particle
    tier: 2
    source_domain: college_physics_ch33
  feynman_diagram:
    defines: A graph of time versus position that depicts the exchange of virtual
      particles between subatomic particles and is used to calculate interaction strengths
      and probabilities.
    composed_of:
    - virtual_particle
    - carrier_particle
    tier: 2
    source_domain: college_physics_ch33
  synchrotron:
    defines: A particle accelerator in which the frequency of alternating voltage
      and magnetic field strength increase as particles accelerate in fixed-radius
      orbits.
    composed_of:
    - cyclotron
    tier: 2
    source_domain: college_physics_ch33
  quark:
    defines: A fundamental fermion with fractional electric charge that combines in
      threes to form baryons or in quark-antiquark pairs to form mesons.
    composed_of:
    - fermion
    tier: 2
    source_domain: college_physics_ch33
  quantum_electrodynamics:
    defines: The quantum mechanical theory of electromagnetism describing electromagnetic
      interactions at the submicroscopic scale via virtual photon exchange.
    composed_of:
    - electromagnetic_force
    - virtual_particle
    - feynman_diagram
    tier: 3
    source_domain: college_physics_ch33
  hadron:
    defines: A particle that feels the strong nuclear force, composed of quarks, and
      subdivided into baryons and mesons.
    composed_of:
    - four_basic_forces
    tier: 3
    source_domain: college_physics_ch33
  lepton:
    defines: A fundamental particle that does not feel the strong nuclear force, organized
      into three families (electron, muon, tau) each with an associated neutrino.
    composed_of:
    - four_basic_forces
    - fermion
    tier: 3
    source_domain: college_physics_ch33
  synchrotron_radiation:
    defines: Radiation emitted when a magnetic field accelerates a charged particle
      perpendicular to its velocity.
    composed_of:
    - synchrotron
    - electromagnetic_force
    tier: 3
    source_domain: college_physics_ch33
  quark_flavor:
    defines: The six types of quarks—up, down, strange, charm, bottom, and top—organized
      into three families analogous to lepton families.
    composed_of:
    - quark
    tier: 3
    source_domain: college_physics_ch33
  quark_color:
    defines: A quantum number with three values (red, green, blue) that quarks carry,
      constrained so that observable hadrons are always color-neutral (white).
    composed_of:
    - quark
    tier: 3
    source_domain: college_physics_ch33
  baryon:
    defines: A hadron composed of three quarks that always decays to another baryon,
      carrying baryon number B = +1 for matter.
    composed_of:
    - hadron
    - quark
    tier: 4
    source_domain: college_physics_ch33
  meson:
    defines: A hadron composed of a quark-antiquark pair that can decay to leptons
      leaving no hadrons, with baryon number B = 0.
    composed_of:
    - hadron
    - quark
    - antimatter
    tier: 4
    source_domain: college_physics_ch33
  lepton_family_number:
    defines: Quantum numbers (electron, muon, tau family numbers) assigned to leptons
      that are conserved in most interactions, though violated by neutrino oscillations.
    composed_of:
    - lepton
    tier: 4
    source_domain: college_physics_ch33
  strangeness:
    defines: A quantum number conserved by the strong force but not the weak force,
      assigned to particles based on their decay systematics and related to strange
      quark content.
    composed_of:
    - quark_flavor
    - four_basic_forces
    tier: 4
    source_domain: college_physics_ch33
  gluon:
    defines: The massless, spin-1 carrier particle of the strong force between quarks,
      carrying color charge and existing in eight types.
    composed_of:
    - carrier_particle
    - quark_color
    tier: 4
    source_domain: college_physics_ch33
  quark_confinement:
    defines: The principle that quarks cannot be isolated or directly observed because
      the color force increases with separation, producing new particles instead of
      free quarks.
    composed_of:
    - quark
    - quark_color
    tier: 4
    source_domain: college_physics_ch33
  electroweak_theory:
    defines: The unified gauge theory showing that electromagnetic and weak forces
      are identical at sufficiently high energies, predicting the W+, W−, and Z⁰ carrier
      particles.
    composed_of:
    - quantum_electrodynamics
    - four_basic_forces
    tier: 4
    source_domain: college_physics_ch33
  baryon_number_conservation:
    defines: The law that total baryon number (B = +1 for baryons, B = −1 for antibaryons,
      B = 0 for mesons and leptons) is conserved in all observed interactions.
    composed_of:
    - baryon
    - antimatter
    tier: 5
    source_domain: college_physics_ch33
  quantum_chromodynamics:
    defines: The theory of the strong force describing quark interactions via gluon
      exchange, governed by the color quantum number.
    composed_of:
    - gluon
    - quark_color
    - quark
    tier: 5
    source_domain: college_physics_ch33
  standard_model:
    defines: The combination of quantum chromodynamics and electroweak theory that
      describes all known fundamental particles and three of the four forces.
    composed_of:
    - quantum_chromodynamics
    - electroweak_theory
    tier: 6
    source_domain: college_physics_ch33
  grand_unified_theory:
    defines: A theoretical framework proposing that the strong, weak, and electromagnetic
      forces unify into a single force at extremely high energies around 10¹⁴ GeV.
    composed_of:
    - standard_model
    tier: 7
    source_domain: college_physics_ch33
  higgs_boson:
    defines: A massive particle whose existence validates the mechanism by which carrier
      particles acquire mass, connecting to the unification of forces at high energies.
    composed_of:
    - standard_model
    - boson
    tier: 7
    source_domain: college_physics_ch33
  cosmology:
    defines: The study of the character and evolution of the universe on the largest
      scales.
    composed_of:
    - galaxy
    tier: 1
    source_domain: college_physics_ch34
  equivalence_principle:
    defines: The principle that the effects of acceleration and gravity are identical
      and indistinguishable without external reference.
    composed_of:
    - special_relativity
    tier: 1
    source_domain: college_physics_ch34
  dark_matter:
    defines: Non-luminous matter detected indirectly through its gravitational effects,
      constituting roughly ten times the mass of visible matter in galaxies.
    composed_of:
    - galaxy
    tier: 1
    source_domain: college_physics_ch34
  neutron_star:
    defines: A stellar remnant composed of neutrons, formed by core collapse in a
      supernova, stabilized by the strong force.
    composed_of:
    - four_basic_forces
    - quantum_mechanics
    tier: 1
    source_domain: college_physics_ch34
  neutrino_oscillations:
    defines: The spontaneous change of one neutrino flavor into another during propagation,
      possible only if neutrinos have nonzero mass.
    composed_of:
    - neutrino
    - quantum_mechanics
    tier: 1
    source_domain: college_physics_ch34
  superconductor:
    defines: A material that exhibits zero electrical resistivity when cooled below
      its critical temperature.
    composed_of:
    - resistivity
    - quantum_mechanics
    tier: 1
    source_domain: college_physics_ch34
  chaos:
    defines: The study of deterministic systems whose outcomes are extremely sensitive
      to initial conditions, making long-term prediction impossible.
    composed_of:
    - four_basic_forces
    tier: 1
    source_domain: college_physics_ch34
  cosmological_red_shift:
    defines: The stretching of photon wavelengths due to the expansion of space itself,
      proportional to distance.
    composed_of:
    - doppler_effect
    - cosmology
    tier: 2
    source_domain: college_physics_ch34
  general_relativity:
    defines: Einstein's theory describing all types of relative motion including accelerated
      frames and gravity, encompassing special relativity.
    composed_of:
    - equivalence_principle
    tier: 2
    source_domain: college_physics_ch34
  critical_temperature:
    defines: The temperature at and below which a material transitions to the superconducting
      state with zero resistivity.
    composed_of:
    - superconductor
    tier: 2
    source_domain: college_physics_ch34
  complexity:
    defines: An emerging field studying complex adaptive systems that self-organize,
      adapt, and evolve, seeking common patterns across disciplines.
    composed_of:
    - chaos
    tier: 2
    source_domain: college_physics_ch34
  wimps:
    defines: Weakly interacting massive particles — hypothetical chargeless leptons
      proposed as dark matter candidates interacting only via gravity and the weak
      force.
    composed_of:
    - dark_matter
    - neutrino
    tier: 2
    source_domain: college_physics_ch34
  hubble_constant:
    defines: The proportionality constant H₀ relating a galaxy's recession velocity
      to its distance, from velocity-versus-distance graphs.
    composed_of:
    - cosmological_red_shift
    tier: 3
    source_domain: college_physics_ch34
  gravitational_lensing:
    defines: The bending of light by massive objects acting like a converging lens,
      as predicted by general relativity.
    composed_of:
    - general_relativity
    tier: 3
    source_domain: college_physics_ch34
  black_hole:
    defines: An object with a gravitational field so strong that nothing, not even
      light, can escape from within its event horizon.
    composed_of:
    - general_relativity
    - escape_velocity
    tier: 3
    source_domain: college_physics_ch34
  gravitational_waves:
    defines: Mass-created distortions in space that propagate at the speed of light,
      predicted by general relativity.
    composed_of:
    - general_relativity
    tier: 3
    source_domain: college_physics_ch34
  quantum_gravity:
    defines: The incomplete theoretical framework unifying general relativity and
      quantum mechanics, treating gravity via graviton exchange.
    composed_of:
    - general_relativity
    - quantum_mechanics
    tier: 3
    source_domain: college_physics_ch34
  cosmological_constant:
    defines: A term in general relativity that can counteract gravitational attraction,
      now associated with dark energy driving accelerating expansion.
    composed_of:
    - general_relativity
    tier: 3
    source_domain: college_physics_ch34
  high_temperature_superconductor:
    defines: A ceramic superconductor with critical temperature above 77 K, enabling
      cooling with liquid nitrogen rather than helium.
    composed_of:
    - critical_temperature
    tier: 3
    source_domain: college_physics_ch34
  big_bang:
    defines: The primordial explosion approximately 13-15 billion years ago from which
      all matter and energy originated.
    composed_of:
    - hubble_constant
    tier: 4
    source_domain: college_physics_ch34
  event_horizon:
    defines: The boundary around a black hole at which the escape velocity equals
      the speed of light; the point of no return.
    composed_of:
    - black_hole
    tier: 4
    source_domain: college_physics_ch34
  hawking_radiation:
    defines: Energy radiated by black holes through quantum particle-antiparticle
      pair creation near the event horizon, causing slow shrinkage.
    composed_of:
    - black_hole
    - quantum_mechanics
    tier: 4
    source_domain: college_physics_ch34
  superstring_theory:
    defines: A theory proposing fundamental particles are one-dimensional vibrating
      strings, attempting to unify all four forces as a Theory of Everything.
    composed_of:
    - quantum_gravity
    - four_basic_forces
    tier: 4
    source_domain: college_physics_ch34
  critical_density:
    defines: The average density of matter needed to just halt the expansion of the
      universe without a cosmological constant.
    composed_of:
    - hubble_constant
    - general_relativity
    tier: 4
    source_domain: college_physics_ch34
  microlensing:
    defines: Gravitational focusing of a distant star's light by a small massive body,
      causing characteristic temporary brightening.
    composed_of:
    - gravitational_lensing
    tier: 4
    source_domain: college_physics_ch34
  cosmic_microwave_background:
    defines: The nearly uniform blackbody radiation at 2.725 K permeating all space,
      the cooled remnant of the Big Bang fireball.
    composed_of:
    - big_bang
    - blackbody_radiation
    tier: 5
    source_domain: college_physics_ch34
  matter_antimatter_asymmetry:
    defines: The observed dominance of matter over antimatter, caused by asymmetry
      in fundamental force interactions during the Big Bang.
    composed_of:
    - big_bang
    - four_basic_forces
    tier: 5
    source_domain: college_physics_ch34
  spontaneous_symmetry_breaking:
    defines: The phase-transition process during which unified forces became distinct
      as the universe cooled after the Big Bang.
    composed_of:
    - four_basic_forces
    - big_bang
    tier: 5
    source_domain: college_physics_ch34
  schwarzschild_radius:
    defines: The radius of the event horizon given by R_s = 2GM/c², defining the size
      of a black hole.
    composed_of:
    - event_horizon
    tier: 5
    source_domain: college_physics_ch34
  universe_curvature:
    defines: 'The geometry of the universe determined by its mass-energy content:
      open, closed, or flat.'
    composed_of:
    - critical_density
    tier: 5
    source_domain: college_physics_ch34
  machos:
    defines: Massive compact halo objects — dim bodies such as brown dwarfs proposed
      as dark matter candidates detectable via microlensing.
    composed_of:
    - dark_matter
    - microlensing
    tier: 5
    source_domain: college_physics_ch34
  inflationary_scenario:
    defines: The rapid exponential expansion of the universe by 10⁵⁰ between 10⁻³⁵
      and 10⁻³² s after the Big Bang, explaining CMBR smoothness.
    composed_of:
    - cosmic_microwave_background
    tier: 6
    source_domain: college_physics_ch34
  electroweak_epoch:
    defines: The era when electromagnetic and weak forces were unified at energies
      above about 100 GeV.
    composed_of:
    - spontaneous_symmetry_breaking
    tier: 6
    source_domain: college_physics_ch34
  gut_epoch:
    defines: The era when all forces except gravity were unified under Grand Unification
      Theory.
    composed_of:
    - electroweak_epoch
    tier: 7
    source_domain: college_physics_ch34
  toe_epoch:
    defines: The era when all four forces were hypothetically unified as a single
      superforce in a Theory of Everything.
    composed_of:
    - gut_epoch
    - quantum_gravity
    tier: 8
    source_domain: college_physics_ch34
applications:
  approximation:
    defines: An estimated value for an unknown quantity derived by applying known
      measurements, unit reasoning, and order-of-magnitude thinking when exact values
      are unavailable.
    needs:
    - order_of_magnitude
    - units
    tier: 3
    source_domain: college_physics_ch01
  graphical_analysis_of_motion:
    defines: The technique of extracting velocity from the slope of a position–time
      graph and acceleration from the slope of a velocity–time graph to describe and
      predict one-dimensional motion.
    needs:
    - average_velocity
    - average_acceleration
    tier: 4
    source_domain: college_physics_ch02
  problem_solving_kinematics:
    defines: A six-step systematic approach—identify principles, list knowns, identify
      unknowns, select equations, substitute with units, and verify reasonableness—applied
      to one-dimensional motion problems.
    needs:
    - kinematic_equations_constant_acceleration
    tier: 5
    source_domain: college_physics_ch02
  falling_objects_calculation:
    defines: The application of constant-acceleration kinematic equations with a =
      ±g to compute position, velocity, and time for objects in free fall near Earth's
      surface.
    needs:
    - free_fall
    tier: 6
    source_domain: college_physics_ch02
  river_crossing_relative_velocity:
    defines: A real-world scenario in which a boat or swimmer crossing a flowing river
      illustrates how the velocity relative to the ground equals the vector sum of
      the vessel's velocity relative to the water and the current's velocity relative
      to the ground.
    needs:
    - relative_velocity
    - velocity_addition
    tier: 5
    source_domain: college_physics_ch03
  projectile_motion_applications:
    defines: Real-world scenarios—including fireworks shells, volcanic ejecta, and
      sports projectiles—in which the range, maximum height, and impact velocity are
      predicted by resolving launch velocity into independent horizontal and vertical
      components.
    needs:
    - trajectory
    - projectile_range
    - projectile_maximum_height
    tier: 5
    source_domain: college_physics_ch03
  four_basic_forces:
    defines: The four fundamental forces in nature — gravitational, electromagnetic,
      weak nuclear, and strong nuclear — from which all other observed forces arise.
    needs:
    - force
    tier: 1
    source_domain: college_physics_ch04
  force_field:
    defines: A region surrounding an object that creates a force, characterized by
      the source object independently of any test particle placed in it.
    needs:
    - force
    tier: 1
    source_domain: college_physics_ch04
  newton_problem_solving_strategy:
    defines: A systematic four-step procedure — sketch, identify system and draw free-body
      diagram, apply Newton's second law, check reasonableness — for solving force
      and motion problems.
    needs:
    - free_body_diagram
    - newtons_first_law
    - newtons_second_law
    - newtons_third_law
    tier: 4
    source_domain: college_physics_ch04
  joint_lubrication:
    defines: The reduction of kinetic friction in biological joints through synovial
      fluid and cartilage, resulting in coefficients of friction far lower than most
      engineered surfaces.
    needs:
    - kinetic_friction
    tier: 3
    source_domain: college_physics_ch05
  aerodynamic_drag_reduction:
    defines: The engineering and design practice of minimizing drag force by shaping
      objects (cars, athletes, aircraft) to reduce drag coefficient and frontal area.
    needs:
    - drag_force
    - drag_coefficient
    tier: 2
    source_domain: college_physics_ch05
  skydiver_terminal_velocity:
    defines: The application of drag force and Newton's second law to calculate the
      maximum falling speed of a skydiver, showing how body orientation and mass affect
      terminal velocity.
    needs:
    - terminal_velocity
    - drag_force
    tier: 3
    source_domain: college_physics_ch05
  elasticity_in_biological_structures:
    defines: The application of stress, strain, and elastic moduli to analyze deformation
      in bones, tendons, arteries, and other tissues under physiological loads.
    needs:
    - tension_compression_deformation
    - shear_deformation
    - bulk_compression
    tier: 4
    source_domain: college_physics_ch05
  tides:
    defines: The periodic rise and fall of sea levels caused by the differential gravitational
      pull of the Moon (and Sun) across Earth's diameter.
    needs:
    - newtons_law_of_gravitation
    - center_of_mass
    tier: 3
    source_domain: college_physics_ch06
  coriolis_weather_patterns:
    defines: The deflection of large-scale wind flows by Earth's rotation, causing
      counterclockwise rotation of low-pressure systems in the northern hemisphere
      and clockwise in the southern.
    needs:
    - coriolis_force
    tier: 5
    source_domain: college_physics_ch06
  centrifuge:
    defines: A device that spins samples at high angular velocity to produce large
      centripetal accelerations, separating materials of different densities far faster
      than gravity alone.
    needs:
    - centripetal_acceleration
    - angular_velocity
    tier: 6
    source_domain: college_physics_ch06
  ideal_banking:
    defines: The road slope angle θ at which a vehicle can navigate a curve at a given
      speed without friction, given by tan θ = v²/(rg).
    needs:
    - centripetal_force
    - normal_force
    - acceleration_due_to_gravity
    tier: 7
    source_domain: college_physics_ch06
  satellite_orbits:
    defines: Gravitationally bound circular or elliptical paths of a small mass around
      a much larger parent body, where gravity provides the centripetal force.
    needs:
    - newtons_law_of_gravitation
    - centripetal_force
    tier: 7
    source_domain: college_physics_ch06
  useful_work_in_humans:
    defines: Work done by a person on the external world—such as lifting objects or
      climbing stairs—as distinct from internal work such as circulating blood, equal
      to force exerted on the environment times displacement.
    needs:
    - work
    tier: 2
    source_domain: college_physics_ch07
  friction:
    defines: A nonconservative contact force between surfaces that converts mechanical
      energy into thermal energy, with the amount of energy dissipated depending on
      the length of the path traveled.
    needs:
    - nonconservative_force
    - thermal_energy
    tier: 7
    source_domain: college_physics_ch07
  metabolic_rate:
    defines: The rate at which the human body converts chemical energy stored in food
      into work, thermal energy, and other forms to sustain life and perform activities,
      measurable via oxygen consumption.
    needs:
    - power
    tier: 3
    source_domain: college_physics_ch07
  energy_cost_calculation:
    defines: The monetary cost of operating an electrical device, calculated as the
      product of its power consumption and time of use expressed in kilowatt-hours
      and multiplied by the utility rate per kilowatt-hour.
    needs:
    - power
    tier: 3
    source_domain: college_physics_ch07
  basal_metabolic_rate:
    defines: The total energy conversion rate of a person at complete rest, representing
      the power required to sustain all basic physiological functions and accounting
      for roughly 75% of daily caloric use.
    needs:
    - metabolic_rate
    tier: 4
    source_domain: college_physics_ch07
  renewable_energy_sources:
    defines: Energy sources such as solar, wind, water, and biomass that are naturally
      replenished and cannot be permanently depleted, contrasted with finite fossil
      fuels.
    needs:
    - law_of_conservation_of_energy
    tier: 8
    source_domain: college_physics_ch07
  nonrenewable_energy_sources:
    defines: Finite energy stores—oil, natural gas, and coal—formed over geological
      time whose combustion releases chemical energy but produces carbon dioxide and
      depletes a fixed resource base.
    needs:
    - law_of_conservation_of_energy
    tier: 8
    source_domain: college_physics_ch07
  recoil:
    defines: The backward momentum acquired by an object or system in reaction to
      expelling mass or exerting a force, a direct consequence of conservation of
      momentum.
    needs:
    - conservation_of_momentum
    tier: 3
    source_domain: college_physics_ch08
  rocket_propulsion:
    defines: The real-world application of Newton's third law and conservation of
      momentum in which a rocket accelerates by expelling exhaust mass at high velocity.
    needs:
    - newtons_third_law
    - conservation_of_momentum
    - rocket_acceleration
    tier: 3
    source_domain: college_physics_ch08
  free_body_diagram:
    defines: A diagram isolating a system and representing all external forces acting
      on it with labeled arrows, used as a problem-solving tool in static equilibrium
      analysis.
    needs:
    - force
    - equilibrium
    tier: 5
    source_domain: college_physics_ch09
  statics:
    defines: The branch of mechanics that studies forces acting on systems in equilibrium,
      where both linear and rotational accelerations are zero.
    needs:
    - first_condition_equilibrium
    - second_condition_equilibrium
    tier: 6
    source_domain: college_physics_ch09
  posture_back_strain:
    defines: The application of static equilibrium principles to show how misalignment
      of the body's center of gravity over the hip pivot creates large torques that
      back muscles must counteract.
    needs:
    - center_of_gravity
    - torque
    - static_equilibrium
    - pivot_point
    tier: 6
    source_domain: college_physics_ch09
  muscles_joints_statics:
    defines: The application of torque and equilibrium analysis to biological lever
      systems in the body, explaining why internal muscle forces are much larger than
      external limb forces.
    needs:
    - torque
    - equilibrium
    - lever
    - statics
    tier: 7
    source_domain: college_physics_ch09
  rolling_without_slipping:
    defines: Motion in which an object rolls such that its translational velocity
      equals the product of its angular velocity and radius (v = rω), with total kinetic
      energy split between translational and rotational contributions.
    needs:
    - linear_velocity
    - angular_velocity
    - rotational_kinetic_energy
    - translational_kinetic_energy
    tier: 3
    source_domain: college_physics_ch10
  collisions_of_extended_bodies:
    defines: Collisions in which angular momentum is conserved (when net external
      torque is zero) even as kinetic energy may be lost, applied to rotating objects
      that collide and stick or interact at a pivot point.
    needs:
    - conservation_of_angular_momentum
    - moment_of_inertia
    tier: 5
    source_domain: college_physics_ch10
  gyroscopic_precession:
    defines: The slow rotation of a gyroscope's spin axis around a second axis, caused
      by an applied torque perpendicular to the angular momentum, changing the direction
      of L without changing its magnitude.
    needs:
    - torque
    - angular_momentum
    - right_hand_rule
    tier: 4
    source_domain: college_physics_ch10
  hydraulic_system:
    defines: An enclosed fluid system that transmits and multiplies forces using Pascal's
      principle, where F₁/A₁ = F₂/A₂.
    needs:
    - pascals_principle
    tier: 3
    source_domain: college_physics_ch11
  barometer:
    defines: A device that measures atmospheric pressure using a column of mercury
      with a vacuum above it.
    needs:
    - atmospheric_pressure
    - pressure_depth_relation
    tier: 3
    source_domain: college_physics_ch11
  manometer:
    defines: A U-shaped tube device that measures gauge pressure by the height difference
      of fluid columns.
    needs:
    - gauge_pressure
    - pressure_depth_relation
    tier: 4
    source_domain: college_physics_ch11
  body_pressures:
    defines: Gauge pressures in body systems—eyes (intraocular), lungs, spinal fluid,
      bladder, and skeleton—that serve as medical indicators.
    needs:
    - gauge_pressure
    tier: 4
    source_domain: college_physics_ch11
  blood_pressure_measurement:
    defines: The measurement of systolic (maximum) and diastolic (minimum) arterial
      pressures using a cuff and manometer, reported relative to atmospheric pressure.
    needs:
    - manometer
    tier: 5
    source_domain: college_physics_ch11
  entrainment:
    defines: The process of using reduced pressure in a high-velocity fluid stream
      to draw other fluids into the flow, applied in devices like Bunsen burners and
      atomizers.
    needs:
    - bernoullis_principle
    tier: 4
    source_domain: college_physics_ch12
  aerodynamic_lift:
    defines: The net upward force on a wing created by faster airflow over the longer
      upper surface reducing pressure relative to the lower surface, as described
      by Bernoulli's principle.
    needs:
    - bernoullis_principle
    tier: 4
    source_domain: college_physics_ch12
  pitot_tube:
    defines: A velocity-measuring device that uses Bernoulli's principle to relate
      the pressure difference between a dead spot and a flowing region to fluid speed.
    needs:
    - bernoullis_principle
    tier: 4
    source_domain: college_physics_ch12
  blood_flow_regulation:
    defines: The cardiovascular system's control of blood flow by varying vessel radii,
      exploiting Poiseuille's law's fourth-power dependence on radius to achieve large
      changes in flow with small changes in vessel size.
    needs:
    - poiseuilles_law
    tier: 4
    source_domain: college_physics_ch12
  reverse_osmosis:
    defines: A process in which sufficient back pressure reverses osmosis, used in
      applications such as desalination by forcing water through a membrane that blocks
      salt.
    needs:
    - osmotic_pressure
    tier: 5
    source_domain: college_physics_ch12
  thermometer:
    defines: A device that measures temperature by exploiting a physical property—such
      as thermal expansion—that varies reproducibly with temperature.
    needs:
    - temperature
    - thermal_expansion
    tier: 3
    source_domain: college_physics_ch13
  expansion_joints:
    defines: Gaps engineered into structures such as bridges and railroad tracks to
      accommodate dimensional changes from thermal expansion without buckling.
    needs:
    - linear_thermal_expansion
    - thermal_stress
    tier: 4
    source_domain: college_physics_ch13
  pressure_cooker:
    defines: A sealed cooking vessel that raises the boiling point of water by increasing
      pressure, thereby cooking food faster.
    needs:
    - boiling
    tier: 6
    source_domain: college_physics_ch13
  freeze_drying:
    defines: A preservation process that removes water from materials by lowering
      pressure so that ice sublimates directly to vapor.
    needs:
    - sublimation
    tier: 6
    source_domain: college_physics_ch13
  wind_chill:
    defines: The enhanced cooling effect of moving air combining convection with conduction
      to increase the rate of heat transfer from a body.
    needs:
    - convection
    - conduction
    tier: 3
    source_domain: college_physics_ch14
  calorimetry:
    defines: The technique of calculating final equilibrium temperatures when two
      bodies at different temperatures exchange heat with no net loss to surroundings.
    needs:
    - thermal_equilibrium
    - heat_capacity_equation
    tier: 4
    source_domain: college_physics_ch14
  greenhouse_effect:
    defines: The warming of Earth's surface caused by atmospheric gases absorbing
      and re-radiating infrared radiation emitted by the Earth.
    needs:
    - radiation
    - emissivity
    tier: 4
    source_domain: college_physics_ch14
    also_in:
    - college_physics_ch24
  evaporative_cooling:
    defines: The cooling of a surface when liquid evaporates from it, removing latent
      heat of vaporization and lowering temperature.
    needs:
    - latent_heat_of_vaporization
    tier: 5
    source_domain: college_physics_ch14
  human_metabolism:
    defines: The conversion of food's chemical potential energy into heat transfer,
      work, and stored fat, governed by the first law of thermodynamics.
    needs:
    - first_law_of_thermodynamics
    tier: 3
    source_domain: college_physics_ch15
  otto_cycle:
    defines: A thermodynamic cycle consisting of two adiabatic and two isochoric processes,
      modeling the four-stroke internal combustion gasoline engine.
    needs:
    - adiabatic_process
    - isochoric_process
    - heat_engine
    tier: 5
    source_domain: college_physics_ch15
  power_station_efficiency:
    defines: The application of heat engine principles to calculate the work output,
      efficiency, and environmental impact of coal-fired and nuclear power plants.
    needs:
    - thermodynamic_efficiency
    - carnot_efficiency
    tier: 7
    source_domain: college_physics_ch15
  heat_death_of_universe:
    defines: The predicted ultimate state of thermodynamic equilibrium in which the
      universe reaches maximum entropy and no energy remains available to do work.
    needs:
    - entropy
    tier: 7
    source_domain: college_physics_ch15
  medical_ultrasound:
    defines: Application of high-frequency oscillations to produce ultrasound waves
      used for noninvasive medical imaging.
    needs:
    - frequency
    - wave_intensity
    - longitudinal_wave
    tier: 4
    source_domain: college_physics_ch16
  earthquake_wave_detection:
    defines: Application of wave propagation speeds and interference patterns to locate
      earthquake epicenters and study geological structures.
    needs:
    - wave_velocity
    - transverse_wave
    - longitudinal_wave
    - superposition
    tier: 4
    source_domain: college_physics_ch16
  pendulum_clock:
    defines: Application of the simple pendulum's constant period to keep accurate
      time by adjusting pendulum length.
    needs:
    - simple_pendulum
    tier: 5
    source_domain: college_physics_ch16
  car_suspension:
    defines: Application of damped harmonic motion where shock absorbers provide critical
      damping to prevent prolonged oscillation after hitting a bump.
    needs:
    - critical_damping
    - force_constant
    tier: 6
    source_domain: college_physics_ch16
  musical_instrument_resonance:
    defines: Application of standing waves and harmonics on strings and in tubes to
      produce musical tones at specific frequencies.
    needs:
    - fundamental_frequency_and_harmonics
    - resonance
    tier: 7
    source_domain: college_physics_ch16
    also_in:
    - college_physics_ch17
  noise_cancellation:
    defines: Using destructive interference to reduce sound intensity by generating
      a wave opposite in phase to incoming noise.
    needs:
    - interference
    tier: 3
    source_domain: college_physics_ch17
  ultrasound_therapy:
    defines: Using high-intensity focused ultrasound to shatter gallstones, destroy
      tissue, or deliver deep-heat treatments via cavitation and thermal effects.
    needs:
    - ultrasound
    - sound_intensity
    tier: 4
    source_domain: college_physics_ch17
  doppler_shifted_ultrasound:
    defines: A diagnostic technique using the Doppler shift of reflected ultrasound
      to detect motion and measure velocity, such as blood flow.
    needs:
    - doppler_effect
    - ultrasound
    tier: 4
    source_domain: college_physics_ch17
  ultrasound_medical_imaging:
    defines: Using reflected ultrasound echoes and acoustic impedance differences
      to produce noninvasive images of internal body structures.
    needs:
    - ultrasound
    - intensity_reflection_coefficient
    tier: 5
    source_domain: college_physics_ch17
  faraday_cage:
    defines: A metal enclosure that shields its interior from external electric fields
      by confining all charge to its outer surface, producing zero field inside.
    needs:
    - electrostatic_equilibrium
    tier: 4
    source_domain: college_physics_ch18
  lightning_rod:
    defines: A sharply pointed conductor mounted on a building that continuously bleeds
      away induced charge, preventing destructive lightning strikes.
    needs:
    - electrostatic_equilibrium
    - charging_by_induction
    tier: 4
    source_domain: college_physics_ch18
  van_de_graaff_generator:
    defines: A device using a moving insulating belt, pointed and smooth conductors
      to accumulate large static charges on a hollow sphere, producing high voltages
      for research.
    needs:
    - conductor
    - insulator
    - charging_by_contact
    tier: 3
    source_domain: college_physics_ch18
  xerography:
    defines: A dry electrostatic copying process that uses a photoconducting drum
      to form a charge image, attracts oppositely charged toner, and transfers it
      to paper.
    needs:
    - conductor
    - insulator
    - electric_field
    tier: 3
    source_domain: college_physics_ch18
  electrostatic_precipitator:
    defines: An air-cleaning device that places excess charge on airborne particles
      and then passes them through an oppositely charged grid to remove them from
      the airstream.
    needs:
    - charging_by_contact
    - electric_field
    tier: 3
    source_domain: college_physics_ch18
  defibrillator:
    defines: A medical device that stores energy in a capacitor and delivers a controlled
      electrical shock to restore normal heart rhythm.
    needs:
    - energy_stored_in_capacitors
    tier: 6
    source_domain: college_physics_ch19
  thermal_hazard:
    defines: An electrical safety hazard in which excessive power dissipation produces
      unwanted heat, potentially igniting surrounding materials.
    needs:
    - electric_power
    tier: 3
    source_domain: college_physics_ch20
  shock_hazard:
    defines: An electrical safety hazard in which current passes through the human
      body, with severity determined by the magnitude of current, its path, duration,
      and AC frequency.
    needs:
    - electric_current
    - alternating_current
    tier: 3
    source_domain: college_physics_ch20
  electrocardiogram:
    defines: A recording of the voltage signals produced by the wave of depolarization
      and repolarization spreading across the heart, used to assess cardiac function.
    needs:
    - action_potential
    tier: 3
    source_domain: college_physics_ch20
  high_voltage_power_transmission:
    defines: The practice of transmitting electrical power at high voltages to minimize
      resistive losses in transmission lines, enabled by the ease of transforming
      AC voltages.
    needs:
    - alternating_current
    - electric_power
    - resistance
    tier: 3
    source_domain: college_physics_ch20
  fuses_and_circuit_breakers:
    defines: Safety devices that automatically interrupt a circuit when sustained
      current exceeds a safe limit, protecting against thermal hazards from overloaded
      wires.
    needs:
    - electric_current
    - thermal_hazard
    tier: 4
    source_domain: college_physics_ch20
  voltmeter:
    defines: An instrument that measures voltage by connecting in parallel with the
      circuit element; constructed from a galvanometer in series with a large multiplier
      resistance to limit current draw.
    needs:
    - galvanometer
    - ohms_law
    tier: 2
    source_domain: college_physics_ch21
  ammeter:
    defines: An instrument that measures current by connecting in series with a branch;
      constructed from a galvanometer in parallel with a small shunt resistance so
      most current bypasses the galvanometer.
    needs:
    - galvanometer
    - ohms_law
    tier: 2
    source_domain: college_physics_ch21
  potentiometer:
    defines: A null measurement device that determines an unknown EMF by adjusting
      a voltage divider until a galvanometer reads zero, then comparing resistances
      with a known standard EMF.
    needs:
    - null_measurement
    - electromotive_force
    tier: 4
    source_domain: college_physics_ch21
  wheatstone_bridge:
    defines: A null measurement device that determines an unknown resistance by balancing
      a four-resistor bridge until no current flows through a galvanometer, using
      the relation R_x = R_3(R_2/R_1).
    needs:
    - null_measurement
    - resistance
    tier: 4
    source_domain: college_physics_ch21
  rc_timing_applications:
    defines: Real-world use of the RC time constant to control time intervals in devices
      such as intermittent wipers, strobe lights, heart pacemakers, and defibrillators.
    needs:
    - capacitor_charging
    - capacitor_discharging
    tier: 5
    source_domain: college_physics_ch21
  velocity_selector:
    defines: A device using crossed electric and magnetic fields to pass only particles
      for which the electric force qE exactly balances the magnetic force qvB, giving
      v = E/B.
    needs:
    - lorentz_force
    - electric_field
    tier: 3
    source_domain: college_physics_ch22
  cathode_ray_tube:
    defines: A device that accelerates electrons in an electron gun and steers them
      with magnetic (or electric) fields onto a phosphor screen to form images.
    needs:
    - lorentz_force
    - electric_field
    tier: 3
    source_domain: college_physics_ch22
  magnetohydrodynamic_drive:
    defines: A pump or propulsion system that drives electrically conducting fluid
      by passing current through it perpendicular to an applied magnetic field, producing
      a force with no moving mechanical parts.
    needs:
    - magnetic_force_on_current
    tier: 4
    source_domain: college_physics_ch22
  aurora:
    defines: Luminous atmospheric displays caused by cosmic-ray charged particles
      spiraling along Earth's magnetic field lines into the polar atmosphere, ionizing
      air molecules.
    needs:
    - circular_motion_in_magnetic_field
    tier: 4
    source_domain: college_physics_ch22
  mass_spectrometer:
    defines: An instrument that uses a velocity selector and a uniform magnetic field
      to separate ions by mass-to-charge ratio, measured from the radius of their
      circular paths r = mv/(qB).
    needs:
    - velocity_selector
    - radius_of_curvature
    tier: 5
    source_domain: college_physics_ch22
  electric_motor:
    defines: A device that converts electrical energy to mechanical work by using
      the magnetic torque on current-carrying loops rotating in a magnetic field,
      with brushes reversing current each half turn to sustain rotation.
    needs:
    - torque_on_current_loop
    tier: 5
    source_domain: college_physics_ch22
  galvanometer:
    defines: An instrument that measures current by balancing the magnetic torque
      on a current loop against a spring, producing a needle deflection proportional
      to current.
    needs:
    - torque_on_current_loop
    tier: 5
    source_domain: college_physics_ch22
  hall_probe:
    defines: A small calibrated device that measures magnetic field strength by measuring
      the Hall emf produced when a known current passes through a conductor placed
      in the field.
    needs:
    - hall_emf
    tier: 5
    source_domain: college_physics_ch22
  van_allen_radiation_belts:
    defines: Two toroidal regions above Earth's atmosphere where energetic charged
      particles are trapped in spiral orbits along Earth's magnetic field lines.
    needs:
    - circular_motion_in_magnetic_field
    - magnetic_mirror
    tier: 5
    source_domain: college_physics_ch22
  magnetic_resonance_imaging:
    defines: A medical imaging technique based on nuclear magnetic resonance, in which
      hydrogen nuclei in a strong external field absorb and reemit specific radio
      frequencies that encode position and tissue type.
    needs:
    - solenoid
    tier: 6
    source_domain: college_physics_ch22
  transformer:
    defines: A device using mutual induction between primary and secondary coils on
      a shared iron core to transform AC voltages according to V_s/V_p = N_s/N_p,
      with corresponding inverse change in current.
    needs:
    - mutual_inductance
    tier: 5
    source_domain: college_physics_ch23
  electrical_safety_devices:
    defines: Systems such as the three-wire grounding scheme, ground fault interrupter
      (GFI), and isolation transformer that use electromagnetic induction to detect
      leakage currents and prevent shock hazards.
    needs:
    - electromagnetic_induction
    - mutual_inductance
    tier: 5
    source_domain: college_physics_ch23
  rlc_series_circuit:
    defines: A circuit combining resistance, inductance, and capacitance in series
      with an AC source, exhibiting frequency-dependent impedance, resonance, and
      power-factor effects with applications including radio tuning.
    needs:
    - impedance
    - resonant_frequency
    - power_factor
    tier: 9
    source_domain: college_physics_ch23
  radio_waves:
    defines: The lowest-frequency band of the electromagnetic spectrum, produced by
      currents in wires and circuits, spanning from a few Hz to about 1 GHz and used
      for AM/FM radio, TV, and communications.
    needs:
    - electromagnetic_spectrum
    tier: 5
    source_domain: college_physics_ch24
  microwaves:
    defines: Electromagnetic waves with wavelengths from about 1 mm to 1 m (frequencies
      ~1–300 GHz) produced by macroscopic circuits or thermal agitation, used in communications,
      radar, and heating.
    needs:
    - electromagnetic_spectrum
    tier: 5
    source_domain: college_physics_ch24
  infrared_radiation:
    defines: Electromagnetic radiation just below visible red light in frequency,
      primarily produced by thermal agitation and molecular vibrations, perceived
      as radiant heat.
    needs:
    - electromagnetic_spectrum
    tier: 5
    source_domain: college_physics_ch24
  visible_light:
    defines: The narrow band of the electromagnetic spectrum (roughly 400–750 nm)
      detectable by the human eye, produced by electronic transitions in atoms and
      molecules.
    needs:
    - electromagnetic_spectrum
    tier: 5
    source_domain: college_physics_ch24
  ultraviolet_radiation:
    defines: Electromagnetic radiation with wavelengths from about 10 to 400 nm, above
      visible violet in frequency, produced by electronic transitions and capable
      of ionizing biological molecules.
    needs:
    - electromagnetic_spectrum
    tier: 5
    source_domain: college_physics_ch24
  x_rays:
    defines: Very high-frequency electromagnetic radiation (wavelengths below ~10
      nm) generated by inner-shell electron transitions or deceleration of fast electrons
      in matter, used for imaging and cancer therapy.
    needs:
    - electromagnetic_spectrum
    tier: 5
    source_domain: college_physics_ch24
  gamma_rays:
    defines: The highest-frequency electromagnetic radiation, emitted by atomic nuclei
      during radioactive decay or induced nuclear processes, with properties identical
      to X-rays of the same frequency.
    needs:
    - electromagnetic_spectrum
    tier: 5
    source_domain: college_physics_ch24
  amplitude_modulation:
    defines: A method of encoding audio information on a radio carrier wave by varying
      the carrier's amplitude while keeping its frequency constant.
    needs:
    - radio_waves
    tier: 6
    source_domain: college_physics_ch24
  frequency_modulation:
    defines: A method of encoding audio information on a radio carrier wave by varying
      the carrier's frequency while keeping its amplitude constant, making it more
      resistant to noise than AM.
    needs:
    - radio_waves
    - wave_frequency_wavelength
    tier: 6
    source_domain: college_physics_ch24
  radar:
    defines: An application of microwaves in which timed echoes of transmitted pulses
      are used to determine the distance, shape, or speed of remote objects.
    needs:
    - microwaves
    tier: 6
    source_domain: college_physics_ch24
  dielectric_heating:
    defines: A heating mechanism in which polar molecules in food absorb microwave
      energy by continuously reorienting in the oscillating electric field, converting
      electromagnetic energy to thermal energy.
    needs:
    - microwaves
    - electric_field
    tier: 6
    source_domain: college_physics_ch24
  rainbow:
    defines: The arc of spectral colors produced when sunlight is refracted into a
      water droplet, reflected off its back surface, and refracted again on exit,
      with dispersion separating colors by wavelength.
    needs:
    - dispersion
    - law_of_reflection
    tier: 4
    source_domain: college_physics_ch25
  magnifying_glass:
    defines: A converging lens used with the object placed inside its focal length
      (case 2) to produce an upright, enlarged virtual image of the object.
    needs:
    - converging_lens
    - thin_lens_equations
    - virtual_image
    tier: 5
    source_domain: college_physics_ch25
  camera_lens:
    defines: A converging lens system that forms a real, inverted image of a distant
      object on film or a sensor when the object distance exceeds the focal length
      (case 1).
    needs:
    - converging_lens
    - thin_lens_equations
    - real_image
    tier: 5
    source_domain: college_physics_ch25
  corrective_eyeglasses:
    defines: Converging or diverging lenses prescribed in diopters to shift an out-of-focus
      image onto the retina, correcting farsightedness or nearsightedness respectively.
    needs:
    - converging_lens
    - diverging_lens
    - lens_power
    tier: 5
    source_domain: college_physics_ch25
  fiber_optics:
    defines: The technology of transmitting light signals along thin strands of glass
      or plastic by exploiting total internal reflection at the core-cladding boundary.
    needs:
    - total_internal_reflection
    tier: 6
    source_domain: college_physics_ch25
  corner_reflector:
    defines: An optical device consisting of two mutually perpendicular reflecting
      surfaces that returns incident light parallel to its original direction regardless
      of entry angle, using total internal reflection.
    needs:
    - total_internal_reflection
    tier: 6
    source_domain: college_physics_ch25
  diamond_sparkle:
    defines: The brilliance of diamonds arising from their very small critical angle
      (~24°) and high index of refraction, which cause most internal light to undergo
      total internal reflection and exit only through specific facets.
    needs:
    - total_internal_reflection
    - critical_angle
    tier: 6
    source_domain: college_physics_ch25
  concave_mirror_heater:
    defines: A converging spherical mirror used in devices such as room heaters and
      solar collectors to focus radiation from a source onto a target, with focal
      length f = R/2.
    needs:
    - spherical_mirror
    tier: 6
    source_domain: college_physics_ch25
  endoscope:
    defines: A medical instrument that uses bundled optical fibers and total internal
      reflection to transmit illuminating light into and reflected images out of the
      body through small openings.
    needs:
    - fiber_optics
    tier: 7
    source_domain: college_physics_ch25
  vision_correction_spectacles:
    defines: Placing a diverging or converging lens in front of the eye to adjust
      total optical power so images form on the retina.
    needs:
    - myopia
    - hyperopia
    - lens_power
    - concave_lens
    tier: 5
    source_domain: college_physics_ch26
  laser_vision_correction:
    defines: A surgical procedure using excimer laser pulses to reshape the cornea,
      correcting myopia, hyperopia, or astigmatism.
    needs:
    - myopia
    - hyperopia
    - astigmatism
    tier: 5
    source_domain: college_physics_ch26
  contact_lenses:
    defines: Corrective lenses worn directly on the eye that provide vision correction
      and compensate for corneal irregularities.
    needs:
    - myopia
    - hyperopia
    - lens_power
    tier: 5
    source_domain: college_physics_ch26
  reflecting_telescope:
    defines: A telescope using a concave mirror as its objective, enabling larger
      apertures and freedom from chromatic aberration.
    needs:
    - telescope
    - chromatic_aberration
    tier: 3
    source_domain: college_physics_ch26
  adaptive_optics:
    defines: Computer-controlled arrays of small mirrors that deform in real time
      to compensate for atmospheric turbulence and optical distortions.
    needs:
    - aberration
    - telescope
    tier: 2
    source_domain: college_physics_ch26
  electron_microscope:
    defines: A microscope using focused electron beams to achieve magnifications up
      to 50 million times, resolving individual atoms.
    needs:
    - compound_microscope
    tier: 2
    source_domain: college_physics_ch26
    also_in:
    - college_physics_ch29
  immersion_lens:
    defines: A microscope objective used with oil or water between lens and specimen
      to increase numerical aperture beyond 1.00.
    needs:
    - numerical_aperture
    - compound_microscope
    tier: 2
    source_domain: college_physics_ch26
  non_reflective_coatings:
    defines: Thin film coatings designed to produce destructive interference of reflected
      light, reducing reflections from lenses and optical surfaces.
    needs:
    - thin_film_interference
    tier: 4
    source_domain: college_physics_ch27
  spectroscopic_dispersion:
    defines: The use of diffraction gratings or interference patterns to separate
      light by wavelength for spectral analysis and wavelength measurement.
    needs:
    - diffraction_grating
    tier: 5
    source_domain: college_physics_ch27
  polarizing_filter:
    defines: A material composed of long aligned molecules that transmits only the
      component of an EM wave's electric field parallel to its axis, selectively blocking
      other polarization directions.
    needs:
    - polarization
    tier: 2
    source_domain: college_physics_ch27
  liquid_crystal_display:
    defines: A display technology using liquid crystals that rotate light polarization
      by 90° unless a voltage is applied, combined with polarizing filters to control
      light transmission in each pixel.
    needs:
    - polarizing_filter
    - optical_activity
    tier: 3
    source_domain: college_physics_ch27
  interference_microscopy:
    defines: Microscopy techniques that enhance contrast by exploiting wave interference,
      including interference microscopes, phase-contrast microscopes, and confocal
      microscopes.
    needs:
    - constructive_interference
    - destructive_interference
    - resolving_power
    tier: 6
    source_domain: college_physics_ch27
  michelson_morley_experiment:
    defines: The 1887 experiment that demonstrated the speed of light in a vacuum
      is independent of the motion of the Earth, providing key evidence for the second
      postulate.
    needs:
    - second_postulate
    tier: 2
    source_domain: college_physics_ch28
  twin_paradox:
    defines: A thought experiment illustrating that a twin traveling at relativistic
      speed ages less than the Earth-bound twin, resolved by noting the traveling
      twin undergoes acceleration.
    needs:
    - time_dilation
    tier: 4
    source_domain: college_physics_ch28
  muon_lifetime:
    defines: Experimental verification of time dilation and length contraction using
      cosmic ray muons, whose observed half-life increases with velocity exactly as
      predicted by γ.
    needs:
    - time_dilation
    - length_contraction
    tier: 4
    source_domain: college_physics_ch28
  gps_relativistic_corrections:
    defines: Global Positioning System satellites require relativistic time dilation
      corrections to maintain accurate position communication, failing within minutes
      without them.
    needs:
    - time_dilation
    tier: 4
    source_domain: college_physics_ch28
  x_ray_production:
    defines: The generation of x-ray photons by accelerating electrons through a high
      voltage and converting their kinetic energy into electromagnetic radiation upon
      striking an anode.
    needs:
    - photon_energy
    - electron
    tier: 5
    source_domain: college_physics_ch29
  x_ray_diffraction:
    defines: X-ray scattering from crystal lattices to determine atomic arrangements
      and molecular structures.
    needs:
    - electromagnetic_radiation
    - atom
    tier: 1
    source_domain: college_physics_ch30
  millikan_oil_drop_experiment:
    defines: Measurement of electron charge by balancing gravitational and electric
      forces on charged oil drops.
    needs:
    - electron_charge
    tier: 3
    source_domain: college_physics_ch30
  ct_scanner:
    defines: Computed tomography using x rays through body slices from many angles
      to produce cross-sectional images.
    needs:
    - bremsstrahlung
    tier: 3
    source_domain: college_physics_ch30
  holography:
    defines: Recording and reconstructing three-dimensional images using laser light
      interference patterns.
    needs:
    - laser
    tier: 7
    source_domain: college_physics_ch30
  periodic_table:
    defines: Organization of elements by atomic number into groups with similar chemical
      properties, explained by sequential shell filling.
    needs:
    - electron_configuration
    tier: 11
    source_domain: college_physics_ch30
  geiger_tube:
    defines: A gas-filled radiation detector that registers counts when ionizing radiation
      creates ion pairs attracted to electrodes.
    needs:
    - radiation_detector
    tier: 5
    source_domain: college_physics_ch31
  scintillator:
    defines: A radiation detection material that converts radiation energy into brief
      flashes of light.
    needs:
    - radiation_detector
    tier: 5
    source_domain: college_physics_ch31
  solid_state_detector:
    defines: A semiconductor device that converts ionization produced by radiation
      into an electrical signal proportional to deposited energy.
    needs:
    - radiation_detector
    tier: 5
    source_domain: college_physics_ch31
  photomultiplier:
    defines: A device that converts scintillator light into amplified electrical signals
      using cascaded photoelectric-effect stages.
    needs:
    - scintillator
    - photon
    tier: 6
    source_domain: college_physics_ch31
  radioactive_dating:
    defines: A technique for determining the age of materials by measuring the remaining
      fraction of a radioactive isotope.
    needs:
    - exponential_decay_law
    - isotope
    tier: 8
    source_domain: college_physics_ch31
  fission_bomb:
    defines: A nuclear weapon that rapidly assembles a supercritical mass of fissile
      material (uranium-235 or plutonium-239) using gun-type or implosion designs
      to produce an uncontrolled chain reaction.
    needs:
    - critical_mass
    tier: 4
    source_domain: college_physics_ch32
  nuclear_power_reactor:
    defines: A controlled fission device that uses enriched uranium fuel, a moderator,
      and control rods to sustain a critical chain reaction for electrical power generation.
    needs:
    - critical_mass
    - neutron_moderation
    tier: 4
    source_domain: college_physics_ch32
  cancer_radiotherapy:
    defines: The clinical application of ionizing radiation to treat cancer using
      geometric beam focusing, radioactive implants, or tagged antibodies to maximize
      the therapeutic ratio.
    needs:
    - radiotherapy
    - dose_equivalent
    tier: 4
    source_domain: college_physics_ch32
  thermonuclear_bomb:
    defines: A nuclear weapon that uses a fission bomb as a trigger to ignite fusion
      fuel (lithium deuteride), achieving virtually unlimited energy yields measured
      in megatons.
    needs:
    - fission_bomb
    - nuclear_fusion
    tier: 5
    source_domain: college_physics_ch32
  medical_imaging:
    defines: The use of radiopharmaceuticals and radiation detectors such as Anger
      cameras, SPECT, and PET to produce diagnostic images of organ function and disease.
    needs:
    - spect
    - pet
    tier: 5
    source_domain: college_physics_ch32
  particle_accelerator:
    defines: A device that accelerates charged particles to high energies for collisions
      that reveal subatomic structure and create new particles from energy via E =
      mc².
    needs:
    - conservation_of_mass_energy
    - electromagnetic_force
    - cyclotron
    - synchrotron
    - colliding_beams
    tier: 3
    source_domain: college_physics_ch33
  cosmic_ray_experiments:
    defines: Observations of high-energy particles from space interacting with the
      atmosphere, historically used to discover pions, muons, and other particles.
    needs:
    - conservation_of_mass_energy
    - antimatter
    - pion
    tier: 3
    source_domain: college_physics_ch33
  proton_decay_detection:
    defines: Experimental efforts to observe the extremely rare predicted decay of
      protons (lifetime ~10³⁹ years) as evidence for grand unified theories.
    needs:
    - grand_unified_theory
    - baryon_number_conservation
    tier: 8
    source_domain: college_physics_ch33
  quasar:
    defines: A distant galaxy with an extremely energetic core powered by a forming
      supermassive black hole.
    needs:
    - galaxy
    - black_hole
    tier: 4
    source_domain: college_physics_ch34
  gravitational_wave_detection:
    defines: The direct observation of gravitational waves using laser interferometers
      such as LIGO.
    needs:
    - gravitational_waves
    tier: 4
    source_domain: college_physics_ch34
